/* How much of the room you have to get right to resolve it.
   A regular room leaves slack: miss a couple and the patient still stabilizes,
   which is what makes an ordinary shift playable. A CRITICAL room does not -
   the emergencies are the ones you have to know cold, so they ask for 90%.
   Simulated over 4,000 fights each: at 80% accuracy a regular room is won 62%
   of the time and a critical one 28%; at 90% it is 92% and 66%. */
const DH_MARGIN=0.75, DH_MARGIN_CRIT=0.90;
function bossMax(b){return 1+FIGHT_ROUNDS.slice(1).reduce((n,r)=>n+b[r.k].yes.length,0);}
function bossHp(b){return Math.max(1,Math.ceil(bossMax(b)*(b.boss?DH_MARGIN_CRIT:DH_MARGIN)));}
/* Three other diseases to name it against: the same class and the same kind
   first, so the distractors are the ones the exam would actually use. */
function dxOptions(b){
  const same=x=>x.id!==b.id;
  let pool=BOSSES.filter(x=>same(x)&&bossCourse(x)===bossCourse(b)&&x.kind===b.kind);
  if(pool.length<3)pool=pool.concat(BOSSES.filter(x=>same(x)&&bossCourse(x)===bossCourse(b)&&x.kind!==b.kind));
  if(pool.length<3)pool=pool.concat(BOSSES.filter(x=>same(x)&&bossCourse(x)!==bossCourse(b)));
  const seen={};pool=pool.filter(x=>!seen[x.id]&&(seen[x.id]=true));
  return shuffle(pool).slice(0,3).map(x=>({t:x.name,ok:false})).concat([{t:b.name,ok:true}]);
}
const roomOf=b=>{const c=bossCourse(b), list=BOSSES.filter(x=>bossCourse(x)===c);
  const floor=studyCourses().findIndex(x=>x.code===c)+1||1;
  return String(floor)+String(list.indexOf(b)+1).padStart(2,"0");};
/* ---------------------------------------------------------------------------
   TWO KINDS OF FIGHT

   A BOSS is hand-written off the decks: four named rounds, pick-all-that-apply,
   and the wrong answers are the right answers for a different boss on the same
   deck. Best content, but a fixed set - play it four times and you are
   remembering which chips were green.

   A WARD ROUND is assembled from the question bank on the spot: eight real
   questions from that topic, due and unanswered ones first. It never runs out,
   it covers any topic the bank covers, and - the part that matters - every
   answer goes back into the bank. Get one wrong in here and it lands in your
   misses and comes back tomorrow, exactly as it would in Study. */
const WARD_N=8;
function bossRounds(b){
  /* Round one: you do not know what it is. The chart gives the presentation;
     you name it. Then the three rounds after ask about it by name. */
  const dx={title:FIGHT_ROUNDS[0].t, dx:true, single:true,
    ask:'On the chart: <b>'+esc(b.sym.yes.map(x=>x.charAt(0).toLowerCase()+x.slice(1)).join(" \u00b7 "))+'</b>. What is it?',
    why:b.tag?b.name+" \u2014 "+b.tag+".":"",
    opts:shuffle(dxOptions(b))};
  return [dx].concat(FIGHT_ROUNDS.slice(1).map(R=>({
    title:R.t, ask:R.q+' <b>'+esc(b.name)+'</b>? Pick all that apply.',
    opts:shuffle(b[R.k].yes.map(x=>({t:x,ok:true})).concat(b[R.k].no.map(x=>({t:x,ok:false}))))
  })));
}
function wardPool(courseId,unit){
  return S.questions.filter(q=>!q.prime&&q.courseId===courseId&&(q.unit||"")===unit);
}
function wardRounds(courseId,unit){
  const pool=wardPool(courseId,unit);
  const open=stillOpen(pool), rest=pool.filter(q=>open.indexOf(q)<0);
  const use=shuffle(open.slice()).concat(shuffle(rest.slice())).slice(0,WARD_N);
  return use.map((q,i)=>({
    title:"Case "+(i+1), ask:esc(q.stem), single:true, qid:q.id, why:q.rationale,
    opts:shuffle(q.options.map((o,oi)=>({t:o,ok:oi===q.answer,qid:q.id,oi:oi})))
  }));
}
/* a ward round goes down when three quarters of it lands */
const wardHp=n=>Math.max(1,Math.ceil(n*0.75));
/* a topic name a tile can actually hold */
function wardName(unit){
  const P=unitParts(unit);
  let n=P.leaf||unit;
  n=n.charAt(0).toUpperCase()+n.slice(1);
  if(n.length>30){
    const cut=n.slice(0,30);
    const sp=cut.lastIndexOf(" ");
    n=(sp>14?cut.slice(0,sp):cut)+"\u2026";
  }
  return n;
}
function fightStart(id){
  const b=BOSSES.find(x=>x.id===id);if(!b)return;
  fightBegin(b,bossRounds(b),bossHp(b),fightSecs(b));
}
function wardStart(courseId,unit){
  const rs=wardRounds(courseId,unit);
  if(!rs.length){toast("No questions yet","This topic has nothing in the bank to fight with.");return;}
  const P=unitParts(unit), nm=P.leaf?P.leaf.charAt(0).toUpperCase()+P.leaf.slice(1):unit;
  const c=courseById(courseId)||{};
  void P;
  fightBegin({id:"ward:"+courseId+"||"+unit,ward:true,courseId:courseId,unit:unit,
    name:nm,kind:artKind(unit),course:c.code,tag:"a ward round \u2014 straight from your bank"},
    rs,wardHp(rs.length),FIGHT_ROUND_S+(owns("k_overtime")?10:0));
}
function fightBegin(b,rounds,hp,secs){
  if(FIGHT&&FIGHT.timer)clearInterval(FIGHT.timer);
  FIGHT={b:b,rounds:rounds,r:0,hp:hp,hpMax:hp,hearts:fightHearts(),secs:secs,picked:{},locked:false,
         hits:0,ouch:0,missed:0,answered:0,over:null,ends:0,timer:null,log:[],
         known:!!b.ward||!rounds[0].dx};          // a ward round has no diagnosis to hide
  fightRoundStart();
  tab="fight";render();window.scrollTo(0,0);
}
function fightRoundStart(){
  const F=FIGHT;
  const R=F.rounds[F.r];
  F.opts=R.opts.map(o=>({t:o.t,ok:o.ok,qid:o.qid,oi:o.oi}));
  /* the second opinion from the locker crosses out one wrong answer before you
     have read them - a hint, not an answer */
  if(owns("k_second")){const wrong=F.opts.filter(o=>!o.ok);if(wrong.length)wrong[Math.floor(Math.random()*wrong.length)].cut=true;}
  F.picked={};F.locked=false;F.result=null;
  F.ends=Date.now()+F.secs*1000;
  if(F.timer)clearInterval(F.timer);
  F.timer=setInterval(fightTick,100);
}
function fightTick(){
  const F=FIGHT;if(!F||F.locked||F.over){return;}
  const left=Math.max(0,F.ends-Date.now());
  const bar=document.getElementById("fbar"), clk=document.getElementById("fclock");
  if(bar)bar.style.width=(left/(F.secs*1000)*100).toFixed(1)+"%";
  if(clk)clk.textContent=Math.ceil(left/1000);
  if(bar&&left<5000)bar.classList.add("low");
  if(left<=0)fightLock();
}
function fightToggle(i){
  const F=FIGHT;if(!F||F.locked||F.over||(F.opts[i]&&F.opts[i].cut))return;
  F.picked[i]=!F.picked[i];
  const el=document.querySelector('[data-fopt="'+i+'"]');
  if(el)el.setAttribute("aria-pressed",String(!!F.picked[i]));
  const n=Object.keys(F.picked).filter(k=>F.picked[k]).length;
  const lk=document.getElementById("fLock");if(lk)lk.textContent=n?"Lock in "+n:"Lock in";
}
/* Every option resolves at once: a right pick lands, a wrong pick hits you,
   and a right answer you did not pick is shown so the miss teaches something. */
function fightLock(){
  const F=FIGHT;if(!F||F.locked||F.over)return;
  F.locked=true;if(F.timer){clearInterval(F.timer);F.timer=null;}
  const R=F.rounds[F.r];
  let hits=0,ouch=0,missed=0;
  F.opts.forEach((o,i)=>{
    const p=!!F.picked[i];
    if(o.ok&&p)hits++;else if(!o.ok&&p)ouch++;else if(o.ok&&!p)missed++;
  });
  if(R.single){                       // one real question: right or wrong, nothing in between
    const pick=F.opts.findIndex((o,i)=>F.picked[i]);
    const ok=pick>=0&&F.opts[pick].ok;
    hits=ok?1:0; ouch=ok?0:(pick>=0?1:0); missed=0;
    /* the whole point of a ward round: the answer goes back into the bank, so
       a miss lands in your misses and the schedule brings it around again */
    const q=S.questions.find(x=>x.id===R.qid);
    if(q&&pick>=0){
      q.seen=(q.seen||0)+1;q.lastSeen=today();
      if(ok)q.wrong=Math.max(0,(q.wrong||0)-1);
      else{q.wrong=(q.wrong||0)+1;logMiss(q,F.opts[pick].oi);}
      schedule(q,ok&&(q.wrong||0)===0);
      S.profile.answered++;if(ok)S.profile.correct++;
      S.profile.curRun=ok?(S.profile.curRun||0)+1:0;
      S.profile.bestRun=Math.max(S.profile.bestRun||0,S.profile.curRun);
      saveQuestions([q]);F.answered++;
    }
  }
  /* Standing there is not safe. Lock nothing in - or let the clock run out
     with nothing picked - and the disease gets a shot in. */
  const froze=!Object.keys(F.picked).some(k=>F.picked[k]);
  if(froze)ouch=1;
  F.froze=froze;
  /* the four rounds in a room are their own questions - the first time you
     play one it counts toward the ladder, and never again */
  {const p=S.profile;p.fightSeen=p.fightSeen||{};
   const key=F.b.ward?null:(F.b.id+":"+F.r);
   if(key&&!p.fightSeen[key]){p.fightSeen[key]=1;}}
  if(R.dx){
    /* right or wrong, the chart now says what it is - a wrong call still teaches */
    F.dxOk=hits>0;F.known=true;F.revealing=true;
    const p=S.profile;p.dxKnown=p.dxKnown||{};p.dxKnown[F.b.id]=true;
  }
  F.hp=Math.max(0,F.hp-hits);F.hearts=Math.max(0,F.hearts-ouch);   // extra right answers still pay XP
  F.hits+=hits;F.ouch+=ouch;F.missed+=missed;
  F.result={hits:hits,ouch:ouch,missed:missed};
  F.log.push({round:F.rounds[F.r].title,hits:hits,ouch:ouch,missed:missed});
  /* keep the round itself, so the end screen can show exactly what went wrong */
  F.review=F.review||[];
  F.review.push({title:R.title,ask:R.ask,why:R.why||"",dx:!!R.dx,froze:froze,
    opts:F.opts.map((o,i)=>({t:o.t,ok:o.ok,picked:!!F.picked[i],cut:!!o.cut}))});
  F.played=false;
  render();
  /* the fight is at the top of the page and the options are below it; the
     bolts are the point, so bring the arena back into view before they fly */
  window.scrollTo({top:0,behavior:"smooth"});
  fightPlay(hits,ouch,()=>{
    F.played=true;
    if(F.hearts<=0)return fightEnd("lost");
    const nx=document.getElementById("fNext");if(nx)nx.disabled=false;
    setDH(F.hp,F.hpMax);
  });
}
/* ---------------------------------------------------------------------------
   THE ATTACK ANIMATION

   Healing energy from your nurse's hands, one bolt per hit, each one landing
   on the disease and knocking its bar down a notch. Then, if you picked
   something wrong, the disease answers with dark energy, one bolt per wrong
   pick, and a heart goes. Positions are read off the screen so the bolts start
   at the hands and end on the creature at any size. */
/* The healing energy radiates: seven streams fanning out of the hand toward
   the disease, white where they leave the hand and turning colour as they go -
   each stream its own hue, so by the far end the spray is every colour at
   once. It grows in from the hand, flows while the hits land, and fades. */
function healStream(fx,from,to,hits,onHit,done){
  const uid=++AV_UID;
  const EN=ENERGY_BY[S.profile.energy]||ENERGY_BY.aurora;
  const HUES=EN.hues;
  const dx=to.x-from.x, dy=to.y-from.y, base=Math.atan2(dy,dx), len=Math.hypot(dx,dy);
  let defs='<filter id="glow'+uid+'" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>'+
           '<filter id="blur'+uid+'" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>';
  let paths='', puffs='';
  const mid_i=(HUES.length-1)/2;
  HUES.forEach((h,i)=>{
    const spread=(i-mid_i)*(HUES.length>7?0.075:0.095);      // fan: about ±33° at the far end
    const a1=base+spread;
    /* the control point bends each stream a little differently, and the end
       lands around the creature rather than on one spot */
    const ex=to.x+Math.cos(a1+Math.PI/2)*((i-mid_i)*3.2), ey=to.y+Math.sin(a1+Math.PI/2)*((i-mid_i)*3.2);
    const bend=12+(i%3)*5;
    const cx=from.x+Math.cos(a1)*len*0.5-Math.sin(a1)*bend, cy=from.y+Math.sin(a1)*len*0.5-Math.cos(a1)*bend-(6+(i%2)*5);
    const d='M'+from.x+' '+from.y+' Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+ex.toFixed(1)+' '+ey.toFixed(1);
    defs+='<linearGradient id="hg'+uid+'_'+i+'" gradientUnits="userSpaceOnUse" x1="'+from.x+'" y1="'+from.y+'" x2="'+ex.toFixed(1)+'" y2="'+ey.toFixed(1)+'">'+
      '<stop offset="0" stop-color="#ffffff"/><stop offset=".38" stop-color="#ffffff"/>'+
      '<stop offset=".7" stop-color="'+h+'" stop-opacity=".85"/><stop offset="1" stop-color="'+h+'"/></linearGradient>';
    paths+='<path class="ray" d="'+d+'" pathLength="100" stroke="url(#hg'+uid+'_'+i+')" style="animation-delay:'+(i*0.07).toFixed(2)+'s"/>';
    if(i%2===0)puffs+='<circle r="4" fill="#fff" opacity=".8" filter="url(#blur'+uid+')">'+
      '<animateMotion dur="0.6s" begin="'+(i*0.05).toFixed(2)+'s" repeatCount="indefinite" path="'+d+'"/>'+
      '<animate attributeName="r" values="3;9" dur="0.6s" begin="'+(i*0.05).toFixed(2)+'s" repeatCount="indefinite"/>'+
      '<animate attributeName="fill" values="#ffffff;'+h+'" dur="0.6s" begin="'+(i*0.05).toFixed(2)+'s" repeatCount="indefinite"/></circle>';
  });
  const mid='M'+from.x+' '+from.y+' Q'+((from.x+to.x)/2).toFixed(1)+' '+(Math.min(from.y,to.y)-12).toFixed(1)+' '+to.x+' '+to.y;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","stream");
  svg.innerHTML='<defs>'+defs+'</defs>'+
    '<path class="haze" d="'+mid+'" pathLength="100" filter="url(#glow'+uid+')"/>'+
    paths+puffs+
    '<circle class="hand" cx="'+from.x+'" cy="'+from.y+'" r="14" fill="#fff" filter="url(#glow'+uid+')"/>';
  fx.appendChild(svg);
  requestAnimationFrame(()=>svg.classList.add("on"));
  let i=0;
  const tick=()=>{
    if(i>=hits){setTimeout(()=>{svg.classList.add("off");setTimeout(()=>{svg.remove();done();},380);},260);return;}
    i++;onHit();
    svg.classList.remove("pulse");void svg.getBBox();svg.classList.add("pulse");
    setTimeout(tick,300);
  };
  setTimeout(tick,460);
}
/* A ring at the point of impact. Healing energy CLOSES a ring around the
   disease - containment. Dark energy OPENS one on the nurse - spread. Same
   shape, opposite motion, and neither is a flash or a projectile. */
function ring(fx,at,kind,color){
  const e=document.createElement("i");e.className="fxring "+kind;
  e.style.left=at.x+"px";e.style.top=at.y+"px";if(color)e.style.setProperty("--rc",color);
  fx.appendChild(e);setTimeout(()=>e.remove(),750);
}
/* The disease does not shoot. It spreads: a bank of dark cloud rolls off it,
   drifts across the floor and breaks over the nurse, one wave per wrong pick. */
function darkCloud(fx,from,to,n,onHit,done){
  const uid=++AV_UID;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","stream miasma");
  let puffs='';
  const N=16;
  for(let k=0;k<N;k++){
    const wob=((k%2)?1:-1)*(10+(k*7)%26), lift=18+(k*11)%34;
    const cx=(from.x+to.x)/2+wob, cy=Math.min(from.y,to.y)-lift+(k%3)*12;
    const d='M'+from.x+' '+from.y+' Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+(to.x+((k%3)-1)*14)+' '+(to.y+((k%2)?10:-8));
    const dur=(0.78+(k%4)*0.09).toFixed(2), beg=(k*0.045).toFixed(2);
    const col=k%3===0?'#9B5DE5':k%3===1?'#2A1D6B':'#4C2F8F';
    puffs+='<circle r="8" fill="'+col+'" opacity="0" filter="url(#mb'+uid+')">'+
      '<animateMotion dur="'+dur+'s" begin="'+beg+'s" fill="freeze" path="'+d+'"/>'+
      '<animate attributeName="r" values="6;26;19" dur="'+dur+'s" begin="'+beg+'s" fill="freeze"/>'+
      '<animate attributeName="opacity" values="0;.9;.7" dur="'+dur+'s" begin="'+beg+'s" fill="freeze"/></circle>';
  }
  svg.innerHTML='<defs><filter id="mb'+uid+'" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter></defs>'+puffs;
  fx.appendChild(svg);
  let i=0;
  const tick=()=>{
    if(i>=n){setTimeout(()=>{svg.classList.add("off");setTimeout(()=>{svg.remove();done();},380);},220);return;}
    i++;onHit();ring(fx,to,"dark");
    setTimeout(tick,330);
  };

function fightPlay(hits,ouch,done){
  const F=FIGHT, arena=document.getElementById("arena"), fx=document.getElementById("fx");
  const msg=document.getElementById("fmsg"), nx=document.getElementById("fNext");
  if(!arena||!fx){done();return;}

  /* the arena may still be mid-zoom (the room opening) when this runs, so every
     point is divided back into the arena's own coordinate space */
  const sc=A.width/(arena.offsetWidth||A.width)||1;
  const at=(el,fx,fy)=>{const r=el.getBoundingClientRect();return {x:(r.left-A.left+r.width*fx)/sc,y:(r.top-A.top+r.height*fy)/sc};};
  const nurseBox=document.getElementById("nurseEl"), foeBox=document.getElementById("foeEl");
  /* the beam leaves the hand itself - the avatar carries a marker at the
     fingertips - and lands on the middle of the creature, not near it */
  const hp=document.querySelector("#nurseEl .handpt");

  const foe=at(foeBox,0.5,0.5);
  const chest=at(nurseBox,0.5,0.42);
  const say=t=>{if(msg){msg.textContent=t;msg.classList.remove("pop");void msg.offsetWidth;msg.classList.add("pop");}};
  const steps=[];
  const nurse=document.getElementById("nurseEl"), foeEl=document.getElementById("foeEl");
  const HUES=(ENERGY_BY[S.profile.energy]||ENERGY_BY.aurora).hues;let hi=0;
  let hpNow=F.hp+hits, heartsNow=F.hearts+ouch;
  if(hits){
    steps.push(cb=>{say("Hands on. Healing energy flows.");nurse.classList.add("cast");setTimeout(cb,300);});
    steps.push(cb=>{
      healStream(fx,hand,foe,hits,()=>{
        foeEl.classList.remove("hit");void foeEl.offsetWidth;foeEl.classList.add("hit");
        hpNow--;setDH(hpNow,F.hpMax);

      },cb);
    });
    steps.push(cb=>{nurse.classList.remove("cast");say(hits+" hit"+(hits===1?"":"s")+"."+(hits>=4?" Textbook.":hits>=2?" It is losing ground.":""));setTimeout(cb,520);});
  }
  if(ouch){
    steps.push(cb=>{say(F.b.name+" flares. Dark energy.");foeEl.classList.add("cast");setTimeout(cb,420);});

      darkCloud(fx,{x:foe.x-20,y:foe.y+10},chest,ouch,()=>{
        nurse.classList.remove("ouch");void nurse.offsetWidth;nurse.classList.add("ouch");
        heartsNow--;const hs=document.querySelectorAll("#fhearts .fheart.on");
        const last=hs[hs.length-1];if(last){last.classList.add("lost");setTimeout(()=>{last.classList.remove("on","lost");last.textContent="\u2661";},420);}
        arena.classList.remove("shake");void arena.offsetWidth;arena.classList.add("shake");
      },cb);
    });
    steps.push(cb=>{foeEl.classList.remove("cast");say("That cost you "+ouch+" heart"+(ouch===1?"":"s")+".");setTimeout(cb,500);});
  }
  if(F.rounds[F.r].dx)steps.unshift(cb=>{
    say(F.dxOk?"Dx confirmed: "+F.b.name+".":F.froze?"No call made. The chart says "+F.b.name+".":"Wrong call. The chart says "+F.b.name+".");
    const fe=document.getElementById("foeEl");if(fe){fe.classList.remove("unresolved");fe.classList.add("resolving");}
    const nm=document.getElementById("foeName");if(nm){nm.textContent=F.b.name;nm.classList.remove("pending");}
    const h1=document.getElementById("fightH1");if(h1)h1.textContent="Room "+roomOf(F.b)+" \u00b7 "+F.b.name;
    setTimeout(cb,1100);});
  if(F.froze)steps.unshift(cb=>{say("You froze. Nothing charted.");setTimeout(cb,700);});
  else if(!hits&&!ouch)steps.push(cb=>{say("Nothing landed. "+(F.result.missed?F.result.missed+" of the right answers were sitting there.":""));setTimeout(cb,500);});
  if(F.result.missed&&(hits||ouch))steps.push(cb=>{say(F.result.missed+" right answer"+(F.result.missed===1?"":"s")+" missed — shown in amber.");setTimeout(cb,300);});
  if(hpNow<=0)steps.push(cb=>{foeEl.classList.add("down");say(F.b.name+" \u2014 resolved. Patient stable.");setTimeout(cb,500);});

function fightNext(){
  const F=FIGHT;if(!F||!F.locked||F.over||!F.played)return;
  if(F.hp<=0)return fightEnd("won");
  if(F.r>=F.rounds.length-1)return fightEnd(F.hp<=0?"won":"escaped");
  F.r++;fightRoundStart();render();window.scrollTo(0,0);
}
function fightEnd(how){
  const F=FIGHT;if(!F||F.over)return;
  F.over=how;if(F.timer){clearInterval(F.timer);F.timer=null;}
  const p=S.profile;
  p.fights=(p.fights||0)+1;
  p.beaten=p.beaten||{};
  let xp=F.hits*10, cash=0;
  if(how==="won"){
    /* Money comes from NEW ground. The first win over a disease pays the
       purse; farming the same easy one again pays a fraction, so the way to
       fill the locker is to go beat the next thing, not the last thing. */
    const first=!p.beaten[F.b.id];
    p.fightWins=(p.fightWins||0)+1;p.beaten[F.b.id]=(p.beaten[F.b.id]||0)+1;xp+=60;
    let purse=F.b.ward?FIGHT_WARD_PURSE:FIGHT_PURSE+(F.b.boss?15:0);
    if(!first)purse=Math.round(purse*FIGHT_REPEAT);
    cash=purse;
    if(F.ouch===0&&F.missed===0){xp+=40;cash+=first?15:5;}
    F.first=first;
    p.fightDollars=(p.fightDollars||0)+cash;}
  F.xp=xp;F.cash=cash;
  if(F.hits||F.ouch){logStudyDay();earnXp(xp);bumpToday(F.b.ward?(F.answered||0):F.rounds.length);}
  if(how==="won"){confetti(70);toast("+"+xp+" XP \u00b7 +$"+cash,F.first?"Spend it in the locker \u2014 bay 109 has new energy, bay 110 has kit.":"A repeat pays less. New diseases pay full.",true);}
  else if(xp)toast("+"+xp+" XP","Every hit counts, even in a loss.");
  saveCore();checkTrophies();render();
}
/* The end of a fight says how many you missed. This says WHICH: each round
   that had a wrong pick or an unpicked right answer, with every option marked,

function fightReview(F){
  const rounds=(F.review||[]).filter(r=>r.opts.some(o=>(o.ok&&!o.picked)||(!o.ok&&o.picked)));
  if(!rounds.length)return '<div class="frev clean"><b>Clean run.</b> Every pick was right and nothing was missed.</div>';
  return '<div class="frev" id="fRev" hidden>'+rounds.map(r=>
    '<div class="frevr">'+
      '<div class="frevh"><b>'+esc(r.title)+'</b>'+(r.froze?'<i>you froze</i>':'')+'</div>'+
      '<div class="frevq">'+r.ask+'</div>'+
      '<div class="frevo">'+r.opts.map(o=>{
        const k=o.ok?(o.picked?'right':'missed'):(o.picked?'wrong':'quiet');
        const mark=k==='right'?'\u2713':k==='missed'?'\u25cb':k==='wrong'?'\u2717':'';
        return '<span class="fo '+k+'"><em>'+mark+'</em>'+esc(o.t)+
          (k==='missed'?'<u>right \u2014 not picked</u>':k==='wrong'?'<u>picked \u2014 wrong</u>':'')+'</span>';}).join("")+'</div>'+
      (r.why?'<div class="frevw"><span class="eyebrow">Why</span>'+esc(r.why)+'</div>':'')+
    '</div>').join("")+'</div>';
}

/* The disease's bar in the words a hospital reports a patient in: critical,
   serious, fair, good - and resolved when it is gone. */
function condWord(hp,max){
  if(hp<=0)return {w:"Resolved",c:"c0"};
  const f=hp/Math.max(1,max);
  return f>0.75?{w:"Critical",c:"c4"}:f>0.5?{w:"Serious",c:"c3"}:f>0.25?{w:"Fair",c:"c2"}:{w:"Good",c:"c1"};
}

/* ---------------------------------------------------------------------------
   TERRAIN

   Two maps, the eye and the ear, each with eight structures and nothing
   numbered. Tap one and it lights while the rest fade; the card under the map
   names it in plain words, says what it does, and then what to think of -
   the lens is FOCUS and you think cataract; the drainage angle is THE DRAIN
   and you think open-angle glaucoma. One special move per map: Follow the
   fluid runs a droplet from the ciliary body out through the drain and then
   names the two ways it fails; Follow the sound does the same from the pinna
   to the nerve, ending in conductive against sensorineural. Everything said
   here is from the 308 decks and the class recordings. */
/* The structure questions each map ends on: the ones tagged for it, plus the
   bank questions that are really about a structure. Open first, then the rest. */
const TERRAIN_EXTRA={eye:["308-w1-62","308-w1-70","308-w1-72","308-w1-64","308-w1-10","308-w1-115"],ear:["308-w1-29","308-w1-36","308-w1-41","308-w1-40"]};
function terrainQuestions(kind){
  const by={};S.questions.forEach(q=>{by[q.id]=q;});
  const tagged=S.questions.filter(q=>q.struct===kind&&!q.prime);
  const extra=(TERRAIN_EXTRA[kind]||[]).map(id=>by[id]).filter(Boolean);
  const all=tagged.concat(extra.filter(q=>tagged.indexOf(q)<0));
  const open=stillOpen(all), rest=all.filter(q=>open.indexOf(q)<0);
  return shuffle(open.slice()).concat(shuffle(rest.slice()));
}

/* tap a structure: it lights, the rest fade, the card fills in */
function wireTerrain(root){
  const R=root||document;
  R.querySelectorAll(".terrain").forEach(T=>{
    const kind=T.dataset.terrain, map=T.querySelector(".tmap"), card=T.querySelector("#tcard");
    let cur=null, timer=null;
    const light=(ks,dim)=>{
      T.querySelectorAll(".part,.lbl [data-k],.tchip[data-k]").forEach(e=>e.classList.toggle("hot",!!ks&&ks.indexOf(e.dataset.k)>=0));
      map.classList.toggle("dim",!!dim);
    };
    const pick=k=>{
      if(timer){clearTimeout(timer);timer=null;}
      const d=T.querySelector(".drop");if(d)d.setAttribute("opacity","0");
      cur=k;light(k?[k]:null,!!k);
      card.innerHTML=k?terrainCard(kind,k):'<div class="tprompt">'+esc(TERRAIN[kind].note)+' <b>Tap a structure.</b></div>';
    };
    T.querySelectorAll(".part,.lbl [data-k],.tchip[data-k]").forEach(e=>{
      e.addEventListener("click",ev=>{ev.stopPropagation();pick(cur===e.dataset.k?null:e.dataset.k);});
    });
    T.addEventListener("click",ev=>{const b=ev.target.closest("[data-testme]");if(b){ev.stopPropagation();terrainTest(b.dataset.testme);}});
    /* Follow the fluid / the sound */
    const F=TERRAIN[kind].follow;
    T.querySelector("[data-follow]").onclick=()=>{
      if(timer){clearTimeout(timer);timer=null;}
      cur=null;
      const still=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const drop=T.querySelector(".drop"), an=T.querySelector("#"+F.anim);
      const total=still?0:(an?parseFloat(an.getAttribute("dur"))*1000:3000);
      const stepBox=()=>'<div class="tsteps">'+F.steps.map((t,i)=>'<span data-step="'+i+'">'+esc(t)+'</span>').join("")+'</div>';
      const verdict='<div class="tverdict">'+F.verdict.map(v=>'<div class="tv"><span class="tvi">'+v.icon+'</span><span><b>'+esc(v.name)+':</b> '+esc(v.text)+'</span></div>').join("")+'</div>'+
        '<div class="ttest"><span>Got it?</span><button type="button" class="btn primary sm" data-testme="'+kind+'">Test me on the structures</button></div>';
      card.innerHTML='<div class="tc"><span class="tchead">'+esc(F.btn.toUpperCase())+'</span>'+stepBox()+'<div id="tverd"></div></div>';
      light(F.route,true);
      if(drop){drop.setAttribute("opacity","1");if(an&&!still)an.beginElement();}
      const spans=card.querySelectorAll("[data-step]");
      const n=spans.length;
      const at=i=>{spans.forEach((sp,j)=>sp.classList.toggle("on",j<=i));};
      if(still){at(n-1);card.querySelector("#tverd").innerHTML=verdict;return;}
      let i=0;at(0);
      const tick=()=>{i++;if(i<n){at(i);timer=setTimeout(tick,total/n);}else{card.querySelector("#tverd").innerHTML=verdict;timer=null;}};
      timer=setTimeout(tick,total/n);
    };
  });
}
function openTerrain(kind){

/* ---------------------------------------------------------------------------
   THE BINDER

   A course is not a flat pile of questions, and studying for Thursday's exam
   is not the same as studying the course. The bank already knows the shape -
   every question carries the exam it counts toward and the module it came
   from - it just was not shown anywhere, so the only way in was "everything at
   once" or "one level across everything".

   Course -> Exam -> Module. Take a single module, or take the whole exam and
   let it shuffle. */
/* ---------------------------------------------------------------------------
   THE BINDER READS LIKE A BINDER

   Unit names arrive as "Content 2 — Sensory: vision" and "Content 2 — Sensory:
   hearing & balance", and listing them flat printed "Content 2" twice, which
   reads as a bug rather than as two sections of the same content. They are one
   divider with two tabs behind it, so that is how they are drawn.

   The exam title also says "content 1-4" while only 1 and 2 have questions, so
   the range is read off the title and the missing ones are listed as missing
   rather than left to look like an error. */
function unitParts(u){
  const m=/^\s*(Content|Module|Week|Unit)\s*(\d+)\s*[\u2014\u2013:\-]\s*(.*)$/.exec(u||"");
  if(!m)return {key:u||"Unsorted",kind:"",no:null,head:u||"Unsorted",leaf:u||"Unsorted"};
  const rest=m[3], c=rest.split(":");
  return {key:m[1]+" "+m[2], kind:m[1], no:+m[2],
    head:(c.length>1?c[0]:rest).trim(),
    leaf:(c.length>1?c.slice(1).join(":"):rest).trim()};
}
function unitGroups(ex){
  const g={};
  Object.keys(ex.units).forEach(u=>{
    const P=unitParts(u);
    g[P.key]=g[P.key]||{key:P.key,kind:P.kind,no:P.no,heads:{},rows:[]};
    g[P.key].heads[P.head]=1;
    g[P.key].rows.push({unit:u,leaf:P.leaf,head:P.head,qs:ex.units[u]});
  });
  return Object.keys(g).map(k=>{
    const x=g[k], heads=Object.keys(x.heads);
    x.rows.sort((a,b)=>a.leaf.localeCompare(b.leaf));
    x.title=x.no!==null
      ? x.kind+" "+x.no+(heads.length===1?" \u2014 "+heads[0]:"")
      : k;
    x.single=x.rows.length===1;
    x.qs=[].concat.apply([],x.rows.map(r=>r.qs));
    return x;
  }).sort((a,b)=>(a.no===null||b.no===null)?String(a.key).localeCompare(String(b.key)):a.no-b.no);
}
/* "content 1-4", "content 5, 6, 7, 8", "content 9-11" - whatever she titled it */
function titleContents(title){
  const m=/content\s+([\d,\s\u2013\u2014-]+)/i.exec(title||"");
  if(!m)return [];
  const out={};
  m[1].split(",").forEach(part=>{
    const r=/(\d+)\s*[\u2013\u2014-]\s*(\d+)/.exec(part);
    if(r){for(let i=+r[1];i<=+r[2]&&i-+r[1]<40;i++)out[i]=1;}
    else{const n=parseInt(part,10);if(!isNaN(n))out[n]=1;}
  });
  return Object.keys(out).map(Number).sort((a,b)=>a-b);
}
const exQs=ex=>[].concat.apply([],Object.keys(ex.units).map(u=>ex.units[u]));
const binderOrder=t=>Object.keys(t).sort((a,b)=>{
  const A=t[a].ev,B=t[b].ev;return (A&&B)?A.date.localeCompare(B.date):A?-1:B?1:0;});
function binderTree(){
  const t={};
  filteredQuestions().forEach(q=>{
    const ex=q.gate||"none";
    t[ex]=t[ex]||{ev:S.events.find(e=>e.sid===q.gate)||null,units:{},n:0};
    const u=q.unit||"Unsorted";

/* ---------------------------------------------------------------------------
   A QUESTION YOU HAVE ANSWERED RIGHT IS DONE

   Every round used to draw from the whole bank, so getting fourteen questions
   right meant seeing those same fourteen again on the next run. That is not
   studying, it is scrolling past what you know to reach the two you don't.

   So a normal round only serves what is still open: never answered, or answered
   wrong and not yet put right. When a set has nothing open left it says so, and
   the only way back into it is Review, which is deliberate and separate. Review
   still counts - get one wrong in there and it reopens. */
/* ---------------------------------------------------------------------------
   SPACED REPETITION

   Getting a question right once is not knowing it. The app used to treat it as
   final: answer correctly and that question was gone for the semester, which is
   why a course went quiet the moment you cleared it - nothing was ever coming
   back, so there was no reason to open the app tomorrow.

   Each question now sits in a box. Get it right and it moves up a box and goes
   away for that many days; get it wrong and it drops to the bottom and comes
   back immediately. The intervals widen the way the forgetting curve does, so
   the fifth correct answer buys you two months and the first buys you a day.

   The number this produces - how many fall due today - is the honest reason to
   come back. It regenerates overnight and it can be driven to zero. */
const SR_DAYS=[0,1,3,9,25,60];
const SR_TOP=SR_DAYS.length-1;
function schedule(q,ok){
  if(ok){q.box=Math.min(SR_TOP,(q.box||0)+1);q.due=dshift(today(),SR_DAYS[q.box]);}
  else{q.box=0;q.due=today();}
}
const seenQ=q=>(q.seen||0)>0;
const isNewQ=q=>!seenQ(q);
const isLearning=q=>(q.wrong||0)>0;                 // got it wrong, not yet put right
const isResting=q=>seenQ(q)&&!isLearning(q)&&!!q.due&&q.due>today();
const isDueQ=q=>seenQ(q)&&!isLearning(q)&&(!q.due||q.due<=today());
/* What there is to do right now: never seen, missed, or fallen due. */
const stillOpen=qs=>qs.filter(q=>!isResting(q));
const dueQs=qs=>qs.filter(isDueQ);
const newQs=qs=>qs.filter(isNewQ);
const learningQs=qs=>qs.filter(isLearning);
/* When the next resting question comes back, so an empty queue can say so. */
function nextDueDate(qs){
  const d=qs.filter(isResting).map(q=>q.due).sort();
  return d.length?d[0]:null;
}
const isDone=q=>seenQ(q)&&!isLearning(q);
const cleanOf=qs=>qs.filter(isDone).length;

        (function(){const left=stillOpen(all).length;

            (left?'Study all '+left:'Review all '+all.length)+'</button>';})()+
      '</div>'+

        return '<button type="button" class="brow'+(left?'':' bdone')+'" data-bunit="'+esc(k+"||"+u)+'">'+

/* Day 8. Shown exactly once, with the week they actually had beside each tier -
   how many of the seven days would have counted at that target. */
function week1Clears(g){
  const s=S.profile.startDay||today();let c=0;
  for(let i=0;i<PROBATION;i++)if(dayN(dshift(s,i))>=g)c++;
  return c;

/* Someone who was already here when the tiers landed has no week-one record to
   show them. Inventing an average of zero would be worse than saying so. */
function week1Have(){
  const s=S.profile.startDay||today();let c=0;
  for(let i=0;i<PROBATION;i++)if(dayRec(dshift(s,i)))c++;
  return c;

/* ---------------------------------------------------------------------------

   destination and lights up the tab it is talking about, because "Study" means
   nothing until you can see which button it is.

const TOUR=[

 {nav:"study",t:"Study",d:"Practice questions written from your own slides and lectures \u2014 nothing from outside your material. Four ways to run them."},
 {nav:"trophies",t:"Progress",d:"Your rank, your accuracy, and the trophies. Thirteen ranks, and the higher ones stay hidden until you reach them."},

/* The walkthrough used to record itself only when you reached the last card.
   Close the app on card two - or tap away, or put the phone down - and nothing
   was written, so it opened again on the next launch, and the next. Showing
   someone the same four cards forever is worse than their missing card three,

   Nurse -> Settings -> Show the walkthrough again. */

/* The editor. Scores in, one sentence out - and the sentence names the
   constraint that binds, so it is never quietly the friendlier of the two. */
let gradeCid=null, gradeOpen={}, gradeFocus=null, gradeBusy=false, gradeCustom=false;
function gradeBody(cid){
  const gb=gbOf(cid),n=gradeNeed(cid),c=n.calc,co=courseById(cid);
  const tgt=n.target;      // needed by the row badges below, so bind it first
  /* Two badges per row, and they are the whole answer to "why is my course
     grade so far below my exams": what this row actually banked, and what it
     would have to be for the target. One cell entered wrong shows up instantly
     as 1.0 of 10 pts in red instead of hiding inside an average. */
  const has=hasScore;
  const totalPts=gb.items.reduce((a,i)=>a+(has(i)?i.w*scoreOf(i)/100:0),0);
  const allIn=gb.items.every(has);
  const anyLever=allIn&&gb.items.some(i=>{
    const w=(tgt*c.W/100-(totalPts-i.w*scoreOf(i)/100))*100/i.w;
    return w<=100&&w>scoreOf(i)+0.05;});
  const items=gb.items.map(i=>{
    const mine=has(i)?i.w*scoreOf(i)/100:0;
    const othersAllIn=gb.items.every(x=>x===i||has(x));
    let badge="";
    if(has(i))badge='<span class="gpts'+(mine<i.w*0.6?" low":"")+'">'+
      mine.toFixed(1)+' of '+i.w+' pts</span>';
    if(othersAllIn){
      const want=(tgt*c.W/100-(totalPts-mine))*100/i.w;
      // a red badge on every row is noise; only flag "impossible here" when no
      // row can reach the target on its own
      if(want<=100&&want>(has(i)?scoreOf(i):0)+0.05)
        badge+='<span class="gneed">needs '+want.toFixed(1)+'%'+
          (maxOf(i)!==100&&!i.pn?' ('+(want*maxOf(i)/100).toFixed(1)+'/'+maxOf(i)+')':'')+
          ' for '+letterFor(tgt)+'</span>';
      else if(want>100&&!anyLever)
        badge+='<span class="gneed no">even 100 here misses '+tgt+'</span>';
    }
    const pn=i.pn||0, taken=pn?partsIn(i).length:0, derived=pn&&partAvg(i)!==null;
    const splittable=pn||i.multi;
    if(splittable)badge+='<button type="button" class="gexp'+(gradeOpen[i.id]?" on":"")+'" data-gx="'+i.id+'">'+
      '<i>\u203a</i>'+(pn?(taken?taken+" of "+pn+" entered":"enter each one"):"split into entries")+'</button>';
    const val=derived?partAvg(i).toFixed(1):(i.s===null||i.s===undefined?"":i.s);
    let panel="";
    if(splittable&&gradeOpen[i.id]){
      if(!pn){
        /* the syllabus does not always say how many there are, so it is the
           student who sets the count - guessing it would be worse than asking */
        panel='<div class="gpanel"><span class="eyebrow">One box per graded item</span>'+
          '<div class="gcount"><span class="note">How many '+esc(i.n)+
            ' are graded this semester?</span>'+
            '<input type="number" min="1" max="40" step="1" inputmode="numeric" data-gn="'+i.id+'" '+
              'value="" placeholder="e.g. 14">'+
            '<button type="button" class="btn sm primary" data-gnset="'+i.id+'">Split</button></div>'+
          '<div class="note" style="margin-top:8px">If you are not sure, the count is in the gradebook. '+
            'You can skip this and type one average into the box on the right instead.</div></div>';
      }else{
        let cells="";
        for(let k=0;k<pn;k++){
          const pv=(i.pv&&i.pv[k]);
          cells+='<label class="gpart"><span>'+(k+1)+'</span>'+
            '<input type="number" min="0" max="'+pmaxOf(i)+'" step="0.1" inputmode="decimal" '+
            'data-gp="'+i.id+':'+k+'" value="'+(pv===null||pv===undefined?"":pv)+'" placeholder="\u2014"></label>';
        }
        panel='<div class="gpanel">'+
          (pmaxOf(i)!==100?'<span class="eyebrow">Each one is marked out of '+pmaxOf(i)+'</span>':'')+
          '<div class="gparts">'+cells+'</div>'+
          '<div class="gptools"><span class="note">Leave the ones you have not taken blank \u2014 '+
            'the average is over what you have done so far.</span>'+
            '<button type="button" class="btn sm" data-gall="'+i.id+'">Fill with '+pmaxOf(i)+'</button>'+
            '<button type="button" class="btn sm" data-gclr="'+i.id+'">Clear</button>'+
            (i.multi?'<button type="button" class="btn sm" data-gnre="'+i.id+'">Change count</button>':'')+
          '</div></div>';
      }
    }
    const mx=maxOf(i), raw=mx!==100&&!derived;
    return '<div class="gitem"><span class="gn">'+esc(i.n)+
      '<span class="gcat'+(i.cat==="exam"?" exam":"")+'">'+i.w+'%</span>'+
      '<small>'+esc(i.h||(i.cat==="exam"?"counts toward the exam average AND the course grade"
                            :"counts toward the course grade only"))+'</small>'+badge+'</span>'+
    '<input type="number" min="0" max="'+(raw?mx:100)+'" step="0.1" inputmode="decimal" data-gs="'+i.id+'" '+
      'value="'+val+'" placeholder="\u2014"'+(derived?' readonly title="averaged from the entries below"':'')+'>'+
    '<span class="pctsign">'+(raw?'/'+mx:'%')+'</span>'+panel+'</div>';}).join("");
  const chips=GRADE_SCALE.filter(g=>g.m>=77).map(g=>
    '<button type="button" class="chip" data-gt="'+g.m+'" aria-pressed="'+(tgt===g.m)+'">'+g.g+' ('+g.m+')</button>').join("")+
    (gradeCustom
      ? '<span class="gcustom"><input type="number" min="0" max="100" step="0.1" inputmode="decimal" '+
          'id="gtIn" value="'+tgt+'" aria-label="Target percentage"><button type="button" class="btn sm primary" id="gtSet">Set</button></span>'
      : '<button type="button" class="chip" data-gt="custom" aria-pressed="'+(GRADE_SCALE.every(g=>g.m!==tgt))+'">Other</button>');
  // Two requirements, shown apart, each saying what it averages over.
  const g=n.gate,cg=n.course;
  /* Three roundings, because these are three different promises and rounding
     them all to nearest quietly lies twice. A score you HAVE rounds to nearest.
     A score you MUST REACH rounds UP - printing "85.3%" when the true figure is
     85.3333 tells a student that 85.3 is enough, and it is not. A ceiling or a
     floor rounds DOWN, so the app never claims more headroom than exists. */
  const pct=x=>x.toFixed(1)+"%";
  const req=x=>(Math.ceil(x*10)/10).toFixed(1)+"%";
  const cap=x=>(Math.floor(x*10)/10).toFixed(1)+"%";
  const box=(cls,head,big,body,foot)=>'<div class="gverdict'+(cls?" "+cls:"")+'">'+
    '<span class="eyebrow">'+head+'</span>'+
    (big?'<div class="gbig">'+big+'</div>':'')+
    '<div class="gsay">'+body+'</div>'+(foot?'<div class="gfoot">'+foot+'</div>':'')+'</div>';
  let blocks='';
  if(g){
    if(g.settled){
      blocks+=box(g.met?"":"bad","1 \u00b7 Exam average \u2014 the gate",pct(g.current),
        g.met?"All exams are in and the average clears "+g.min+". The gate is met."
             :"All exams are in and the average is below "+g.min+". This alone fails the course.");
    }else if(g.lost){
      blocks+=box("bad","1 \u00b7 Exam average \u2014 the gate",cap(g.final)+" max",
        "Even a 100 on every remaining exam only reaches "+cap(g.final)+", short of "+g.min+
        ". Worth taking to your advisor rather than to a calculator.");
    }else{
      blocks+=box(g.need>0?"warn":"","1 \u00b7 Exam average \u2014 the gate",
        g.need>0?req(g.need):"clear",
        g.need>0
          ?"average <b>on your remaining exams only</b> \u2014 nothing else counts toward this. "+
           (g.current!=null?"You are at "+pct(g.current)+" across "+g.scored+" of "+g.count+" exams.":"No exams graded yet.")
          :"Your exams already clear "+g.min+" no matter what happens on the rest.",
        "Quizzes, posts and papers cannot move this number.");
    }
  }
  const two=g?"2 \u00b7 Course grade":"Course grade";
  if(!c.scored){
    blocks+=box("",two,"","<b>Nothing graded yet.</b> Enter a score above and this fills in.");
  }else if(cg.settled){
    /* everything has a score, so "what do I need" only makes sense per row */
    const gap=tgt-cg.current;
    const levers=gb.items.map(it=>({it:it,cur:scoreOf(it),
        want:(tgt*c.W/100-(c.pts-it.w*scoreOf(it)/100))*100/it.w}))
      .filter(x=>x.want<=100&&x.want>x.cur+0.05)
      .sort((a,b)=>(a.want-a.cur)-(b.want-b.cur));
    blocks+=box(cg.current>=tgt?"":"warn",two,pct(cg.current),
      "Every row has a score, so this is the grade those scores produce. That is <b>"+letterFor(cg.current)+"</b>"+
      (cg.current>=cg.pass?", a pass.":", below the "+cg.pass+" needed to pass.")+
      (gap>0?" You are "+gap.toFixed(1)+" points short of "+tgt+"%.":""),
      gap>0&&levers.length
        ? "Cheapest way there: <b>"+esc(levers[0].it.n)+"</b> would have to be <b>"+req(levers[0].want)+
          "</b> instead of "+levers[0].cur.toFixed(1)+"%. Clear a row to treat it as not yet graded."
        : (gap>0?"No single row can close that on its own.":""));
  }else if(cg.lost){
    blocks+=box("bad",two,cap(cg.ceiling)+" max",
      "<b>"+tgt+"% is out of reach.</b> You would need "+req(cg.need)+
      " on everything still outstanding, and only 100 is available. The best still possible is "+
      cap(cg.ceiling)+" ("+letterFor(cg.ceiling)+")."+
      (cg.passLost?"":" You can still pass: that needs "+req(cg.passNeed)+"."));
  }else if(cg.secured){
    /* "Secured" against a target the student typed in is not the same as safe.
       Set the target to 60 and a 67.5% finish is "secured" - and still a fail. */
    const safe=cg.floor>=cg.pass-1e-9;
    blocks+=box(safe?"":"warn",two,safe?"secured":cap(cg.floor)+" floor",
      "Even a zero on everything left finishes at "+cap(cg.floor)+" ("+letterFor(cg.floor)+
      "), which already clears your "+tgt+"% target."+
      (safe?"":" That is still below the "+cg.pass+"% needed to pass — to pass you need "+
             req(cg.passNeed)+" on what is left."));
  }else{
    blocks+=box("",two,req(cg.need),
      "average <b>on everything still outstanding</b> \u2014 every row above that has no score yet \u2014 to finish at "+
      tgt+"% ("+letterFor(tgt)+")."+
      (tgt>cg.pass&&cg.passNeed>0?" Just to pass, "+req(cg.passNeed)+".":
       tgt>cg.pass?" A pass is already secured whatever happens.":""),
      n.after&&n.after.need!=null
        ? "Or: land the remaining exams on "+req(n.after.examAt)+" (the gate) and the rest then has to average <b>"+
          req(n.after.need)+"</b>."
        : "");
  }
  const v=blocks;
  return '<div class="gwrap">'+
    '<div>'+items+'</div>'+
    '<div><span class="eyebrow">Aiming for</span><div class="gtargets" style="margin-top:7px">'+chips+'</div></div>'+
    v+
    '<div class="note">'+(c.leftW>0?"Assumes you score the same on everything outstanding. ":"")+
      (gb.src?'Weights from your '+esc(gb.src)+'. ':'')+
      (c.gate?'Exam grades are not rounded.':'')+'</div>'+
  '</div>';

function gradesModal(cid){
  gradeCid=cid;gradeOpen={};gradeCustom=false;
  const co=courseById(cid);
  /* Redrawing from inside a key handler tears out the node whose blur is still
     being dispatched, so the rebuild always waits for the current event to
     finish, and never runs twice for one edit. */
  const again=()=>{
    if(gradeBusy)return;
    gradeBusy=true;
    setTimeout(()=>{
      gradeBusy=false;
      const act=document.activeElement;
      const key=gradeFocus||(act&&(act.dataset||{}).gp)||null;
      gradeFocus=null;
      const h=$("#gBody");if(!h)return;
      h.innerHTML=gradeBody(gradeCid);
      wireGrades(again);
      if(key){const back=$$("[data-gp]").find(x=>x.dataset.gp===key);if(back)back.focus();}
    },0);
  };
  modal(esc(co?(co.code||co.name):"Grades"),'<div id="gBody">'+gradeBody(cid)+'</div>',
    '<button class="btn primary" id="gDone">Done</button>');
  const close=()=>{closeModal();render();};
  $("#gDone").onclick=close;$("#mClose").onclick=close;
  wireGrades(again);
}
function wireGrades(again){
  const gb=gbOf(gradeCid);if(!gb)return;
  const clamp=v=>Math.max(0,Math.min(100,v));
  $$("[data-gs]").forEach(inp=>{
    if(inp.readOnly)return;                       // averaged from its parts
    const commit=()=>{
      const it=gb.items.find(x=>x.id===inp.dataset.gs);if(!it)return;
      const raw=inp.value.trim();
      const v=parseFloat(raw);
      it.s=(raw===""||isNaN(v))?null:Math.max(0,Math.min(maxOf(it),v));
      saveCore();again();
    };
    inp.onchange=commit;
    inp.onkeydown=e=>{if(e.key==="Enter")inp.blur();};
  });
  // one row, many small boxes
  $$("[data-gx]").forEach(b=>b.onclick=()=>{
    gradeOpen[b.dataset.gx]=!gradeOpen[b.dataset.gx];again();});
  $$("[data-gp]").forEach(inp=>{
    const [id,k]=inp.dataset.gp.split(":");
    const it=gb.items.find(x=>x.id===id);if(!it)return;
    const commit=()=>{
      if(!Array.isArray(it.pv))it.pv=new Array(it.pn||0).fill(null);
      const raw=inp.value.trim(),v=parseFloat(raw);
      it.pv[+k]=(raw===""||isNaN(v))?null:Math.max(0,Math.min(pmaxOf(it),v));
      saveCore();again();
    };
    inp.onchange=commit;
    inp.onkeydown=e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        gradeFocus=id+":"+(+k+1);                 // straight down the list
        commit();
      }};
  });
  // set / change how many boxes a recurring row has, keeping what is entered
  const setCount=(id,n)=>{
    const it=gb.items.find(x=>x.id===id);if(!it)return;
    n=Math.max(1,Math.min(40,Math.round(n)));
    const old=Array.isArray(it.pv)?it.pv:(Array.isArray(it.pvHold)?it.pvHold:[]);
    delete it.pvHold;
    const next=new Array(n).fill(null);
    for(let k=0;k<Math.min(n,old.length);k++)next[k]=old[k];
    it.pn=n;it.pv=next;it.s=null;                 // the parts are the score now
    saveCore();again();
  };
  $$("[data-gnset]").forEach(b=>b.onclick=()=>{
    const f=$('[data-gn="'+b.dataset.gnset+'"]');
    const v=f?parseInt(f.value,10):NaN;
    if(!isNaN(v)&&v>0)setCount(b.dataset.gnset,v);
  });
  $$("[data-gn]").forEach(inp=>{inp.onkeydown=e=>{
    if(e.key==="Enter"){e.preventDefault();
      const v=parseInt(inp.value,10);if(!isNaN(v)&&v>0)setCount(inp.dataset.gn,v);}};});
  /* "Change count" re-asks how many entries the row has. It used to drop `pn`
     but leave `pv` live, which left the row scoring off entries the student
     could no longer see: the box rendered empty and editable, anything typed
     into it was overruled by the hidden parts, and the row kept contributing
     its old average with no way to correct it. Park the values instead, and
     hand them back when the new count is set. */
  $$("[data-gnre]").forEach(b=>b.onclick=()=>{
    const it=gb.items.find(x=>x.id===b.dataset.gnre);if(!it)return;
    if(Array.isArray(it.pv))it.pvHold=it.pv;
    delete it.pn;it.pv=null;
    saveCore();again();});
  $$("[data-gall]").forEach(b=>b.onclick=()=>{
    const it=gb.items.find(x=>x.id===b.dataset.gall);if(!it)return;
    it.pv=new Array(it.pn).fill(pmaxOf(it));saveCore();again();});
  $$("[data-gclr]").forEach(b=>b.onclick=()=>{
    const it=gb.items.find(x=>x.id===b.dataset.gclr);if(!it)return;
    it.pv=new Array(it.pn).fill(null);saveCore();again();});
  $$("[data-gt]").forEach(b=>b.onclick=()=>{
    if(b.dataset.gt==="custom"){gradeCustom=true;again();return;}
    gradeCustom=false;gb.target=+b.dataset.gt;

/* ---------- the nurse, drawn anime-style ----------

   from pointed strands with a highlight band. Head sits around y 24-74. */
function lum(hex){if(!hex||String(hex)[0]!=="#")return .45;
  const n=parseInt(String(hex).slice(1),16);
  return (0.2126*((n>>16)&255)+0.7152*((n>>8)&255)+0.0722*(n&255))/255;}
function shade(hex,amt){
  if(!hex||String(hex)[0]!=="#")return hex;
  const n=parseInt(String(hex).slice(1),16);
  const c=[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,v+amt)));
  return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
}

      '<g clip-path="url(#'+id+'f)" fill="none" stroke-linecap="round">'+

        '<g stroke="#fff" stroke-width="'+(1.1+0.7*D).toFixed(2)+'" opacity="'+(0.22*D).toFixed(3)+'">'+out+'</g>'+

  };

      '<path d="M'+N(cx-hw*0.98)+' '+N(hd[1]+0.4)+'q'+N(hw*0.98)+' 1.4 '+N(hw*1.96)+' 0" fill="none" stroke="'+SKIN_D+'" stroke-width=".9" opacity=".45"/>';
  };

    '<clipPath id="'+id+'"><rect x="0" y="0" width="130" height="'+G.cuff+'"/></clipPath>'+
    '<clipPath id="'+id+'f"><rect x="0" y="'+G.cuff+'" width="130" height="'+(150-G.cuff)+'"/></clipPath>'+
    '<path d="'+L+'" fill="'+SKIN+'"/><path d="'+R+'" fill="'+SKIN+'"/>'+

      '<g clip-path="url(#'+id+'u)"><path d="'+L+'" fill="'+under+'"/><path d="'+R+'" fill="'+under+'"/>'+
      '<path d="'+L+'" fill="#000" opacity=".05"/><path d="'+R+'" fill="#000" opacity=".05"/>'+
      '<path d="'+L+'" fill="none" stroke="#000" stroke-width=".9" opacity=".14"/>'+
      '<path d="'+R+'" fill="none" stroke="#000" stroke-width=".9" opacity=".14"/></g>':'')+

}
function bodyFor(pres,build){
  const A='var(--accent)';
  const DK=(d,w,o)=>'<path d="'+d+'" fill="none" stroke="#000" stroke-width="'+w+'" opacity="'+o+'" stroke-linecap="round"/>';
  const LT=(d,w,o)=>'<path d="'+d+'" fill="none" stroke="#fff" stroke-width="'+w+'" opacity="'+o+'" stroke-linecap="round"/>';
  const P=trunkPts(pres,build);
  const K=P[1][1]/20.8;
  const X=v=>+(65-v*K).toFixed(2), Y=v=>+(65+v*K).toFixed(2);
  const chest=pres==="f"
    ? (function(){
        /* Just the soft shadow the bust casts under the fabric - a shallow
           crescent that pinches to nothing at both ends. No closed shape, no
           gradient, no outer edge, so the breast itself is never drawn: what
           reads is a drape, not a form under the shirt. */
        const BU=((BUILDS[build]||BUILDS.average).bust)||1;
        const r=+(7.7*K*BU).toFixed(2), dx=+(8.4*K).toFixed(2), cy=+(100.2+r*0.15).toFixed(2);
        const bust=(sx)=>{
          const c=+(65+sx*dx).toFixed(2);
          const PX=x=>+(c+sx*x*r).toFixed(2), PY=y=>+(cy+y*r).toFixed(2);
          // several thin bands at different depths rather than three sharing one
          // outer edge: the darkest part sits at the crease and falls away in
          // both directions, so the underline is felt more than seen
          const band=(e,t,op)=>'<path d="M'+PX(-0.60)+' '+PY(0.52*e)+
            'C'+PX(-0.34)+' '+PY(0.92*e)+' '+PX(0.42)+' '+PY(0.96*e)+' '+PX(0.86)+' '+PY(0.60*e)+
            'C'+PX(0.52)+' '+PY(t)+' '+PX(-0.30)+' '+PY(t)+' '+PX(-0.60)+' '+PY(0.52*e)+
            'Z" fill="#000" opacity="'+op+'"/>';
          return band(1.14,0.86,'.015')+band(1.08,0.78,'.017')+band(1.02,0.70,'.019')+
            band(0.96,0.60,'.020')+band(0.90,0.50,'.022');
        };
        return bust(-1)+bust(1);
      })()
    : (function(){
        /* One arc running right across the chest read as a U printed on the
           shirt. Two tapered bands instead, one under each pec, each pinching
           to nothing at both ends. */
        const BU=((BUILDS[build]||BUILDS.average).bust)||1;
        const r=+(5.4*K*(0.86+BU*0.16)).toFixed(2), dx=+(7.4*K).toFixed(2), cy=+(96.6+r*0.12).toFixed(2);
        const pec=(sx)=>{
          const c=+(65+sx*dx).toFixed(2);
          const PX=x=>+(c+sx*x*r).toFixed(2), PY=y=>+(cy+y*r).toFixed(2);
          const band=(e,t,op)=>'<path d="M'+PX(-0.62)+' '+PY(0.34*e)+
            'C'+PX(-0.38)+' '+PY(0.76*e)+' '+PX(0.44)+' '+PY(0.82*e)+' '+PX(0.92)+' '+PY(0.42*e)+
            'C'+PX(0.56)+' '+PY(t)+' '+PX(-0.32)+' '+PY(t)+' '+PX(-0.62)+' '+PY(0.34*e)+
            'Z" fill="#000" opacity="'+op+'"/>';
          return band(1.16,0.70,'.015')+band(1.09,0.62,'.018')+band(1.02,0.54,'.021')+
            band(0.95,0.44,'.023')+band(0.88,0.32,'.024');
        };
        return pec(-1)+pec(1);
      })();
  const collar=pres==="m"
    ? '<path d="M55 82.6q10 9 20 0l3.5 2q-12.5 12-27 0z" fill="#000" opacity=".13"/>'+
      '<path d="M57.6 84.6l7.4 13 7.4-13-7.4-3z" fill="#000" opacity=".12"/>'
    : '<path d="M56.5 '+(pres==="f"?85.4:84.6)+'q8.5 8 17 0l3 2q-11 11-23 0z" fill="#000" opacity=".13"/>'+
      '<path d="M58.6 '+(pres==="f"?87.4:86.6)+'l6.4 12 6.4-12-6.4-3z" fill="#000" opacity=".12"/>';
  const wy=P[2][0], ww=+P[2][1].toFixed(2);
  return '<path d="'+trunkPath(P)+'" fill="'+A+'"/>'+chest+
    DK('M65 '+(pres==="f"?106:96.5)+'v'+(pres==="f"?20:15),pres==="f"?1.7:2,pres==="f"?'.06':'.08')+
    DK('M'+(65-ww+3.6)+' '+(wy-10)+'Q'+(65-ww+5.1)+' '+wy+' '+(65-ww+4.3)+' '+(wy+9)+'M'+(65+ww-3.6)+' '+(wy-10)+'Q'+(65+ww-5.1)+' '+wy+' '+(65+ww-4.3)+' '+(wy+9),2.5,'.1')+
    collar;
}
/* ---------------------------------------------------------------------------

/* The figure faces you, so the shoes have to as well: you look down at the top

function legsFor(pres,build,fitKind,pantCol,shoeKind,shoeCol,SKIN,SKIN_D,sockPat,sockCol){
  const P=trunkPts(pres,build);
  const H=P[3][1];
  const Hi=12+(H-12)*0.5;                    // the gap between the legs
  const Hf=13+(H-13)*0.34;                   // the feet
  const F=PANT_FITS[fitKind]||PANT_FITS.straight;
  const C=PANTS[pantCol]||PANTS.white;
  const BASE=C[0], DEEP=C[1];
  const light=lum(BASE)>0.55;                // white scrubs need a drawn edge, dark ones do not
  const EDGE=light?'rgba(18,34,32,.16)':'rgba(0,0,0,.28)';
  const X=v=>+(65+v).toFixed(2);
  const YS=[150,182,200,214,F.h||232];
  const HEM=YS[4], crotch=175;
  const o=k=>H*F.o[k], iw=k=>Hi*F.i[k];

  const legOut=s=>{
    const S=v=>+(65+s*v).toFixed(2);
    return 'C'+S(o(0))+' 164 '+S(o(1))+' 172 '+S(o(1))+' 182'+
      'C'+S(o(1))+' 190 '+S(o(2))+' 194 '+S(o(2))+' 200'+
      'C'+S(o(2))+' 206 '+S(o(3))+' 209 '+S(o(3))+' 214'+
      'C'+S(o(3))+' 221 '+S(o(4))+' 226 '+S(o(4))+' '+HEM;
  };
  const legIn=s=>{
    const S=v=>+(65+s*v).toFixed(2);
    return 'C'+S(iw(4))+' 226 '+S(iw(3))+' 221 '+S(iw(3))+' 214'+
      'C'+S(iw(3))+' 209 '+S(iw(2))+' 206 '+S(iw(2))+' 200'+
      'C'+S(iw(2))+' 194 '+S(iw(1))+' 190 '+S(iw(1))+' 182'+
      'C'+S(iw(1))+' 179 '+S(iw(0))+' 178 '+S(iw(0))+' 177';
  };
  const pants='M'+X(-o(0))+' 150'+legOut(-1)+'L'+X(-iw(4))+' '+HEM+legIn(-1)+
    'Q65 '+crotch+' '+X(iw(0))+' 177'+
    'C'+X(iw(1))+' 179 '+X(iw(1))+' 182 '+X(iw(1))+' 182'+
    'C'+X(iw(2))+' 190 '+X(iw(2))+' 200 '+X(iw(2))+' 200'+
    'C'+X(iw(3))+' 209 '+X(iw(3))+' 214 '+X(iw(3))+' 214'+
    'C'+X(iw(4))+' 221 '+X(iw(4))+' '+HEM+' '+X(iw(4))+' '+HEM+
    'L'+X(o(4))+' '+HEM+
    'C'+X(o(4))+' 226 '+X(o(3))+' 221 '+X(o(3))+' 214'+
    'C'+X(o(3))+' 209 '+X(o(2))+' 206 '+X(o(2))+' 200'+
    'C'+X(o(2))+' 194 '+X(o(1))+' 190 '+X(o(1))+' 182'+
    'C'+X(o(1))+' 172 '+X(o(0))+' 164 '+X(o(0))+' 150Z';

  /* Every mark below is clipped to the trouser shape. Two mirrored inner-thigh
     shadows drawn free-hand pooled in the gap between the legs and read as a
     third leg; clipped, a shadow can only ever land on cloth. */
  /* NOT `shade` - that is the global colour helper, and naming a local
     path-builder the same thing meant every call to shade(SOCK,-10) inside this
     function built a <path> out of a colour string instead of darkening it.
     Striped and argyle socks rendered "M NaN 178 C NaN 192 ..." into a fill
     attribute and lost their pattern. */
  const legShade=s=>{
    const S=v=>+(65+s*v).toFixed(2);
    const inner=(y0,y1,f,op)=>'<path d="M'+S(iw(1))+' '+y0+'C'+S(iw(1)+f)+' '+((y0+y1)/2)+' '+
      S(iw(2)+f)+' '+(y1-8)+' '+S(iw(2)+f*0.4)+' '+y1+
      'L'+S(iw(2)-2)+' '+y1+'C'+S(iw(2)-2)+' '+(y1-10)+' '+S(iw(1)-2)+' '+((y0+y1)/2)+' '+S(iw(1)-2)+' '+y0+
      'Z" fill="#000" opacity="'+op+'"/>';
    return inner(178,206,H*0.09,'.045')+inner(178,192,H*0.05,'.035')+
      '<path d="M'+S(o(1)*0.92)+' 168C'+S(o(1)*0.86)+' 190 '+S(o(2)*0.80)+' 208 '+S(o(3)*0.74)+' '+(HEM-4)+
      'L'+S(o(3)*0.60)+' '+(HEM-5)+'C'+S(o(2)*0.68)+' 206 '+S(o(1)*0.76)+' 188 '+S(o(1)*0.82)+' 167Z" fill="#fff" opacity="'+(light?'.42':'.12')+'"/>'+
      '<path d="M'+S(o(1)*0.48)+' 162V'+(YS[2]-10)+'" stroke="#000" stroke-width="1" opacity=".05" fill="none"/>'+
      '<path d="M'+S(iw(2)+H*0.10)+' '+YS[2]+'q'+(s*H*0.18).toFixed(2)+' 3.4 '+(s*H*0.38).toFixed(2)+' -1" stroke="#000" stroke-width="1.2" opacity=".05" fill="none" stroke-linecap="round"/>';
  };

  const cuff=F.cuff?['-1','1'].map(t=>{const s=+t,S=v=>+(65+s*v).toFixed(2);
    return '<path d="M'+S(iw(4)-0.6)+' '+HEM+'C'+S(iw(4)-0.6)+' '+(HEM+7)+' '+S(o(4)+0.6)+' '+(HEM+7)+' '+S(o(4)+0.6)+' '+HEM+'Z" fill="'+DEEP+'"/>'+
      '<g stroke="#000" opacity=".14" stroke-width="0.9">'+[0.25,0.5,0.75].map(f=>
        '<path d="M'+S(iw(4)+(o(4)-iw(4))*f)+' '+(HEM+0.5)+'v6"/>').join("")+'</g>';}).join(""):
    '<path d="M'+X(-o(4))+' '+(HEM-3.5)+'H'+X(-iw(4))+'M'+X(iw(4))+' '+(HEM-3.5)+'H'+X(o(4))+
      '" stroke="#000" stroke-width="1.1" opacity=".09" fill="none"/>';

  const pockets=F.pocket?['-1','1'].map(t=>{const s=+t,S=v=>+(65+s*v).toFixed(2);
    return '<path d="M'+S(o(1)*0.94)+' 188h'+(-s*H*0.42).toFixed(2)+'v13h'+(s*H*0.42).toFixed(2)+'z" fill="'+DEEP+'" opacity=".55"/>'+
      '<path d="M'+S(o(1)*0.94)+' 188h'+(-s*H*0.42).toFixed(2)+'v13h'+(s*H*0.42).toFixed(2)+'" fill="none" stroke="#000" stroke-width="0.9" opacity=".18"/>'+
      '<path d="M'+S(o(1)*0.94)+' 191.4h'+(-s*H*0.42).toFixed(2)+'" stroke="#000" stroke-width="1.4" opacity=".16" fill="none"/>';}).join(""):'';

  const fw=+(Hf*0.40).toFixed(2);
  const fx=s=>65+s*Hf*0.46;
  const shoeForPair=()=>shoeFor(shoeKind||"runner",-1,fx(-1),fw,shoeCol)+
                        shoeFor(shoeKind||"runner", 1,fx( 1),fw,shoeCol);
  /* There was no ankle: the trouser hem stopped and a shoe sat under it with
     nothing joining them, so the shoes read as parked rather than worn. The
     leg runs from behind the hem down into the collar of the shoe. */
  const SOCK=sockPat?(SOCKS[sockCol]||SOCKS.white):"";
  const SK=SOCK||SKIN||"#E7BB8E", SKD=SOCK?shade(SOCK,-16):(SKIN_D||"#D09B68");
  const ankle=s=>{
    const lc=65+s*(o(4)+iw(4))/2, fc=fx(s);
    const a1=+(H*0.20).toFixed(2), a2=+(fw*0.58).toFixed(2);
    const top=(F.h||232)-10, bot=242, mid=(top+bot)/2;
    const L=v=>+(v).toFixed(2);
    const shp='M'+L(lc-a1)+' '+top+'C'+L(lc-a1)+' '+mid+' '+L(fc-a2)+' '+mid+' '+L(fc-a2)+' '+bot+
      'L'+L(fc+a2)+' '+bot+'C'+L(fc+a2)+' '+mid+' '+L(lc+a1)+' '+mid+' '+L(lc+a1)+' '+top+'Z';
    const s2=(s<0?'a':'b')+AV_UID;
    return (SOCK?'<clipPath id="sk'+s2+'"><path d="'+shp+'"/></clipPath>':'')+
      '<path d="'+shp+'" fill="'+SK+'"/>'+
      // the shin catches the light, the inside of the ankle falls away
      '<path d="M'+L(lc-a1)+' '+top+'C'+L(lc-a1)+' '+mid+' '+L(fc-a2)+' '+mid+' '+L(fc-a2)+' '+bot+
      'L'+L(fc-a2*0.34)+' '+bot+'C'+L(fc-a2*0.34)+' '+mid+' '+L(lc-a1*0.4)+' '+mid+' '+L(lc-a1*0.4)+' '+top+'Z" fill="#fff" opacity=".12"/>'+
      '<path d="M'+L(fc+a2*0.3)+' '+bot+'C'+L(fc+a2*0.3)+' '+mid+' '+L(lc+a1*0.5)+' '+mid+' '+L(lc+a1*0.5)+' '+top+
      'L'+L(lc+a1)+' '+top+'C'+L(lc+a1)+' '+mid+' '+L(fc+a2)+' '+mid+' '+L(fc+a2)+' '+bot+'Z" fill="'+SKD+'" opacity=".45"/>'+
      // a ribbed cuff and the pattern, then the shadow the hem drops on it
      (SOCK?'<g clip-path="url(#sk'+s2+')">'+
        (sockPat==="stripe"?[0,1,2,3,4].map(k=>'<path d="M'+L(lc-a1-2)+' '+(top+5+k*6)+'H'+L(lc+a1+2)+
          '" stroke="'+shade(SOCK,lum(SOCK)>0.5?-26:34)+'" stroke-width="2.6"/>').join(""):"")+
        (sockPat==="argyle"?[0,1,2].map(k=>'<path d="M'+L(lc)+' '+(top+3+k*11)+'l'+a1+' 5.5-'+a1+' 5.5-'+a1+' -5.5Z" fill="'+
          shade(SOCK,lum(SOCK)>0.5?-22:30)+'" opacity=".85"/>').join(""):"")+
        '</g>'+
        '<path d="M'+L(lc-a1)+' '+top+'C'+L(lc-a1)+' '+(top+5)+' '+L(lc+a1)+' '+(top+5)+' '+L(lc+a1)+' '+top+'Z" fill="'+shade(SOCK,-10)+'"/>'
        :'')+
      '<path d="M'+L(lc-a1)+' '+top+'C'+L(lc-a1)+' '+(top+4)+' '+L(lc+a1)+' '+(top+4)+' '+L(lc+a1)+' '+top+'Z" fill="#000" opacity=".16"/>';
  };

  /* Whatever the fit leaves open between the legs has to read as the shadow you
     would actually see there. Left transparent it showed the page through and
     turned into a pale wedge with a hard edge - the single most artificial
     thing about the first pass. */
  const gapPath='M'+X(-iw(0))+' 176'+
    'C'+X(-iw(1))+' 179 '+X(-iw(1))+' 182 '+X(-iw(1))+' 182'+
    'C'+X(-iw(2))+' 190 '+X(-iw(2))+' 200 '+X(-iw(2))+' 200'+
    'C'+X(-iw(3))+' 209 '+X(-iw(3))+' 214 '+X(-iw(3))+' 214'+
    'C'+X(-iw(4))+' 221 '+X(-iw(4))+' '+HEM+' '+X(-iw(4))+' '+HEM+
    'L'+X(iw(4))+' '+HEM+
    'C'+X(iw(4))+' 221 '+X(iw(3))+' 214 '+X(iw(3))+' 214'+
    'C'+X(iw(3))+' 209 '+X(iw(2))+' 200 '+X(iw(2))+' 200'+
    'C'+X(iw(2))+' 190 '+X(iw(1))+' 182 '+X(iw(1))+' 182'+
    'C'+X(iw(1))+' 179 '+X(iw(0))+' 176 '+X(iw(0))+' 176Z';
  const cid='pcl'+(++AV_UID);
  return '<g class="legs">'+
    '<defs><clipPath id="'+cid+'"><path d="'+gapPath+'"/></clipPath></defs>'+
    '<path d="'+gapPath+'" fill="'+mix(DEEP,"#2A3836",0.5)+'" opacity="'+(light?".12":".26")+'"/>'+
    '<defs><clipPath id="'+cid+'b"><path d="'+pants+'"/></clipPath></defs>'+
    ankle(-1)+ankle(1)+
    shoeForPair()+
    '<path d="'+pants+'" fill="'+BASE+'" stroke="'+EDGE+'" stroke-width="0.9"/>'+
    '<g clip-path="url(#'+cid+'b)">'+
      // the scrub top hangs over the waistband, so the darkest band is right there
      '<path d="M'+X(-o(0)-2)+' 150C'+X(-o(0))+' 159 '+X(o(0))+' 159 '+X(o(0)+2)+' 150Z" fill="#000" opacity=".10"/>'+
      '<path d="M'+X(-o(0)-2)+' 150C'+X(-o(0))+' 157 '+X(o(0))+' 157 '+X(o(0)+2)+' 150Z" fill="#000" opacity=".05"/>'+
      legShade(-1)+legShade(1)+pockets+
    '</g>'+cuff+
    '</g>';
}

function hijabFor(pres,build,hcol){
  const P=trunkPts(pres,build);
  const CH=P[1][1];                             // chest half-width, the widest of the trunk
  const X=v=>+(65+v).toFixed(2);
  const HJ=HIJABS[hcol]||HIJABS.slate;
  const deep=lum(HJ)<0.24;
  const HJ_D=mix(HJ,"#0B0E12",deep?0.30:0.22);
  const HJ_L=deep?mix(HJ,"#98A6B6",0.34):shade(HJ,20);
  const HJ_LL=deep?mix(HJ,"#BAC5D2",0.46):shade(HJ,38);
  const HJ_BAND=mix(HJ,"#0B0E12",deep?0.20:0.13);
  /* The head is only about 20 units either side of centre and the trunk barely
     wider, so the cloth has to sit close: a few units of scarf around the head,
     then a gentle flare over the shoulders. Reaching out to the full chest plus
     a margin turned it into a sleeping bag. */
  const HW=23.2;                                // widest of the head wrap
  const DW=+Math.max(CH+4.6,23).toFixed(2);     // widest of the shoulder drape
  const hem=117, HH=+(DW*0.9).toFixed(2);       // hem width

  const outer='M65 12.2'+
    'C53.6 12.2 '+X(-HW)+' 22.8 '+X(-HW)+' 45'+
    'C'+X(-HW)+' 58 '+X(-22.6)+' 69 '+X(-21.8)+' 78.4'+
    'C'+X(-21.2)+' 84.4 '+X(-(DW*0.86))+' 88.6 '+X(-DW)+' 96.4'+
    'C'+X(-DW)+' 104 '+X(-HH)+' 112 '+X(-(HH*0.62))+' '+hem+
    'L'+X(HH*0.62)+' '+hem+
    'C'+X(HH)+' 112 '+X(DW)+' 104 '+X(DW)+' 96.4'+
    'C'+X(DW*0.86)+' 88.6 '+X(21.2)+' 84.4 '+X(21.8)+' 78.4'+
    'C'+X(22.6)+' 69 '+X(HW)+' 58 '+X(HW)+' 45'+
    'C'+X(HW)+' 22.8 76.4 12.2 65 12.2Z';

  // face opening, a little narrower than the head so the cloth overlaps its edge
  const open='M65 29C55.6 29 47.8 36 47.8 47'+
    'C47.8 55.4 49 63 50.6 67.4C53 74 58.2 77.4 65 77.4'+
    'C71.8 77.4 77 74 79.4 67.4C81 63 82.2 55.4 82.2 47'+
    'C82.2 36 74.4 29 65 29Z';
  const inner='M65 31.8C57.2 31.8 50.8 38 50.8 47.2'+
    'C50.8 55 51.9 60.6 53.4 64.6C55.6 70.6 59.8 74 65 74'+
    'C70.2 74 74.4 70.6 76.6 64.6C78.1 60.6 79.2 55 79.2 47.2'+
    'C79.2 38 72.8 31.8 65 31.8Z';

  /* Everything below the jawline, inside the opening, is cloth. Without this
     the neck showed as a bare patch between the chin and the front edge. */
  const neck='M50.8 47.2C50.8 55 51.9 60.6 53.4 64.6'+
    'C55.6 70.6 59.8 74 65 74C70.2 74 74.4 70.6 76.6 64.6'+
    'C78.1 60.6 79.2 55 79.2 47.2L88 47.2 88 106 42 106 42 47.2Z';

  return '<g class="hijab">'+
    '<path d="'+outer+open+'" fill="'+HJ+'" fill-rule="evenodd"/>'+
    '<path d="'+neck+'" fill="'+HJ+'"/>'+
    // under the chin is the deepest shadow on the whole garment
    '<path d="M53.4 64.6C55.6 70.6 59.8 74 65 74C70.2 74 74.4 70.6 76.6 64.6'+
      'C78 68.8 78.8 73.6 78.8 77.6C78.8 86.4 71.4 92 65 92 58.6 92 51.2 86.4 51.2 77.6 51.2 73.6 52 68.8 53.4 64.6Z" fill="#000" opacity=".17"/>'+
    /* light off the upper-left of the crown, the right side falling away */
    '<path d="M65 12.2C53.6 12.2 '+X(-HW)+' 22.8 '+X(-HW)+' 45'+
      'C'+X(-HW)+' 58 '+X(-22.6)+' 69 '+X(-21.8)+' 78.4'+
      'L'+X(-16.4)+' 77C'+X(-17.2)+' 67 '+X(-18.4)+' 56 '+X(-18)+' 45.6'+
      'C'+X(-17.4)+' 30 '+X(-11.6)+' 20.4 '+X(-2.4)+' 19.2'+
      'C'+X(-6.4)+' 15.2 '+X(-2.8)+' 12.2 65 12.2Z" fill="'+HJ_L+'" opacity=".55"/>'+
    '<path d="M65 12.2C76.4 12.2 '+X(HW)+' 22.8 '+X(HW)+' 45'+
      'C'+X(HW)+' 58 '+X(22.6)+' 69 '+X(21.8)+' 78.4'+
      'L'+X(17.6)+' 77.6C'+X(18.4)+' 67 '+X(19.4)+' 56 '+X(19)+' 45.6'+
      'C'+X(18.4)+' 29.4 '+X(11.8)+' 19.8 '+X(2.4)+' 18.6'+
      'C'+X(6.6)+' 14.8 '+X(3)+' 12.2 65 12.2Z" fill="#000" opacity=".11"/>'+
    /* the drape: lit on the left, in shadow on the right */
    '<path d="M'+X(-21.2)+' 84.4C'+X(-(DW*0.86))+' 88.6 '+X(-DW)+' 96.4 '+X(-DW)+' 96.4'+
      'C'+X(-DW)+' 104 '+X(-HH)+' 112 '+X(-(HH*0.62))+' '+hem+
      'L'+X(-(HH*0.5))+' '+(hem-1)+'C'+X(-(HH*0.86))+' 111 '+X(-(DW*0.9))+' 103 '+X(-(DW*0.88))+' 97'+
      'C'+X(-(DW*0.78))+' 91 '+X(-19.4)+' 87.4 '+X(-19.8)+' 84.8Z" fill="#fff" opacity=".17"/>'+
    '<path d="M'+X(19.8)+' 84.8C'+X(19.4)+' 87.4 '+X(DW*0.78)+' 91 '+X(DW*0.88)+' 97'+
      'C'+X(DW*0.9)+' 103 '+X(HH*0.86)+' 111 '+X(HH*0.5)+' '+(hem-1)+
      'L'+X(HH*0.62)+' '+hem+'C'+X(HH)+' 112 '+X(DW)+' 104 '+X(DW)+' 96.4'+
      'C'+X(DW*0.86)+' 88.6 '+X(21.2)+' 84.4 '+X(21.2)+' 84.4Z" fill="#000" opacity=".14"/>'+
    /* the front edge crossing the chest, the way it is pinned */
    '<path d="M'+X(-19.6)+' 76C'+X(-14)+' 87 '+X(-2.4)+' 93.6 '+X(HH*0.30)+' 97'+
      'C'+X(HH*0.46)+' 106 '+X(HH*0.42)+' 113 '+X(HH*0.36)+' '+hem+
      'L'+X(-(HH*0.62))+' '+hem+'C'+X(-(HH*0.66))+' 104 '+X(-(HH*0.5))+' 88 '+X(-19.6)+' 76Z" fill="'+HJ+'"/>'+
    '<path d="M'+X(-19.6)+' 76C'+X(-14)+' 87 '+X(-2.4)+' 93.6 '+X(HH*0.30)+' 97" fill="none" stroke="#000" stroke-width="1.4" opacity=".17"/>'+
    '<path d="M'+X(-18.8)+' 78C'+X(-13.4)+' 88.4 '+X(-2.4)+' 95 '+X(HH*0.28)+' 98.4" fill="none" stroke="'+HJ_LL+'" stroke-width="1" opacity=".5"/>'+
    /* folds down the drape */
    '<g fill="none" stroke="#000" stroke-width="1.2" opacity=".12" stroke-linecap="round">'+
      '<path d="M'+X(-(HH*0.34))+' 98C'+X(-(HH*0.42))+' 106 '+X(-(HH*0.46))+' 112 '+X(-(HH*0.46))+' '+hem+'"/>'+
      '<path d="M'+X(-(HH*0.06))+' 100C'+X(-(HH*0.12))+' 108 '+X(-(HH*0.16))+' 113 '+X(-(HH*0.16))+' '+hem+'"/>'+
      '<path d="M'+X(HH*0.62)+' 96C'+X(HH*0.72)+' 104 '+X(HH*0.74)+' 112 '+X(HH*0.72)+' '+hem+'"/></g>'+
    '<g fill="none" stroke="#fff" stroke-width="1" opacity=".14" stroke-linecap="round">'+
      '<path d="M'+X(-(HH*0.68))+' 94C'+X(-(HH*0.78))+' 103 '+X(-(HH*0.8))+' 111 '+X(-(HH*0.78))+' '+hem+'"/></g>'+
    /* the underscarf, showing as a band inside the opening */
    '<path d="'+inner+open+'" fill="'+HJ_BAND+'" fill-rule="evenodd"/>'+
    '<path d="'+open+'" fill="none" stroke="#000" stroke-width="1.5" opacity=".24"/>'+
    '<path d="'+inner+'" fill="none" stroke="'+HJ_LL+'" stroke-width="0.9" opacity=".42"/>'+
    /* the shadow the front edge casts across the forehead */
    '<path d="M51.4 34C53.6 29.8 58.8 27.2 65 27.2 71.2 27.2 76.4 29.8 78.6 34" fill="none" stroke="#000" stroke-width="2.4" opacity=".10"/>'+
    '</g>';
}
/* ---------------------------------------------------------------------------
   Sterile surgical gown. Goes on over everything: the trunk, both arms and the
   top of the legs, wrap front with the tie crossing the waist, elasticated
   knit cuffs at the wrist. It stops just below the knee so the shoes and the
   hem of the trousers still read - a gown drawn to the floor would hide two
   things you had already chosen.
--------------------------------------------------------------------------- */
const GOWN={base:"#5B87A8",dark:"#3F6684",light:"#7BA3C0",cuff:"#E8EEF2",tie:"#365B78"};
/* ---------------------------------------------------------------------------
   THE KIT
   Everything here is worn over or under the scrub top rather than instead of
   it, so each piece has to know what it sits between. Order, outermost last:
   undershirt sleeves, scrub top, print, neckline, jacket, then the things
   pinned to the chest.
--------------------------------------------------------------------------- */
const UNDER={white:"#F4F6F6",black:"#26292B",navy:"#2F4460",grey:"#B9C2C3",teal:"#2F8C82"};
const SOCKS={white:"#F4F6F6",black:"#2E3234",navy:"#31465F",teal:"#2F8C82",pink:"#D98BA2",
  grey:"#B9C2C3",wine:"#7A3A45",mint:"#9AD0C2"};
const SOCKPAT={solid:"Solid",stripe:"Striped",argyle:"Argyle"};
const SCOPES={ink:"#20242A",burgundy:"#7A2E3C",teal:"#1F7A72",navy:"#2B4468",plum:"#5B3A6E",
  rose:"#C08A7A",forest:"#2C5240",royal:"#2F52A8"};
const HAIRACC={band:"Headband",scrunchie:"Scrunchie",bandana:"Bandana"};
const ACCCOL={teal:"#2F8C82",navy:"#31465F",wine:"#7A3A45",rose:"#C77E96",mustard:"#B58A2E",
  black:"#2A2D30",white:"#F0F3F3",plum:"#6A4780"};

/* the neckline of the scrub top: shape only, over the trunk color */
function necklineFor(pres,build,kind,SKIN,SKIN_D){
  if(!kind)return "";
  const P=trunkPts(pres,build), SH=P[0][1];
  const X=v=>+(65+v).toFixed(2);
  const top=pres==="m"?83.6:84.4;
  const rim=(d,w)=>'<path d="'+d+'" fill="none" stroke="#000" stroke-width="'+w+'" opacity=".2"/>';
  if(kind==="v"){
    const d='M'+X(-SH*0.42)+' '+top+'L65 '+(top+16)+'L'+X(SH*0.42)+' '+top+
      'C'+X(SH*0.2)+' '+(top-2.4)+' '+X(-SH*0.2)+' '+(top-2.4)+' '+X(-SH*0.42)+' '+top+'Z';
    return '<path d="'+d+'" fill="'+SKIN+'"/>'+

function specsFor(kind,part){

        'C72.6 85.6 57.4 85.6 53.4 83.4 48.6 80.6 44.6 74.6 42.6 67.4'+
        'C40.6 60 40.4 52.4 41.6 45.6Z" fill="#CFE4EC" opacity=".22"/>'+
      '<path d="M41.6 45.6C46 39.6 56 36.4 65 36.4 74 36.4 84 39.6 88.4 45.6'+
        'C89.6 52.4 89.4 60 87.4 67.4 85.4 74.6 81.4 80.6 76.6 83.4'+
        'C72.6 85.6 57.4 85.6 53.4 83.4 48.6 80.6 44.6 74.6 42.6 67.4'+

      '<path d="M41.6 43.2C46.6 37.4 55.6 34.6 65 34.6 74.4 34.6 83.4 37.4 88.4 43.2" fill="none" stroke="#fff" stroke-width="1" opacity=".22"/>'+

function headFor(pres,SKIN,SKIN_D,face,nose,cheeks){
  const F=faceFor(face,pres);
  const chin=chinPathFor(pres,face);
  const blush=cheeksFor(cheeks,pres,SKIN);
  const id="cnj"+(++AV_UID);
  const jawline=F?jawlineFor(F):(pres==="m" ? 'M47.4 64.6c2 5.4 7.4 10.6 17.6 10.6s15.6-5.2 17.6-10.6' : 'M52 66c4 5 8 8 13 8s9-3 13-8');
  const jawShade='<clipPath id="'+id+'"><path d="'+chin+'"/></clipPath>'+
    '<g clip-path="url(#'+id+')">'+
      '<path d="'+jawline+'" fill="none" stroke="'+SKIN_D+'" stroke-width="'+(pres==="m"?6:5)+'" stroke-linecap="round" opacity="'+(pres==="m"?".34":".22")+'"/>'+
    '</g>';
  /* At the deepest tones the face and dark hair are within a few points of each
     other, and the head simply disappears into the hair - no silhouette at all.
     Brightening a near-black numerically only yields grey, so lift toward white
     instead, and only where the contrast is actually missing. */
  const L=lum(SKIN);

    ? '<path d="'+chin+'" fill="none" stroke="'+mix(SKIN,"#FFFFFF",0.42)+
      '" stroke-width="1.05" opacity="'+(0.34+0.56*(0.24-L)/0.24).toFixed(2)+'"/>'
    : '';
  return '<path d="'+chin+'" fill="'+SKIN+'"/>'+rim+jawShade+blush+
    noseFor(pres,nose,SKIN_D);
}

/* A full-screen look at the nurse. Appended to <body>, NOT to #modalHost -
   the builder is a modal, and writing into that host would wipe the design
   in progress the same way the locker trip used to. */
function nurseStage(pref){
  if(document.querySelector(".avstage"))return;
  const li=levelInfo(S.profile.xp);
  const w=document.createElement("div");
  w.className="avstage";
  w.innerHTML='<div class="stgcap">Level '+li.lvl+' \u00b7 '+esc(li.rank)+'</div>'+
    nurseAvatar(li.tier,340,pref?Object.assign({on:true},pref):null,true)+
    '<button class="btn sm" id="stgClose">Close</button>';
  const key=e=>{if(e.key==="Escape")off();};
  const off=()=>{w.remove();document.removeEventListener("keydown",key);};
  w.onclick=e=>{if(e.target===w||e.target.id==="stgClose")off();};
  document.addEventListener("keydown",key);

}
