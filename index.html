/* Same treatment as the trophies: the ranks you have reached plus the next one
   in the open, and the unknown ones behind a single line instead of nine copies
   of "?????". */
function rankLadder(){
  const li=levelInfo(S.profile.xp), top=Math.max(S.profile.rankMax||1,li.lvl);
  const topTier=tierOfLevel(top);
  const row=t=>{
    const lo=(t-1)*TIER_SIZE+1, hi=Math.min(LEVEL_MAX,t*TIER_SIZE);
    const here=t===li.tier, seen=t<=topTier, named=tierNamed(t);
    return '<div class="rankrow'+(here?" here":seen?" done":"")+'">'+
      '<span class="lv mono">'+lo+'\u2013'+hi+'</span>'+
      '<span class="nm'+(seen&&named?"":" hidden-rank")+'">'+(seen&&named?esc(rankName(t)):"?????")+'</span>'+
      (here?'<span class="chip">level '+li.lvl+'</span>':'')+'</div>';
  };
  /* show what you have climbed, the next tier up, then say plainly how far the
     rest goes - the unnamed stretch is meant to look like a long way off */
  const upto=Math.min(TIER_COUNT,Math.max(topTier,li.tier)+1);
  const left=TIER_COUNT-upto;
  const rows=[];for(let t=1;t<=upto;t++)rows.push(row(t));
  return '<div class="card" style="margin-bottom:10px"><div class="pad" style="padding-bottom:8px">'+
    '<div class="rankhead">'+
      '<div><span class="eyebrow">Level '+li.lvl+' of '+LEVEL_MAX+' \u00b7 week '+li.week+' \u00b7 '+rankPace(li)+'</span>'+
      '<div class="rankname">'+esc(li.rank)+'</div>'+
      '<div class="note" style="margin-top:5px;max-width:42ch">A hundred levels, and the name changes every fifth. A full week is five: eighty questions you have not seen before earns three, and that week\u2019s tasks earn two. '+esc(rankWhy(li))+'</div>'+
      '</div>'+
      '<div class="rankside"><b>'+li.inTier+'/'+TIER_SIZE+'</b><i>in this tier</i></div>'+
    '</div></div>'+
    rows.join("")+
    (left?'<div class="rankrow"><span class="lv mono">'+(upto*TIER_SIZE+1)+'\u2013'+LEVEL_MAX+'</span>'+
      '<span class="nm hidden-rank">'+left+' more tiers \u2014 unnamed so far</span></div>':'')+
  '</div>';
}
function gateSection(){
  const gs=allGates();
  if(!gs.length)return "";
  /* the same violet-into-scrubs run the Home boards wear */
  const open=gs.filter(g=>g.open).length;
  const money=GATE_BONUS*(gs.length-open);
  return drawer("gates","\u25C8","Exam gates",
    open+" of "+gs.length+" cleared"+(money?" \u00b7 $"+money+" still out there":""),
    gateCards(), open<gs.length&&open>0);
}
function gateCards(){
  const gs=allGates();
  if(!gs.length)return "";
  const bit=(ok,label,pending)=>'<span class="req-bit '+(ok?"ok":pending?"pending":"no")+'">'+(ok?"\u2713 ":pending?"\u00b7 ":"\u00d7 ")+label+'</span>';
  return '<div class="card" style="margin-bottom:16px"><div class="pad" style="padding-bottom:8px">'+
    '<span class="eyebrow">Exam gates &middot; '+gs.filter(g=>g.open).length+' of '+gs.length+' cleared</span>'+
    '<div class="note" style="margin-top:4px">Every gate needs the coursework checked off and the exam taken. Where the exam has a question bank, levels 1\u20132 have to be clear too \u2014 send Claude the slides for an exam and its levels appear here. Each gate pays $'+GATE_BONUS+', and all of them together carry you to rank 10.</div></div>'+
    gs.map(g=>{
      const c=courseById(g.ex.courseId)||{color:"var(--accent)"};
      const doneN=g.checklist.filter(e=>e.done).length;
      return '<div class="gate'+(g.open?" open":"")+'" style="border-left:3px solid '+c.color+'">'+
        '<div class="gtop"><span class="gt">'+esc(g.ex.title)+'</span>'+
        '<span class="mono gd">'+esc(prettyDay(g.ex.date))+'</span>'+
        (g.open?'<span class="chip" style="background:var(--accent-soft);color:var(--accent);border-color:transparent">cleared</span>':'')+'</div>'+
        /* Red is reserved for something that has actually gone wrong - a
           question still in the missed box, a practice test failed. A November
           exam you have not sat in September has not gone wrong, and rendering
           six crimson crosses at a student who is exactly on schedule is the
           app telling them off for the passage of time. Not-yet is grey. */
        '<div class="gbits">'+
          bit(g.sat,"exam taken",!g.sat)+
          bit(g.checklistDone,"coursework "+doneN+"/"+g.checklist.length,!g.checklistDone)+
          (g.hasBank?bit(g.r1,"levels 1\u20132 ("+g.t1.length+")",!g.r1):'')+
          (g.practice?bit(g.practicePassed,"practice test "+Math.round(g.practice.best*100)+"%"):'')+
          (g.honours?'<span class="req-bit ok">\u2713 90% first try</span>':'')+
          (g.missed.length?'<span class="req-bit no">'+g.missed.length+' missed</span>':'')+
        '</div>'+
        /* Levels 3-4 and 5 are not part of this gate. They carry ranks 11 and
           12, and showing them among the gate's own requirements made a cleared
           gate render with two red crosses on it. */
        (g.hasBank&&(g.t2.length||g.t3.length)
          ?'<div class="gbits gextra"><span class="gxl">beyond the gate</span>'+
            (g.t2.length?bit(g.r2,"levels 3\u20134 ("+g.t2.length+")",!g.r2):'')+
            (g.t3.length?bit(g.r3,"level 5 ("+g.t3.length+")",!g.r3):'')+
           '</div>':'')+
        (!g.hasBank?'<span class="req-bit pending" style="margin:0 2px 2px">coursework only \u2014 no questions yet</span>':'')+
      '</div>';
    }).join("")+'</div>';
}
/* A plain-text snapshot of where they actually are. The app keeps everything in
   this browser and nowhere else, so this is the only way to hand the state to
   someone else - a person, or Claude in chat - without shipping the data
   anywhere. It is deliberately compact and deliberately readable. */
/* ---------------------------------------------------------------------------
   THE COMPANION
   A figure that sways in the corner permanently becomes wallpaper in a day and
   an irritant by the third, and this is an app whose whole job is holding your
   attention on a question. So they arrive on a beat instead: walk in when you
   tick something off, say what you earned, and leave. Pin them if you want them
   there all the time - that is a choice, not the default.
--------------------------------------------------------------------------- */
const NURSE_STAY=3400;
let nurseTimer=null;
/* Tapping them. No dialogue - a line of text read as the app talking at you,
   and it got old on the second reading. They just move: the reaction gets
   bigger the more you tap in a row and resets once you leave them alone, so
   there is somewhere for it to go. */
const NURSE_MOVES=[
  ["nbob","nsmile"],                 // one or two taps: barely anything
  ["nwiggle","nsmile"],
  ["ndance","nbounce"],              // getting into it
  ["ndance","nspin"],
  ["nspin","nbounce","ndance"]];     // all in
let tapN=0,tapTimer=null,talkTimer=null,lastMove="";
function nurseTap(){
  const el=$("#nurseDock");
  if(!el||!el.classList.contains("in"))return;
  tapN++;
  if(S.profile.tapMax===undefined||tapN>S.profile.tapMax){S.profile.tapMax=tapN;saveCore();checkTrophies();}
  const pool=NURSE_MOVES[Math.min(tapN,NURSE_MOVES.length)-1];
  let move=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1&&move===lastMove)move=pool[(pool.indexOf(move)+1)%pool.length];
  lastMove=move;
  const fig=el.querySelector(".nfig");
  if(!fig)return;
  // a smile is a redraw, not a transform: the mouth has to actually change
  if(move==="nsmile")fig.innerHTML=nurseAvatar(levelInfo(S.profile.xp).tier,118,
    Object.assign({},avatarPrefs(),{mouth:"smirk",cheeks:avatarPrefs().cheeks||"soft"}),true);
  fig.classList.remove("nbob","nwiggle","ndance","nbounce","nspin","nsmile");
  void fig.offsetWidth;
  fig.classList.add(move);
  if(talkTimer)clearTimeout(talkTimer);
  talkTimer=setTimeout(()=>{
    const f=el.querySelector(".nfig");
    if(f){f.classList.remove("nbob","nwiggle","ndance","nbounce","nspin","nsmile");
          if(move==="nsmile")f.innerHTML=nurseAvatar(levelInfo(S.profile.xp).tier,118,null,true);}
    if(!S.profile.nursePin){el.classList.remove("in");document.body.classList.remove("ncheer");}
  },move==="ndance"?1900:1400);
  if(tapTimer)clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>{tapN=0;lastMove="";},4500);
}
function nurseDock(){
  let el=$("#nurseDock");
  if(!el){
    el=document.createElement("div");
    el.id="nurseDock";el.className="ndock";
    el.addEventListener("click",nurseTap);
    document.body.appendChild(el);
  }
  return el;
}
function nurseFigure(){
  return '<div class="nfig">'+nurseAvatar(levelInfo(S.profile.xp).tier,118,null,true)+'</div>';
}
function nurseCheer(msg,sub){
  if(S.profile.nurseOff)return false;
  const el=nurseDock();
  el.innerHTML='<div class="nbub"><b>'+esc(msg)+'</b>'+(sub?'<i>'+esc(sub)+'</i>':'')+'</div>'+nurseFigure();
  el.classList.remove("pinned");
  document.body.classList.add("ncheer");
  // restart the entrance even if they are already on their way out
  void el.offsetWidth;
  el.classList.add("in","arriving");
  if(nurseTimer)clearTimeout(nurseTimer);
  nurseTimer=setTimeout(()=>{
    el.classList.remove("arriving");
    if(S.profile.nursePin){el.classList.add("pinned");return;}
    el.classList.remove("in");
    document.body.classList.remove("ncheer");
  },NURSE_STAY);
  return true;
}
function nursePinSync(){
  const el=$("#nurseDock");
  if(S.profile.nursePin&&!S.profile.nurseOff){
    const d=nurseDock();
    if(!d.querySelector(".nfig"))d.innerHTML=nurseFigure();
    d.classList.add("in","pinned");
    document.body.classList.add("ncheer");   // so the toast stack clears them
  }else if(el&&!el.classList.contains("arriving")){
    el.classList.remove("in","pinned");
    document.body.classList.remove("ncheer");
  }
}

  L.push("XP "+(p.xp||0)+" · level "+li.lvl+"/"+LEVEL_MAX+" ("+li.rank+") · streak "+(p.longest||0)+
         " · accuracy "+(p.answered?acc+"% of "+p.answered:"—"));
  const all=todoOf(S.events), done=all.filter(e=>e.done).length;

    .sort((a,b)=>a.date<b.date?-1:1).slice(0,5);

  L.push("");

  L.push("BANK    "+(S.questions.length-prime)+" practice · "+prime+" before-class · "+S.materials.length+" materials");
  S.courses.filter(isStudy).forEach(c=>{

  const own=LOCKER.filter(i=>owns(i.id));

  L.push("");

/* Progress used to be five phone screens, and twenty-six of them were the same
   locked card repeated. The mystery survives one line better than it survives
   twenty-six copies of itself, so: what you have won, the single one you are
   closest to with its bar, and the rest behind a drawer. */
function trophyProgress(t){
  if(!t.k)return null;
  let v;try{v=t.k(S.profile,S);}catch(e){return null;}
  if(!v||!v[1])return null;
  return {have:Math.max(0,Math.min(v[0],v[1])),need:v[1],pct:Math.min(1,v[0]/v[1])};
}

/* ---------------------------------------------------------------------------
   TOPIC STRENGTH

   Accuracy per topic, weakest first, so the next thing to study is the top of
   the list rather than a guess. Every attempt counts, not just the last one -
   getting a question right on the fourth try is not the same as knowing it.

   A topic you have barely touched is not a weakness, it is untouched, so
   anything under four attempts is listed separately instead of being ranked
   against topics you have actually worked. */
const TS_MIN=4;
function topicStrength(){
  const rows={};
  S.questions.filter(q=>!q.prime&&(q.seen||0)>0).forEach(q=>{
    const k=q.courseId+"||"+(q.unit||"General");
    rows[k]=rows[k]||{courseId:q.courseId,unit:q.unit||"General",tries:0,miss:0,qs:0,open:0};
    rows[k].tries+=(q.seen||0);rows[k].qs++;
    if(!isDone(q))rows[k].open++;
  });
  (MINE.misses||[]).forEach(m=>{
    const k=m.courseId+"||"+(m.topic||"General");
    if(rows[k])rows[k].miss++;
  });
  return Object.keys(rows).map(k=>{
    const r=rows[k];
    r.pct=r.tries?Math.round(Math.max(0,r.tries-r.miss)/r.tries*100):0;
    r.thin=r.tries<TS_MIN;
    return r;
  }).sort((a,b)=>(a.thin-b.thin)||(a.pct-b.pct)||(b.tries-a.tries));
}
const tsBand=p=>p>=85?"good":p>=70?"okay":"poor";

  const rows=topicStrength();
  if(!rows.length)return '<div class="card pad" style="margin-bottom:14px"><span class="eyebrow" style="display:flex;align-items:center">'+stk("stand")+'Topic strength</span>'+
    '<div class="note" style="margin-top:6px">Answer a few questions in any topic and this ranks them weakest first.</div></div>';
  const solid=rows.filter(r=>!r.thin), thin=rows.filter(r=>r.thin);

     as the same topic twice; the leaf is the part that identifies it. */
  const bar=r=>{
    const c=courseById(r.courseId)||{}, P=unitParts(r.unit);
    const nm=P.leaf?P.leaf.charAt(0).toUpperCase()+P.leaf.slice(1):r.unit;
    return '<button type="button" class="tsrow" data-tsgo="'+esc(r.courseId+"||"+r.unit)+'">'+
      '<span class="tst"><b>'+esc(nm)+'</b>'+
        '<i>'+esc(c.code||"")+(P.key&&P.key!==r.unit?' \u00b7 '+esc(P.key):'')+
        ' \u00b7 '+r.tries+' answer'+(r.tries===1?'':'s')+

  };
  return '<div class="card pad greencard" style="margin-bottom:14px">'+
    '<span class="eyebrow" style="display:flex;align-items:center">'+stk("stand")+'Topic strength</span>'+
    (solid.length?'<div class="note" style="margin:4px 0 10px">Weakest first. Tap one to study it.</div>'+

/* ============================ sessions ============================ */
/* Prime questions are a separate pool. Attempting questions on material before
   you have studied it improves what you retain later, even when you get every
   one wrong - but only while being wrong is free. So they never touch accuracy,
   never count toward a weak-spot drill, and never feed an exam gate. Keeping
   them out of filteredQuestions is what makes all three true at once. */
/* One ladder, five levels, used everywhere. Pre-class draws the lower levels and
   after-class the upper ones, but a level means the same thing wherever it
   appears - which is the whole reason for having one scale instead of two. */
/* Why a wrong answer was wrong. Every distractor is tagged with one of these;
   the correct option is tagged null. Knowing you miss prioritization questions
   is a different problem from not knowing the content, and it wants different
   revision. */
const ERRTYPES=[
 {k:"knowledge",           n:"Knowledge",          d:"Did not know the content"},
 {k:"prioritization",      n:"Prioritization",     d:"All options valid \u2014 wrong order (ABC, Maslow, unstable first)"},
 {k:"assessment-vs-action",n:"Assess vs act",      d:"Acted when assessment was indicated, or the reverse"},
 {k:"scope",               n:"Scope",              d:"RN / LPN / UAP delegation error"},
 {k:"safety",              n:"Safety",             d:"Missed a contraindication or a notify-provider trigger"},
 {k:"stem-misread",        n:"Stem misread",       d:"Missed a qualifier \u2014 first, best, most, except, select all"},
 {k:"pharm-specific",      n:"Pharmacology",       d:"Wrong class, adverse effect, or nursing consideration"}];
const ERR_BY={};ERRTYPES.forEach(e=>{ERR_BY[e.k]=e;});
const ERR_KEYS=ERRTYPES.map(e=>e.k);
/* errs is parallel to options: same length, null on the correct one. */
const errsOf=q=>Array.isArray(q.errs)&&q.errs.length===(q.options||[]).length?q.errs:null;
const errAt=(q,i)=>{const e=errsOf(q);return e?e[i]||null:null;};
/* A question is useful for a given error type if one of its distractors carries
   it - that is what makes it able to catch the mistake again. */
const qHasErr=(q,k)=>{const e=errsOf(q);return !!e&&e.some((x,i)=>x===k&&i!==q.answer);};
const MIN_MISSES=25;                      // below this the error breakdown is noise
/* Two different things, and conflating them is why the app once claimed 57 weak
   spots to someone who had answered fourteen questions and got thirteen right.
   A weak spot is a question you actually got wrong and have not since put
   right. A MAJOR weak spot is one you have got wrong more than once - the same
   idea beating you twice is a different signal from a single slip, and it is
   the set worth drilling. Neither is "questions whose distractors resemble your
   usual mistakes", which is what the old weak pool quietly used. */
const missCounts=()=>{const m={};(MINE.misses||[]).forEach(x=>{m[x.qid]=(m[x.qid]||0)+1;});return m;};
function weakSets(){
  const mc=missCounts();
  const pool=filteredQuestions();
  const weak=pool.filter(q=>(q.wrong||0)>0);
  const major=pool.filter(q=>(mc[q.id]||0)>=2);
  const majorIds={};major.forEach(q=>majorIds[q.id]=1);
  return {weak:weak, major:major, mc:mc,
          minor:weak.filter(q=>!majorIds[q.id]),
          flagged:pool.filter(q=>MINE.flags&&MINE.flags[q.id])};
}

const LEVELS=[
 {n:1,name:"Name it",    blurb:"Terms and definitions"},
 {n:2,name:"Know it",    blurb:"Facts, numbers and drug classes"},
 {n:3,name:"Spot it",    blurb:"Given the findings, name the condition"},
 {n:4,name:"Do it",      blurb:"A scenario \u2014 what the nurse does"},
 {n:5,name:"Prioritize", blurb:"Several options \u2014 what comes first"}];
const lvOf=q=>Math.max(1,Math.min(5,q.level||q.tier||1));
/* The exam gates and the rank milestones still speak in three tiers, from
   before the ladder went to five levels. Everything seeded since then set only
   `level`, so `tier` silently defaulted to 1 for every question - which left
   the tier-2 and tier-3 milestones permanently empty and capped rank at 10.
   Derive it instead of defaulting it. */
const tierFromLevel=l=>l<=2?1:l<=4?2:3;
/* Mastery is earned, not counted: enough attempts at a level and a high enough
   hit rate. Meeting it opens the next level AND lets you skip past this one -
   nobody should have to grind definitions they already know. */
/* Mastered means mastered: every question on the level answered, and none of
   them currently sitting wrong. It used to mean six questions at 80%, so a level
   could be "mastered" with most of it never seen and one in five still missed -
   which is not what the word says and not a bar worth clearing. */
function levelStat(n){
  const qs=filteredQuestions().filter(q=>lvOf(q)===n);
  const seen=qs.filter(q=>(q.seen||0)>0);
  const wrongNow=qs.filter(q=>(q.wrong||0)>0).length;
  const attempts=seen.reduce((t,q)=>t+(q.seen||0),0);
  const misses=seen.reduce((t,q)=>t+(q.wrong||0),0);
  const rate=attempts?Math.max(0,(attempts-misses)/attempts):0;
  return {n:n,total:qs.length,tried:seen.length,attempts:attempts,rate:rate,
          wrongNow:wrongNow,
          left:qs.length-seen.length+wrongNow,
          mastered:qs.length>0&&seen.length===qs.length&&wrongNow===0};
}
/* The highest level you have opened: level 1 always, and each one after it once
   the level below is mastered. Nothing is locked forever and nothing is gated on
   a streak you cannot see. */
function openLevel(){
  let top=1;
  for(let n=1;n<5;n++){
    const st=levelStat(n);
    // a level with nothing in it cannot be mastered, and must not wall off the
    // level above - 314 has no level-1 questions at all
    if(st.total===0||st.mastered)top=n+1; else break;
  }
  return top;
}
function filteredQuestions(){
  return S.questions.filter(q=>!q.prime&&(courseFilter==="all"||q.courseId===courseFilter));
}
function primeQuestions(){
  return S.questions.filter(q=>q.prime&&(courseFilter==="all"||q.courseId===courseFilter));
}
const primeKey=q=>q.courseId+"|"+(q.unit||"General");
function primeSets(){
  const by={};
  primeQuestions().forEach(q=>{(by[primeKey(q)]=by[primeKey(q)]||[]).push(q);});
  const aw=S.profile.awarded||{};
  return Object.keys(by).map(k=>{
    const qs=by[k],c=courseById(qs[0].courseId);
    return {key:k,unit:qs[0].unit||"General",course:c,qs:qs,
            done:!!aw["prime:"+k],xp:PRIME_XP};
  }).sort((a,b)=>(a.done-b.done)||String(a.unit).localeCompare(String(b.unit)));
}
const PRIME_XP=40;
const shuffle=a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=x[i];x[i]=x[j];x[j]=t;}return x;};
/* Options are shown in a shuffled order. The bank stores most right answers
   in slot A - the natural way to write a question - and a pattern like that is
   learned in an afternoon without anyone meaning to. The shuffle is fixed per
   question for the life of the round, so a re-render never reorders the list
   under a hand that is about to click, and it is saved with the round. */
function optOrder(store,q){
  store.perm=store.perm||{};
  if(!store.perm[q.id]||store.perm[q.id].length!==q.options.length){
    store.perm[q.id]=shuffle(q.options.map((_,i)=>i));
    if(store===session)saveRound();               // a parked round keeps its order
  }
  return store.perm[q.id];
}
function startSession(mode,key,ids){
  let pool;
  if(ids&&ids.length){
    /* An explicit set: the ones you just got wrong, or the ones you flagged.
       Kept in the order given so a redo walks the misses in the order you hit
       them, which is the order you remember them in. */
    const by={};S.questions.forEach(q=>{by[q.id]=q;});
    pool=ids.map(id=>by[id]).filter(Boolean);
  }
  else if(mode==="prime"){pool=shuffle(primeQuestions().filter(q=>primeKey(q)===key));}
  else{
    pool=filteredQuestions();
    if(mode==="weak"||mode==="major"||mode==="flagged"){
      /* Only questions you have actually got wrong. The old pool also swept in
         anything whose distractors matched your usual error types, which is how
         someone who had answered fourteen questions and missed one was told
         they had 57 weak spots. Ranked by how many times it has beaten you, so
         the repeat offenders come first. */
      const W=weakSets();
      const set=mode==="major"?W.major:mode==="flagged"?W.flagged:W.weak;
      pool=set.slice().sort((a,b)=>((W.mc[b.id]||0)-(W.mc[a.id]||0))||((b.wrong||0)-(a.wrong||0)));
    }
    else{
      // a chosen level, else everything at or below the highest one you have opened
      if(key)pool=pool.filter(q=>lvOf(q)===+key);
      else{
        const top=openLevel();
        let mix=pool.filter(q=>lvOf(q)<=top);
        // if every open level happens to be empty, fall back to the lowest one
        // that actually has questions rather than starting nothing
        if(!mix.length&&pool.length){
          const low=Math.min.apply(null,pool.map(lvOf));
          mix=pool.filter(q=>lvOf(q)===low);
        }
        pool=mix;
      }
      // Review is the one mode that deliberately shows you what you already know
      if(mode!=="review"){
        const left=stillOpen(pool);
        if(left.length)pool=left;
        else{
          toast("Nothing left open","You have answered all of these right. Use Review to go through them again.");
          session=null;clearRound();render();return;
        }
      }
      pool=shuffle(pool).sort((a,b)=>(lvOf(a)-lvOf(b))||((a.seen||0)-(b.seen||0)));
    }
  }
  if(!pool.length){
    toast("Nothing to run","There are no questions in that set right now.");
    session=null;clearRound();render();return;
  }
  const size=(ids&&ids.length)?pool.length
    :mode==="boss"?Math.min(15,pool.length)
    :(mode==="rapid"||mode==="prime")?pool.length:Math.min(15,pool.length);
  session={mode:mode,key:key,qs:pool.slice(0,size),i:0,picked:null,correct:0,answers:[],xp:0,run:0,
    endsAt:mode==="rapid"?Date.now()+15000:mode==="boss"?Date.now()+720000:null,done:false,
    ids:(ids&&ids.length)?pool.map(q=>q.id):null};
  saveRound();
  if(session.endsAt){
    const id=setInterval(()=>{
      if(!session||session.done||session.timer!==id)return clearInterval(id);
      if(Date.now()>=session.endsAt){clearInterval(id);finishSession();}
      else{const el=$("#clock");if(el)el.textContent=fmtClock(session.endsAt-Date.now());}
    },250);
    session.timer=id;
  }
  render();
}
/* A round you walked away from is not a round you abandoned. Leaving the tab
   used to be impossible (the nav simply ignored you) and closing the page threw
   the round away, so a fourteen-question set you were nine into was gone.
   Untimed rounds are parked and picked up where you left them. Timed ones -
   Rapid fire, Boss battle - are not: a clock you can pause is not a clock. */
const ROUND_KEY="cn_round";
const timed=m=>m==="rapid"||m==="boss";
function saveRound(){
  const s=session;
  if(!s||s.done||timed(s.mode)){clearRound();return;}
  LS.set(ROUND_KEY,{mode:s.mode,key:s.key||null,ids:s.qs.map(q=>q.id),i:s.i,
    picked:s.picked,correct:s.correct,xp:s.xp,run:s.run,explicit:!!s.ids,perm:s.perm||{},
    answers:s.answers.map(a=>({id:a.q.id,pick:a.pick,ok:a.ok})),at:Date.now()});
}
function clearRound(){LS.del(ROUND_KEY);}
function parkedRound(){
  const r=LS.get(ROUND_KEY,null);
  if(!r||!Array.isArray(r.ids)||!r.ids.length)return null;
  const by={};S.questions.forEach(q=>{by[q.id]=q;});
  const qs=r.ids.map(id=>by[id]).filter(Boolean);
  if(qs.length!==r.ids.length)return null;         // the bank changed under it
  return {r:r,qs:qs};
}
function resumeRound(){
  const p=parkedRound();if(!p)return false;
  const {r,qs}=p, by={};qs.forEach(q=>{by[q.id]=q;});
  session={mode:r.mode,key:r.key,qs:qs,i:Math.min(r.i,qs.length-1),picked:r.picked,
    correct:r.correct||0,xp:r.xp||0,run:r.run||0,endsAt:null,done:false,
    ids:r.explicit?qs.map(q=>q.id):null,perm:r.perm||{},
    answers:(r.answers||[]).map(a=>({q:by[a.id],pick:a.pick,ok:a.ok})).filter(a=>a.q)};
  tab="study";render();return true;
}
const fmtClock=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};

  $$(".opt").forEach(b=>b.onclick=()=>pick(parseInt(b.dataset.opt,10)));

/* {questionId, topic, errorType, timestamp} - the shape the breakdown reads. */
function logMiss(q,idx){
  MINE.misses.push({qid:q.id,courseId:q.courseId,topic:q.unit||"General",
    errorType:errAt(q,idx)||"knowledge",level:lvOf(q),at:Date.now()});
  if(MINE.misses.length>MISS_CAP)MINE.misses=MINE.misses.slice(-MISS_CAP);
}
/* Counts AND exposure. A type you rarely meet should not read as a strength, so
   the rate is misses over the number of times that type was actually on screen. */
function errBreakdown(courseId,topic){
  const inScope=q=>(!courseId||courseId==="all"||q.courseId===courseId)&&(!topic||topic==="all"||q.unit===topic);
  const seen={},miss={};ERR_KEYS.forEach(k=>{seen[k]=0;miss[k]=0;});
  S.questions.filter(q=>!q.prime&&inScope(q)&&(q.seen||0)>0).forEach(q=>{
    ERR_KEYS.forEach(k=>{if(qHasErr(q,k))seen[k]+=(q.seen||0);});
  });
  MINE.misses.filter(m=>(!courseId||courseId==="all"||m.courseId===courseId)&&
                        (!topic||topic==="all"||m.topic===topic))
    .forEach(m=>{if(miss[m.errorType]!==undefined)miss[m.errorType]++;});
  const total=Object.keys(miss).reduce((t,k)=>t+miss[k],0);
  return {total:total,rows:ERR_KEYS.map(k=>({k:k,n:ERR_BY[k],miss:miss[k],faced:seen[k],
    rate:seen[k]?miss[k]/seen[k]:0})).sort((a,b)=>b.rate-a.rate||b.miss-a.miss)};
}
function topErrors(n){
  const b=errBreakdown("all","all");
  return b.rows.filter(r=>r.miss>0).slice(0,n||2).map(r=>r.k);
}
function pick(idx){
  const s=session,q=s.qs[s.i];
  if(s.picked!==null)return;
  s.picked=idx;
  const ok=idx===q.answer;
  s.answers.push({q:q,pick:idx,ok:ok});
  q.seen=(q.seen||0)+1;q.lastSeen=today();
  if(s.mode==="prime"){
    // a wrong answer before the lecture is the point, not a failure: it is
    // recorded only so the watch-list at the end knows what to flag
    if(ok)s.correct++; else q.pwrong=(q.pwrong||0)+1;
    saveQuestions([q]);
    render();return;
  }
  if(ok){s.correct++;s.run++;q.wrong=Math.max(0,(q.wrong||0)-1);s.xp+=s.mode==="rapid"?18:15;}
  else{
    s.run=0;q.wrong=(q.wrong||0)+1;s.xp+=3;
    logMiss(q,idx);
  }
  /* Review does not advance the box - looking at something you were shown
     seconds ago is not a memory test. Everything else moves the schedule. */
  if(s.mode!=="review")schedule(q,ok&&(q.wrong||0)===0);
  S.profile.answered++;if(ok)S.profile.correct++;
  S.profile.curRun=ok?(S.profile.curRun||0)+1:0;
  S.profile.bestRun=Math.max(S.profile.bestRun||0,S.profile.curRun);
  saveQuestions([q]);
  if(s.mode==="rapid"||s.mode==="boss"){setTimeout(advance,s.mode==="rapid"?180:120);}
  render();
}
function advance(){
  const s=session;if(!s)return;
  s.picked=null;s.i++;
  saveRound();
  if(s.i>=s.qs.length){
    if(s.mode==="rapid"&&Date.now()<s.endsAt&&filteredQuestions().length){s.qs=s.qs.concat(shuffle(filteredQuestions()));}
    else return finishSession();
  }
  render();
}
function finishSession(){
  const s=session;if(!s||s.done)return;
  s.done=true;if(s.timer)clearInterval(s.timer);
  clearRound();
  const total=s.answers.length;
  if(s.mode==="prime"){
    if(total){
      logStudyDay();
      const p=S.profile;p.awarded=p.awarded||{};
      const k="prime:"+s.key;
      if(!p.awarded[k]){                       // paid once per set, not per run
        p.awarded[k]=today();earnXp(PRIME_XP);
        toast("Ready for class","+"+PRIME_XP+" XP \u2014 you know what to listen for now.",true);
      }
      saveCore();checkTrophies();
    }
    render();return;
  }
  if(total){
    logStudyDay();
    earnXp(s.xp+20);
    bumpToday(total);
    const pct=s.correct/total;
    if(total>=5&&s.correct===total)confetti(50);      // a perfect round
    if(s.mode==="rapid")S.profile.bestRapid=Math.max(S.profile.bestRapid||0,s.correct);
    if(s.mode==="weak"&&total>=5&&s.correct===total)S.profile.weakCleared=true;
    if(s.mode==="boss"&&total>=10&&pct>=.8){
      S.profile.bossWins=(S.profile.bossWins||0)+1;earnXp(150);confetti(80);
      if(s.correct===total)S.profile.perfectBoss=true;
    }
    saveCore();checkTrophies();
  }
  render();
}

/* ============================ file extraction ============================ */
function unxml(s){return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");}
async function extractPptx(file){
  const zip=await JSZip.loadAsync(file);
  const num=n=>parseInt((n.match(/(\d+)\.xml$/)||[0,0])[1],10);
  const slides=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>num(a)-num(b));
  const notes=Object.keys(zip.files).filter(n=>/^ppt\/notesSlides\/notesSlide\d+\.xml$/.test(n));
  const noteMap={};notes.forEach(n=>{noteMap[num(n)]=n;});
  let out=[];
  for(let i=0;i<slides.length;i++){
    const xml=await zip.files[slides[i]].async("string");
    const txt=(xml.match(/<a:t>[\s\S]*?<\/a:t>/g)||[]).map(t=>unxml(t.replace(/<\/?a:t>/g,""))).filter(Boolean);
    let block="--- Slide "+num(slides[i])+" ---\n"+txt.join("\n");
    const nf=noteMap[num(slides[i])];
    if(nf){
      const nx=await zip.files[nf].async("string");
      const nt=(nx.match(/<a:t>[\s\S]*?<\/a:t>/g)||[]).map(t=>unxml(t.replace(/<\/?a:t>/g,""))).filter(Boolean).join(" ");
      if(nt.replace(/\d+/g,"").trim().length>25)block+="\n[Speaker notes] "+nt;
    }
    out.push(block);
  }
  return out.join("\n\n");
}
async function extractDocx(file){
  const zip=await JSZip.loadAsync(file);
  const f=zip.files["word/document.xml"];if(!f)return "";
  let xml=await f.async("string");
  xml=xml.replace(/<\/w:p>/g,"\n");
  return (xml.match(/<w:t[^>]*>[\s\S]*?<\/w:t>|\n/g)||[]).map(t=>t==="\n"?"\n":unxml(t.replace(/<w:t[^>]*>/,"").replace("</w:t>",""))).join("").replace(/\n{3,}/g,"\n\n").trim();
}
function cleanCaptions(txt){
  const lines=txt.split(/\r?\n/),out=[];let prev="";
  for(const raw of lines){
    const l=raw.trim();
    if(!l||l==="WEBVTT"||/^\d+$/.test(l))continue;
    if(/\d{1,2}:\d{2}(:\d{2})?[.,]\d{0,3}\s*-->/.test(l))continue;
    const c=l.replace(/<[^>]+>/g,"").replace(/^\[[^\]]*\]\s*/,"").trim();
    if(!c||c===prev)continue;
    prev=c;out.push(c);
  }
  return out.join(" ").replace(/\s{2,}/g," ");
}
async function ingestFile(file){
  const name=file.name,low=name.toLowerCase();
  let text="";
  const zipped=low.endsWith(".pptx")||low.endsWith(".docx");
  if(zipped&&typeof JSZip==="undefined"){toast("Cannot open "+name,"The file reader did not load. Reload the page, or copy the text in with Paste notes.");return null;}
  if(low.endsWith(".pptx"))text=await extractPptx(file);
  else if(low.endsWith(".docx"))text=await extractDocx(file);
  else{
    const raw=await file.text();
    text=(low.endsWith(".vtt")||low.endsWith(".srt"))?cleanCaptions(raw):raw;
  }
  text=text.replace(/[\u00a0\u200b]/g," ").replace(/[ \t]{2,}/g," ").trim();
  if(text.length<80){toast("Nothing readable in "+name,"If it is a scanned PDF or an image-only deck, copy the text and use Paste notes.");return null;}
  return {name:name,text:text};
}

/* ============================ question generation ============================ */
function chunk(text,size){
  const out=[];const paras=text.split(/\n{2,}/);let cur="";
  for(const p of paras){
    if((cur+"\n\n"+p).length>size&&cur){out.push(cur);cur=p;}
    else cur=cur?cur+"\n\n"+p:p;
    while(cur.length>size){out.push(cur.slice(0,size));cur=cur.slice(size);}
  }
  if(cur.trim())out.push(cur);
  return out;
}
async function generate(materialId,count,gateSid){
  if(!SAMPLE){toast("Question writing is unavailable here","Send the slides to Claude in chat instead \u2014 they will arrive in the next update.");return;}
  const m=S.materials.find(x=>x.id===materialId);if(!m)return;
  const chunks=chunk(m.text,11000).slice(0,6);
  const per=Math.max(3,Math.ceil(count/chunks.length));
  modal("Writing questions",'<div class="row" style="align-items:center;gap:10px"><span class="spin"></span><span id="genMsg">Reading '+esc(m.name)+'\u2026</span></div><div class="note" id="genSub">Five levels, from naming terms to prioritizing care \u2014 about a minute a part. Leave it open.</div>',"");
  const made=[];let rejected=0;const order=chunks.map((_,i)=>i);let redone=0;
  for(let j=0;j<order.length&&made.length<count;j++){
    const i=order[j],strict=j>=chunks.length;
    const msg=$("#genMsg");if(msg)msg.textContent=(strict?"Rewriting one part \u2014 ":"Part "+(j+1)+" of "+chunks.length+" \u2014 ")+made.length+" questions so far";
    const prompt=
"You are writing NCLEX-style practice questions for a nursing student, using ONLY the source material below. Do not add facts, drugs, values, or conditions that are not in the material. Use the instructor's own wording and emphasis.\n\n"+
"Write "+per+" questions spread across five levels, roughly evenly:\n"+
"  level 1 NAME IT \u2014 terms and definitions\n"+
"  level 2 KNOW IT \u2014 facts, numbers, drug classes\n"+
"  level 3 SPOT IT \u2014 given the findings, name the condition\n"+
"  level 4 DO IT \u2014 a short scenario, what the nurse does\n"+
"  level 5 PRIORITIZE \u2014 several valid options, what comes first\n\n"+
"Each question must have exactly 4 options, plausible distractors, one clearly best answer, a rationale saying why the answer is right AND why each other option is wrong, and a short topic tag taken from the material.\n\n"+
"NO GIVEAWAYS. The four options must be about the same length and built the same way - the right answer is never the longest, the most detailed, or the only one with a qualifier. A distractor is a wrong answer to THIS question from THIS topic, never a right answer to a question about a different body system. Put the right answer in a different position each time; do not default to A.\n\n"+
"ERROR TYPES. Every option gets an errorType naming the mistake a student makes when they pick it. Use ONLY these keys:\n"+
"  knowledge \u2014 did not know the content\n"+
"  prioritization \u2014 all options valid, wrong order (ABC, Maslow, unstable before stable, acute before chronic)\n"+
"  assessment-vs-action \u2014 acted when assessment was indicated, or assessed when action was indicated\n"+
"  scope \u2014 RN / LPN / UAP delegation error\n"+
"  safety \u2014 missed a contraindication or a notify-the-provider trigger\n"+
"  stem-misread \u2014 missed a qualifier: first, best, most, except, or that it was select-all\n"+
"  pharm-specific \u2014 wrong drug class, adverse effect, or nursing consideration\n"+
"The correct option gets null. The three distractors must span AT LEAST TWO different error types \u2014 never all three the same. If a question you have written cannot honestly carry two different types, rewrite the distractors until it can.\n\n"+
"Return JSON only, no prose, this exact shape (errs is parallel to options):\n"+
'{"questions":[{"level":1,"unit":"string","stem":"string","options":["a","b","c","d"],"answer":0,"errs":[null,"knowledge","safety","stem-misread"],"rationale":"string"}]}\n\n'+
(strict?"An earlier attempt on this material was rejected because a question's three distractors all carried the same error type. Do not do that again \u2014 check every question before you return it.\n\n":"")+
"SOURCE MATERIAL \u2014 "+m.name+" (part "+(i+1)+" of "+chunks.length+"):\n\"\"\"\n"+chunks[i]+"\n\"\"\"";
    try{
      const res=await SAMPLE.json(prompt,{modelTier:"default"});
      const qs=(res&&res.questions)||[];
      qs.forEach(q=>{
        if(!q||!q.stem||!Array.isArray(q.options)||q.options.length!==4)return;
        let a=parseInt(q.answer,10);if(!(a>=0&&a<=3))a=0;
        let t=parseInt(q.level,10);if(!(t>=1&&t<=5))t=1;
        let errs=Array.isArray(q.errs)&&q.errs.length===4
          ?q.errs.map((x,i)=>i===a?null:(ERR_KEYS.indexOf(String(x))>=0?String(x):"knowledge")):null;
        if(errs){
          const kinds={};errs.forEach((x,i)=>{if(x&&i!==a)kinds[x]=1;});
          if(Object.keys(kinds).length<2){
            rejected++;
            if(redone<chunks.length&&order.indexOf(i,chunks.length)<0){order.push(i);redone++;}
            return;
          }
        }
        made.push({id:uid(),courseId:m.courseId,materialId:m.id,tier:tierFromLevel(t),level:t,gate:gateSid||null,
          unit:String(q.unit||m.name).slice(0,60),stem:String(q.stem),options:q.options.map(String),
          answer:a,errs:errs,rationale:String(q.rationale||""),seen:0,wrong:0,lastSeen:null});
      });
    }catch(err){
      const code=err&&err.code;
      if(code==="not_granted"){closeModal();toast("Question writing was declined","Reload and allow it when the prompt appears.");return;}
      if(code==="rate_limited"){await new Promise(r=>setTimeout(r,4000));continue;}
      const sub=$("#genSub");if(sub)sub.textContent="One batch did not come back. Carrying on with the rest.";
    }
  }
  closeModal();
  if(!made.length){toast("No questions came back","Try again, or add more of the lecture text.");return;}
  const keep=made.slice(0,count);
  S.questions=S.questions.concat(keep);
  await saveQuestions(keep);
  checkTrophies();render();
  const by=n=>keep.filter(q=>lvOf(q)===n).length;
  toast(keep.length+" questions ready",
    LEVELS.map(L=>by(L.n)+" "+L.name).filter(x=>x.charAt(0)!=="0").join(" \u00b7 ")+
    (rejected?" \u00b7 "+rejected+" rewritten":"")+(gateSid?", counting toward that exam.":"."));
}

function findEvent(id,key){
  return S.events.find(x=>x.id===id)||(key?S.events.find(x=>evKey(x)===key):null)||null;
}
function toggleDone(id,silent,key){
  const e=findEvent(id,key);
  if(!e){toast("Could not find that item","Reload the page \u2014 if it keeps happening, tell Claude.");return;}
  e.done=!e.done;
  if(!e.done){
    /* Hand back exactly what this item paid out, so ticking and unticking the
       same box cannot be used to farm XP. `e.xp||10` was wrong the moment
       anything could pay zero: a bulk-cleared item carries xp 0, and 0||10 is
       10, so unticking one CHARGED ten points it had never been paid. */
    delete e.doneOn;
    addXp(-(e.xp==null?10:e.xp));
    delete e.xp;
    const bo=S.profile.dayBonus||{};
    if(bo[e.date]&&!dayCleared(e.date)){delete bo[e.date];addXp(-10);}
  }else{
    e.doneOn=today();
    addXp(10);e.xp=10;logStudyDay();
    if(dayDiff(e.date)>=2)S.profile.earlyDone=true;
    // the day-cleared bonus is earned once per date, ever
    const bon=S.profile.dayBonus=S.profile.dayBonus||{};
    const sameDay=todoOf(S.events.filter(x=>x.date===e.date));
    if(sameDay.length>1&&sameDay.every(x=>x.done)&&!bon[e.date]){
      bon[e.date]=true;addXp(10);
      if(!nurseCheer("Day cleared","+20 XP \u2014 everything on "+e.date+" is done."))
        toast("Day cleared","+10 XP \u2014 everything on "+e.date+" is done.",true);
    }
    else if(!silent&&!nurseCheer("+10 XP",e.title))toast("Checked off","+10 XP \u2014 "+e.title);
  }
  render();
  checkTrophies();
  saveCore();
}
function openDay(iso){
  if(!iso)return;
  try{dayModal(iso);}
  catch(err){
    toast("Could not open that day","Reload the page and try again.");
    try{console.error("openDay",iso,err);}catch(e){}
  }
}
function dayModal(iso,allCourses){
  const d=parseD(iso);
  const WD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  // Follows the course tab: pick a class and the day sheet shows only that class.
  const cc=allCourses?"all":calCourse;
  const evs=S.events.filter(e=>e.date===iso&&(cc==="all"||e.courseId===cc)).sort((a,b)=>
    ((cc!=="all"&&b.courseId===cc?1:0)-(cc!=="all"&&a.courseId===cc?1:0))||
    (TYPES.indexOf(a.type)-TYPES.indexOf(b.type))||a.title.localeCompare(b.title));
  const tdy=todoOf(evs), left=tdy.filter(e=>!e.done).length;
  const head=WD[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate();
  const body=(evs.length
    ? '<div class="daytop"><span class="eyebrow">'+(tdy.length?(left?left+" left of "+tdy.length:"all "+tdy.length+" done"):evs.length+" on the schedule")+'</span>'+
      /* the chip describes what is still owed on that day, not the date - a day
         whose only entry is a clinical is never late */
      (iso===today()?'<span class="chip">Today</span>':dueChip({date:iso,done:false,fyi:!left}))+'</div>'+
      evs.map(e=>'<div class="dayrow'+(e.done?" off":"")+'">'+
        (isFyi(e)
          ? '<span class="bigbox fyi" aria-hidden="true"></span>'
          : '<input type="checkbox" class="bigbox" data-wk="'+e.id+'" data-key="'+esc(evKey(e))+'"'+(e.done?" checked":"")+' aria-label="Mark done">')+
        '<div class="body"><div class="t">'+esc(e.title)+'</div>'+
        '<div class="m"><span style="color:'+courseColor(e.courseId)+';font-weight:600">'+esc(courseName(e.courseId))+'</span> &middot; '+esc(typeLabel(e))+
        (e.notes?'<br>'+esc(e.notes):'')+'</div></div>'+
        '<button class="btn sm ghost" data-de="'+e.id+'">Edit</button></div>').join("")
    : '<div class="empty"><b>Nothing scheduled</b>Add something to this day below.</div>');
  const shownHere=calEvents().filter(e=>e.date===iso).length;
  const note=(evs.length>shownHere)?'<div class="note" style="margin:-4px 0 2px">Showing '+(evs.length===1?'the 1 item':'all '+evs.length+' items')+' on this day \u2014 the grid behind is filtered to one course.</div>':'';
  modal(head,note+body,'<button class="btn" id="dayAdd" style="margin-right:auto">Add to this day</button>'+
    (evs.length&&left?'<button class="btn" id="dayAll">Check off all</button>':'')+
    '<button class="btn primary" id="dayClose">Done</button>');
  $("#dayClose").onclick=closeModal;
  $("#dayAdd").onclick=()=>{closeModal();eventForm({id:"",courseId:calCourse!=="all"?calCourse:((S.courses[0]||{}).id||""),title:"",type:"Assignment",date:iso,notes:""});};
  const allBtn=$("#dayAll");
  if(allBtn)allBtn.onclick=()=>{
    for(const e of evs)if(!e.done)toggleDone(e.id,true);
    dayModal(iso);
  };
  
  $$("[data-de]").forEach(b=>b.onclick=()=>{const e=S.events.find(x=>x.id===b.dataset.de);closeModal();if(e)eventForm(e);});
}

function wire(){
  $$("[data-cal]").forEach(b=>b.onclick=()=>{
    const d=+b.dataset.cal;
    if(d===0){const t=focusTarget();calMonth=t.m;calYear=t.y;}
    else{calMonth+=d;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}}
    render();
  });
  $$("[data-ev]").forEach(b=>b.onclick=()=>{const e=S.events.find(x=>x.id===b.dataset.ev);if(e)eventForm(e);});
  $$("[data-lev]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();const e=S.events.find(x=>x.id===b.dataset.lev);if(e)eventForm(e);});
  $$("[data-sday]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();openDay(b.dataset.sday);});
  const sz=$("#semZ");
  if(sz)sz.oninput=()=>{semZoom=(+sz.value||100)/100;const pg=$(".sempage");if(pg)pg.style.setProperty("--z",semZoom);};

  $$("[data-day]").forEach(c=>{c.onclick=()=>openDay(c.dataset.day);});
  $$("[data-msel]").forEach(sel=>sel.onchange=()=>{
    const p=String(sel.value).split("-");
    calYear=+p[0];calMonth=+p[1];render();
  });
  $$("[data-detail]").forEach(b=>b.onclick=()=>{
    calDetail=b.dataset.detail==="1";
    try{localStorage.setItem("cn_detail",calDetail?"1":"0");}catch(e){}
    render();
  });
  $$("[data-ctab]").forEach(b=>b.onclick=()=>{
    calCourse=b.dataset.ctab;
    try{localStorage.setItem("cn_ctab",calCourse);}catch(e){}
    focusMonth();render();
  });
  $$("[data-plan]").forEach(b=>b.onclick=()=>{courseFilter=b.dataset.plan;tab="study";render();});
  $$("[data-goto]").forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render();});
  $$("[data-cf]").forEach(b=>b.onclick=()=>{courseFilter=b.dataset.cf;render();});
  /* A level you have finished opens as a review instead of refusing to open. */
  $$("[data-lv]").forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    const n=+b.dataset.lv;
    const has=stillOpen(filteredQuestions().filter(q=>lvOf(q)===n)).length;
    startSession(has?"practice":"review",b.dataset.lv);});
  const la=$("#lvAll"); if(la)la.onclick=()=>{
    const has=stillOpen(filteredQuestions().filter(q=>lvOf(q)<=openLevel())).length;
    startSession(has?"practice":"review");};
  const wt=$("#wkTopic"); if(wt)wt.onchange=()=>{weakTopic=wt.value;render();};
  const wd=$("#wkDrill"); if(wd)wd.onclick=()=>startSession("weak");
  $$("[data-drill]").forEach(b=>b.onclick=()=>{if(!b.disabled)startSession(b.dataset.drill);});
  /* Redrawn in place so the caret never jumps out of the box mid-word. */
  const fq=$("#fq");
  if(fq){
    fq.oninput=()=>{
      FIND=fq.value;
      const host=$("#fres"); if(host){host.innerHTML=searchPanel();wireFind();}
      const rest=$("#fbody"); if(rest)rest.hidden=FIND.trim().length>=2;
    };
    if(FIND){const n=fq.value.length;try{fq.focus();fq.setSelectionRange(n,n);}catch(e){}}
  }
  const fx=$("#fqx"); if(fx)fx.onclick=()=>{FIND="";render();};
  wireFind();
  $$("[data-tsgo]").forEach(b=>b.onclick=()=>{
    const bits=b.dataset.tsgo.split("||");

function handleFiles(list){
  const files=Array.from(list||[]);if(!files.length)return;

    const added=[];
    for(const f of files){
      const el=$("#ingMsg");if(el)el.textContent="Reading "+f.name+"…";
      try{const r=await ingestFile(f);if(r)added.push(await addMaterial(cid,r.name,r.text));}
      catch(err){toast("Could not open "+f.name,"That file type may not be supported.");}
    }
    closeModal();render();
    if(added.length===1)genPrompt(added[0].id);
    else if(added.length)toast(added.length+" materials added","Choose Write questions on each one to build its bank.");
  });
}

/* Delegated handlers — bound once, so a re-render can never leave a control dead. */

/* Pick up a newer published version without anyone having to think about it:
   when the page comes back into view after a long gap, reload it. A reload
   re-fetches the current version; personal progress lives in this browser, so
   nothing is lost. Never interrupts an open dialog or a study session. */
let LOADED_AT=Date.now();
const STALE_MS=4*60*60*1000;
function refreshIfStale(){
  if(Date.now()-LOADED_AT<STALE_MS)return;
  if(session&&!session.done)return;
  if($("#modalHost")&&$("#modalHost").innerHTML)return;
  if(document.visibilityState!=="visible")return;
  try{location.reload();}catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refreshIfStale();});
setInterval(refreshIfStale,15*60*1000);

/* ============================ boot ============================ */
/* Tapping a tab used to do NOTHING while a round was live - no message, no
   effect - so the only way out was closing the page. A control that silently
   refuses is worse than no control. Leaving now parks the round. */
$$(".navbtn").forEach(b=>b.onclick=()=>{
  if(session&&!session.done){
    if(timed(session.mode)){
      if(session.timer)clearInterval(session.timer);
      toast("Round ended","A timed round cannot be paused.");
    }else{
      saveRound();
      toast("Round parked","Pick it up from Study whenever you like.");
    }
  }
  if(FIGHT&&b.dataset.nav!=="fight"){if(FIGHT.timer)clearInterval(FIGHT.timer);FIGHT=null;}
  session=null;calFull=false;tab=b.dataset.nav;render();});

/* A hand escape hatch. Account storage is the real answer, but until that is
   switched on this is the only way progress survives a device that forgets. */
function backupBlob(){
  saveCore();
  return JSON.stringify({v:1,at:Date.now(),
    core:LS.get("cn_core",null),mine:LS.get("cn_mine",null),materials:LS.get("cn_materials",{})});
}
/* 37 KB of JSON is a lot to ask anyone to paste into a phone note. JSZip is
   already on the page for the material importer, so squeeze it. */
async function backupCode(){
  const raw=backupBlob();
  if(!window.JSZip)return raw;
  try{const z=new JSZip();z.file("cn.json",raw);
    return "CN1:"+await z.generateAsync({type:"base64",compression:"DEFLATE",compressionOptions:{level:9}});}
  catch(e){return raw;}
}
async function restoreCode(txt){
  let t=String(txt||"").trim();
  if(t.slice(0,4)==="CN1:"){
    if(!window.JSZip)return false;
    try{const z=await JSZip.loadAsync(t.slice(4),{base64:true});t=await z.file("cn.json").async("string");}
    catch(e){return false;}
  }
  return restoreBlob(t);
}
function restoreBlob(txt){
  let o=null;try{o=JSON.parse(String(txt||"").trim());}catch(e){}
  if(!o||!o.core&&!o.mine)return false;
  if(o.core)LS.set("cn_core",o.core);
  if(o.mine)LS.set("cn_mine",o.mine);
  if(o.materials)LS.set("cn_materials",o.materials);
  return true;
}
async function backupModal(){
  const blob=await backupCode();
  const mine=LS.get("cn_mine",null);
  const nDone=mine&&mine.done?Object.keys(mine.done).length:0;
  modal("Backup your progress",
    '<p class="note" style="margin:0 0 10px">'+
      (LS_OK?"":"<b>This device is not saving anything.</b> Copy the code below now \u2014 it is the only copy. ")+
      "Copy this code somewhere safe (a note on your phone, an email to yourself). "+
      "Paste it back in below on any device to restore "+nDone+" checked item"+(nDone===1?"":"s")+
      ", your XP, and your question history.</p>"+
    '<textarea id="bkOut" class="in" rows="4" readonly style="width:100%;font-family:ui-monospace,monospace;font-size:11px">'+esc(blob)+'</textarea>'+
    '<div style="display:flex;gap:8px;margin:8px 0 16px"><button class="btn sm primary" id="bkCopy">Copy code</button>'+
    '<span class="note" id="bkMsg"></span></div>'+
    '<h4 style="margin:0 0 6px;font-size:13px">Restore</h4>'+
    '<p class="note" style="margin:0 0 8px">Paste a code here to replace what is on this device.</p>'+
    '<textarea id="bkIn" class="in" rows="3" placeholder="Paste your backup code" style="width:100%;font-family:ui-monospace,monospace;font-size:11px"></textarea>',
    '<button class="btn" id="bkCancel">Close</button><button class="btn primary" id="bkGo">Restore</button>');
  $("#bkCopy").onclick=()=>{
    const t=$("#bkOut");t.select();
    let ok=false;try{ok=document.execCommand("copy");}catch(e){}
    if(!ok&&navigator.clipboard){try{navigator.clipboard.writeText(t.value);ok=true;}catch(e){}}
    $("#bkMsg").textContent=ok?"Copied.":"Select the text and copy it.";
  };
  $("#bkCancel").onclick=closeModal;
  $("#bkGo").onclick=async()=>{
    if(!await restoreCode($("#bkIn").value)){$("#bkMsg").textContent="That code did not read as a backup.";return;}
    closeModal();location.reload();
  };
}

const BETA_TEXT=[

function betaGate(next){
  let agreed=false;
  try{agreed=localStorage.getItem("cn_beta")==="1";}catch(e){}

  const host=document.createElement("div");
  host.className="betawrap";
  host.innerHTML='<div class="betacard">'+
    '<span class="eyebrow">Private beta</span>'+
    '<h2>Private Beta Agreement</h2>'+
    BETA_TEXT.map(t=>'<p>'+t+'</p>').join("")+
    '<label class="betachk"><input type="checkbox" id="betaBox"> I have read and agree to the Private Beta Agreement.</label>'+
    '<button class="btn primary" id="betaGo" disabled>Agree &amp; Continue</button>'+
    '</div>';
  document.body.appendChild(host);
  const box=host.querySelector("#betaBox"), go=host.querySelector("#betaGo");
  box.onchange=()=>{go.disabled=!box.checked;};
  go.onclick=()=>{
    try{localStorage.setItem("cn_beta","1");}catch(e){}
    host.remove();
    next();
  };
}
