    Written from the owner's own notes on the vision and chronic-illness lectures,
    checked against the decks where the decks say it. Where a question comes
    from what the instructor said in class rather than from a slide, the
    rationale says so, so nothing here pretends to be printed material. */
 {c:"NUR 308T",qid:"308-w1-59",level:1,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "knowledge", "knowledge", "knowledge"],
  stem:"On a Snellen chart, what does the bottom number of the result mean?",
  options:["The distance at which a normal eye can read that line","The distance the patient stood from the chart","The number of letters the patient read correctly","The percentage of vision the patient has lost"],
  answer:0,
  rationale:"The top number is the distance the patient stands from the chart, always 20 feet. The bottom number is the distance at which a normal eye could read that same line. So 20/200 means the patient reads at 20 feet what a normal eye reads at 200."},

 {c:"NUR 308T",qid:"308-w1-60",level:4,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "assessment-vs-action", "knowledge", "knowledge"],
  stem:"A nurse is examining the external structures of a patient's eyes. Which set of findings should be assessed?",
  options:["Symmetry, the eyelids, eyebrows and lashes, the sclera, and any discharge","Intraocular pressure and the angle of the anterior chamber","The field of vision and any blind areas","Colour vision and depth perception"],
  answer:0,
  rationale:"Examination of the external structures covers symmetry and the position of the eyes, the eyelids, eyebrows and lashes, the sclera, gaze, extraocular movements, and any evidence of irritation, inflammation or discharge. Pressure, angle and visual field are diagnostic tests, not part of the external exam."},

 {c:"NUR 308T",qid:"308-w1-61",level:3,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "knowledge", "knowledge", "knowledge"],
  stem:"A patient's sclera appear yellow. What does this finding most likely indicate?",
  options:["A systemic problem such as jaundice, not a problem of the eye","A normal age-related change in the older adult's sclera","Early cataract formation showing through the sclera","Increased intraocular pressure pushing on the sclera"],
  answer:0,
  rationale:"The sclera is assessed as part of the external eye exam. It should be white; a yellow sclera points to a systemic cause such as jaundice rather than to disease of the eye itself. Cataract clouds the lens, not the sclera, and raised pressure is not visible on inspection."},

 {c:"NUR 308T",qid:"308-w1-62",level:2,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "knowledge", "knowledge", "knowledge"],
  stem:"Ophthalmoscopy examines which structures?",
  options:["The cornea, lens and retina","The eyelids and lacrimal ducts","The angle of the anterior chamber","The extraocular muscles"],
  answer:0,
  rationale:"Ophthalmoscopy, direct and indirect, examines the cornea, lens and retina. Because it shows the retina and the optic disc, it can pick up changes that come from inside the skull rather than the eye \u2014 the instructor noted a brain tumour can be found this way. The anterior chamber angle is gonioscopy."},

 {c:"NUR 308T",qid:"308-w1-63",level:4,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "knowledge", "safety", "knowledge"],
  stem:"A patient is anxious about having tonometry. What should the nurse explain?",
  options:["It is a routine, painless test of eye pressure, usually the first one done","It requires numbing drops and causes brief sharp pain","It is reserved for patients who already have vision loss","It requires the pupils to be dilated for several hours afterward"],
  answer:0,
  rationale:"Tonometry measures intraocular pressure. The instructor described it as routine and not painful, and as the test done first \u2014 if the pressure is normal the workup for glaucoma can stop there. It is a screening test, not one held back for patients who are already losing vision."},

 {c:"NUR 308T",qid:"308-w1-64",level:2,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "knowledge", "knowledge", "stem-misread"],
  stem:"Gonioscopy is performed to determine which of the following?",
  options:["Whether the glaucoma is open-angle or closed-angle","Whether intraocular pressure is elevated","Whether the retina has detached","Whether the lens has become opaque"],
  answer:0,
  rationale:"Gonioscopy examines the angle of the anterior chamber, which is what distinguishes open-angle from closed-angle glaucoma. Pressure itself is tonometry; the two tests answer different questions and are often done together."},

 {c:"NUR 308T",qid:"308-w1-65",level:4,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "scope", "knowledge", "safety"],
  stem:"A nurse is placing a meal tray in front of a patient who is blind. Which action is correct?",
  options:["Describe where each item is using the face of a clock","Feed the patient to be sure nothing is spilled","Move everything to one side of the tray so it is easier to find","Ask a family member to stay for every meal"],
  answer:0,
  rationale:"Clock terms let the patient find the food themselves \u2014 potatoes at three o'clock, chicken at six. The whole point of caring for a patient with low vision or blindness is to encourage and support independence, so feeding a patient who can feed themselves is the wrong answer even though it sounds caring."},

 {c:"NUR 308T",qid:"308-w1-66",level:2,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "pharm-specific", "knowledge", "knowledge"],
  stem:"Why are topical drops and ointments the most frequently used route for eye medications?",
  options:["Least invasive, fewest side effects, and the patient can self-administer","They reach the highest concentration inside the eye of any route","They avoid the need for correct technique, so anyone can give them","They work faster than any other route, including injection"],
  answer:0,
  rationale:"The eye's ability to absorb medication is limited, so several routes exist \u2014 drops, ointments, intraocular injection, and systemic medication when a high concentration is needed. Topical is preferred because it is least invasive, has the fewest side effects and the patient can do it. Injection is what reaches the deeper structures."},

 {c:"NUR 308T",qid:"308-w1-67",level:4,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "knowledge", "safety", "knowledge"],
  stem:"A patient is prescribed two different eye drops. How long should the nurse wait between them?",
  options:["5 to 10 minutes","30 seconds","1 minute","No wait is needed if different eyes are used"],
  answer:0,
  rationale:"Multiple drop types need 5 to 10 minutes between administrations. Given back to back, the second drop washes out the first before it has been absorbed."},

 {c:"NUR 308T",qid:"308-w1-68",level:4,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "knowledge", "knowledge", "safety"],
  stem:"Which patient teaching helps prevent the spread of conjunctivitis?",
  options:["Throw out eye makeup, change pillowcases, keep the dropper off the eye","Keep the eye covered with a patch until the redness has fully cleared","Share the drops with anyone else in the house who has symptoms","Stop the drops as soon as the eye looks better, usually in two days"],
  answer:0,
  rationale:"Viral and bacterial conjunctivitis are contagious. The instructor tied it to makeup, to changing pillowcases, and to keeping the dropper tip off the eye and lashes so the bottle is not contaminated and does not reinfect. Sharing drops spreads it; stopping early is how bacterial infection returns."},

 {c:"NUR 308T",qid:"308-w1-69",level:2,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "pharm-specific", "pharm-specific", "pharm-specific"],
  stem:"A patient has viral conjunctivitis from herpes simplex. Which drug should the nurse expect?",
  options:["Acyclovir","Ciprofloxacin","Natamycin","Cromolyn sodium"],
  answer:0,
  rationale:"Acyclovir is the antiviral used for viral ocular infection, especially herpes simplex keratitis. Ciprofloxacin is antibacterial, natamycin is antifungal, and cromolyn sodium is for allergic conjunctivitis \u2014 conjunctivitis is classified by cause, and the cause picks the drug."},

 {c:"NUR 308T",qid:"308-w1-70",level:1,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "knowledge", "knowledge", "knowledge"],
  stem:"Uveitis is inflammation of which part of the eye?",
  options:["The uvea — the iris, ciliary body and choroid","The optic nerve and the disc where it enters","The conjunctiva and the inner surface of the lids","The eyelid margin and the lash follicles"],
  answer:0,
  rationale:"The uvea is the middle, pigmented layer of the eye: iris, ciliary body and choroid. Inflammation there is uveitis, and it typically causes eye pain, redness and light sensitivity. Inflammation of the optic nerve is optic neuritis, and of the conjunctiva is conjunctivitis."},

 {c:"NUR 308T",qid:"308-w1-71",level:3,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "knowledge", "knowledge", "knowledge"],
  stem:"A patient has a red, swollen, painful eye that is bulging forward, with fever and limited eye movement. Which condition should the nurse suspect?",
  options:["Orbital cellulitis","Allergic conjunctivitis","Dry eye syndrome","Open-angle glaucoma"],
  answer:0,
  rationale:"Orbital cellulitis is infection of the tissues within the orbit, behind the septum. Swelling in that closed space pushes the eye forward and limits its movement, and it comes with fever and pain. It is an emergency because the infection can reach the brain. Conjunctivitis and dry eye do not push the eye forward, and open-angle glaucoma is painless."},

 {c:"NUR 308T",qid:"308-w1-72",level:2,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "knowledge", "knowledge", "knowledge"],
  stem:"In diabetic retinopathy, which vessels are damaged first?",
  options:["The smallest vessels of the retina","The central retinal artery","The vessels of the optic nerve head","The vessels of the conjunctiva"],
  answer:0,
  rationale:"High blood sugar damages the blood vessels of the retina, and the tiniest ones go first \u2014 which is why the loss is gradual rather than sudden and why it can go unnoticed until it is advanced. Diabetes is a leading cause of blindness in people aged 20 to 74, and regular eye exams and blood sugar control are what prevent it."},

 {c:"NUR 308T",qid:"308-w1-73",level:5,gate:"308T-3e94175f66",unit:"Content 3 \u2014 Vision",errs:[null, "prioritization", "prioritization", "prioritization"],
  stem:"Four patients call the eye clinic. Which one should the nurse see first?",
  options:["A patient with a painful red eye","A patient with gradually blurring vision over several months","A patient whose reading glasses no longer seem strong enough","A patient with mild itching and watery eyes in the spring"],
  answer:0,
  rationale:"Pain in the eye is never a good sign \u2014 the instructor said so more than once. Acute angle-closure glaucoma, orbital cellulitis, uveitis and a corneal injury all hurt, and all of them can take the eye. Gradual blurring, a changing prescription and seasonal itching are real but none of them is an emergency."},

 {c:"NUR 308T",qid:"308-w1-74",level:2,gate:"308T-3e94175f66",unit:"Content 1 \u2014 Gerontology & chronic illness",errs:[null, "knowledge", "knowledge", "knowledge"],
  stem:"Which statement best describes the course of a chronic illness?",
  options:["It is unpredictable, with flare-ups and periods of remission","It declines at a steady, predictable rate","It stays stable once the diagnosis is made","It resolves within a year with the right treatment"],
  answer:0,
  rationale:"The course is volatile and non-linear, with acute flare-ups and remissions, and the patient has to keep adapting to circumstances that keep changing. Not knowing what next month looks like is a large part of what makes chronic illness hard to live with."},

 {c:"NUR 308T",qid:"308-w1-75",level:4,gate:"308T-3e94175f66",unit:"Content 1 \u2014 Gerontology & chronic illness",errs:[null, "scope", "assessment-vs-action", "knowledge"],
  stem:"An older adult with arthritis takes a long time to button a shirt but manages it. What should the nurse do?",
  options:["Allow the time and let the patient do it","Button the shirt to save the patient the effort","Ask an aide to dress the patient each morning","Suggest the family buy only pullover shirts"],
  answer:0,
  rationale:"Never do for a patient what the patient can do for themselves. Assessment of the activities of daily living is the foundation of any rehabilitation program, and every task taken away is function lost. Adaptive clothing may help later, but it is not the first response to someone who is managing."},,

 {c:"NUR 308T",qid:"308-w1-76",level:2,gate:"308T-3e94175f66",errs:[null,"knowledge","safety","safety"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"An older adult reports hearing loss. Why does the nurse have to decide whether it is age-related or something else?",
  options:["Because the line blurs, and only pathology gets worked up","Because age-related findings are never documented in the chart","Because a finding in an older adult is age-related by default","Because pathology is ruled out once a patient is past 65"],
  answer:0,
  rationale:"Some decline is normal and expected, but the lines become blurry. The nurse has to ask whether this is normal age-related hearing loss or something else going on, whether this person is incontinent for an expected reason or a pathological one. Assuming a finding is just age is how a problem gets missed."},
 {c:"NUR 308T",qid:"308-w1-77",level:3,gate:"308T-3e94175f66",errs:[null,"knowledge","stem-misread","stem-misread"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"Cholesterol deposits build up and narrow a vessel. Before anything else goes wrong, what shows up first?",
  options:["Hypertension","Heart failure","A myocardial infarction","A stroke"],
  answer:0,
  rationale:"If something is stenotic, it is narrow. Plaque narrows the vessel, the heart has to work harder to push blood through it, and at the very beginning — before anything else goes crazy — that shows up as hypertension."},
 {c:"NUR 308T",qid:"308-w1-78",level:3,gate:"308T-3e94175f66",errs:[null,"safety","knowledge","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"What keeps the aging heart muscle from detraining?",
  options:["Actively working it — exercise, including weight lifting","Rest, so it is not overworked","Cutting sodium alone","Nothing; the loss is fixed and cannot be slowed"],
  answer:0,
  rationale:"The heart is a muscle, and every muscle detrains unless the person is actively working to keep it from detraining. Weight lifting is a way to build and, more realistically in an older adult, to maintain muscle — it is harder to build at that age than to maintain what is already there."},
 {c:"NUR 308T",qid:"308-w1-79",level:4,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","stem-misread"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"An 82-year-old has an occasional irregular beat. There are no symptoms and it causes no problem. How is this classified?",
  options:["Normal aging — it becomes pathology when the change causes a problem","Pathology, because any irregular rhythm is abnormal at any age","Pathology, because of the patient's age and the risk of a stroke","Normal, and it stays normal no matter what develops from it"],
  answer:0,
  rationale:"An older person might have a slightly irregular beat here and there and it is not causing a problem. When the change causes a problem, it is no longer age-related — it is a problem. That is the line."},
 {c:"NUR 308T",qid:"308-w1-80",level:2,gate:"308T-3e94175f66",errs:[null,"knowledge","stem-misread","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"Which system's effectiveness declines even faster with age than the heart's?",
  options:["Respiratory","Renal","Cardiac, which falls off faster than any other system","Integumentary"],
  answer:0,
  rationale:"The effectiveness of the lungs diminishes even faster than the heart, and secretions build up more easily."},
 {c:"NUR 308T",qid:"308-w1-81",level:4,gate:"308T-3e94175f66",errs:[null,"prioritization","prioritization","assessment-vs-action"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"An older patient has been in bed all morning. What is the priority nursing action, and why?",
  options:["Get them up and sitting, because secretions build up when they stay down","Leave them to rest, because rest conserves energy","Raise the head of the bed only after the next set of vitals","Suction them, because secretions are expected"],
  answer:0,
  rationale:"Aging lungs clear less well and secretions build up. Getting older patients up — out of bed and into the chair, sat up in the morning — is why we do it, and it is done before there is anything to suction."},
 {c:"NUR 308T",qid:"308-w1-82",level:4,gate:"308T-3e94175f66",errs:[null,"assessment-vs-action","knowledge","safety"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"An older adult with COPD is admitted. What does the nurse have to account for?",
  options:["A double burden — the aging plus the chronic disease on top of it","The COPD only, since it explains everything about the presentation","The aging only, since the COPD is managed at home by the patient","Neither, if the oxygen saturation is above 90% on room air"],
  answer:0,
  rationale:"They have their age working against them, and now they have chronic disease on top of it. That is a double burden, and both halves have to be in the plan."},
 {c:"NUR 308T",qid:"308-w1-83",level:2,gate:"308T-3e94175f66",errs:[null,"knowledge","stem-misread","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"An older adult says food sits in the stomach and the mouth is always dry. Which normal changes explain both?",
  options:["Reduced motility and decreased salivation","Increased motility and increased salivation","Reduced motility with increased salivation","No change until disease develops"],
  answer:0,
  rationale:"Everything slows down. All the organ systems slow, the GI included: reduced motility and decreased salivation. They dry out as they get older, and the mouth is dry."},
 {c:"NUR 308T",qid:"308-w1-84",level:2,gate:"308T-3e94175f66",errs:[null,"stem-misread","knowledge","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"How do older adults tend to present in terms of body fluids?",
  options:["On the dry side rather than sweaty","Sweaty, from an overactive response","Unchanged from a younger adult","Fluid overloaded as a rule"],
  answer:0,
  rationale:"Think about all the fluids in a person's body. Older adults do not tend to be sweaty — they tend to be on the dryer side."},
 {c:"NUR 308T",qid:"308-w1-85",level:3,gate:"308T-3e94175f66",errs:[null,"stem-misread","stem-misread","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"An older adult says they are just not hungry any more. What explains this?",
  options:["Appetite decreases with age, and declining taste and smell add to it","Hunger is unchanged with age, so this indicates depression","It always signals a GI malignancy","It is caused by reduced salivation alone"],
  answer:0,
  rationale:"As people get older they do not feel as hungry. Taste and smell both decrease, food is not as vibrant, and that adds to the fact that they are not eating. They may cut down to a meal or two, and that can be all right."},
 {c:"NUR 308T",qid:"308-w1-86",level:3,gate:"308T-3e94175f66",errs:[null,"knowledge","stem-misread","safety"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"An older adult has cut down to one meal a day and drinks little. What follows from that?",
  options:["Less goes in, so less comes out, and the GI tract slows further","Output stays the same because the kidneys compensate","Motility increases to make up for the lower intake","Nothing changes as long as weight is stable"],
  answer:0,
  rationale:"When you decrease what is going in, what is coming out decreases too. Eating less and a GI tract that is already slowing feed each other."},
 {c:"NUR 308T",qid:"308-w1-87",level:3,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"Why are urinary tract infections so common in older women?",
  options:["They drink less, everything slows, and the anatomy raises the risk","Women have larger bladders that hold urine longer between voids","Estrogen rises after menopause and thins the lining of the bladder","Women are catheterized more often as outpatients than men are"],
  answer:0,
  rationale:"They are not drinking as much, everything slows down, and women in particular have a higher incidence than men because of the anatomy. In men the parallel age-related problem is BPH — benign prostatic hypertrophy."},
 {c:"NUR 308T",qid:"308-w1-88",level:2,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"A woman is noticeably shorter than she was at 50. What accounts for this?",
  options:["Bone loss after menopause, with changes in the spine","Shortening of the long bones of the legs with age","Loss of muscle mass in the legs and the lower back","Compression of the spine from weight gained after 50"],
  answer:0,
  rationale:"After menopause women lose the protection they had and lose calcium from the bone, so somebody who is older gets smaller. There are changes in the spine as well — kyphosis is the curve to expect. Men can lose bone too, it is just far more common in women."},
 {c:"NUR 308T",qid:"308-w1-89",level:4,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","safety"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"An older adult with bone loss falls. Which injury should the nurse anticipate?",
  options:["A wrist fracture from putting the hand out to break the fall","A skull fracture","A rib fracture from the impact of landing on the back","No fracture, because bone loss is not itself an injury risk"],
  answer:0,
  rationale:"Bone loss is what makes a fall matter. The wrist goes when they put a hand out to break the fall — these clients are more prone to fracture from what would be a minor fall in someone younger."},
 {c:"NUR 308T",qid:"308-w1-90",level:4,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","safety"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"The nurse is removing the dressing over an older patient's IV. What is the concern?",
  options:["The tape can pull the skin off, because aging skin is very thin","The tape will not adhere at all","The site cannot be assessed through thin skin","Thin skin bleeds less, so the site will look normal"],
  answer:0,
  rationale:"Skin gets thinner with age. Tape put on for an IV can take the skin right off — you have to be very careful with these patients. Aging skin also loses the adipose tissue underneath it, and the risk of skin cancer rises with the years of exposure."},
 {c:"NUR 308T",qid:"308-w1-91",level:5,gate:"308T-3e94175f66",errs:[null,"safety","stem-misread","safety"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"An older adult has an infection. The temperature is 99.1°F and the skin is dry. How should the nurse interpret this?",
  options:["An older adult may not mount a fever or sweat — this does not rule it out","The infection has resolved, since there is no fever and the skin is dry","Dry skin means dehydration rather than infection in an older adult","A temperature under 100.4°F excludes a serious infection at any age"],
  answer:0,
  rationale:"Older adults do not have the sweat response younger people do, and they are probably not going to develop a high fever. Somebody who is older and unwell may not present the way you expect — a low-grade temperature in an older adult can still be a serious infection."},
 {c:"NUR 308T",qid:"308-w1-92",level:5,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"Besides being able to recall later, what else separates normal age-related forgetfulness from a pathological problem?",
  options:["The person recognizes the lapse and makes a plan — writes it down","The person never forgets the same thing twice once reminded of it","The person has no change at all in processing speed or reaction time","The person forgets only names and faces, never objects or places"],
  answer:0,
  rationale:"Someone with normal age-related forgetfulness has the ability to recognize it — I am not going to remember this, let me write it down — and to formulate a plan. Someone with a pathological problem cannot recall it later and cannot make the plan, and eventually neglects the everyday things: hygiene, dressing, bathing."},
 {c:"NUR 308T",qid:"308-w1-94",level:3,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"A 68-year-old needs drugstore reading glasses for small print. How is this classified?",
  options:["A normal age-related change with no structural problem","An early cataract clouding the lens from the center out","Early macular degeneration affecting the central vision","Undiagnosed open-angle glaucoma taking the periphery"],
  answer:0,
  rationale:"The longer you use your eyes, the harder small print gets — that is normal, and drugstore readers handle it. There is no structural problem. Cataracts, macular degeneration and glaucoma are a different matter; those are pathology, not aging."},
 {c:"NUR 308T",qid:"308-w1-95",level:4,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"A patient says, \"I feel so sad. I can't do this any more.\" Which response uses therapeutic communication?",
  options:["\"I hear you say you can't do this any more. Tell me what that is like.\"","\"You'll feel better once you are home with your family around you.\"","\"Have you thought about how much worse it could be for someone else?\"","\"Let's talk about something more cheerful and come back to this later.\""],
  answer:0,
  rationale:"Restate back to them what they just said to you, and keep the question open. That is what opens the door — it might turn out to be the finances, or needing help in the house that they do not know how to ask for. A yes-or-no question closes it."},
 {c:"NUR 308T",qid:"308-w1-96",level:5,gate:"308T-3e94175f66",errs:[null,"safety","knowledge","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"Which goal is realistic for a patient with advanced COPD?",
  options:["Maintaining the oxygen saturation at the patient's own baseline","An oxygen saturation of 100% on room air","Complete resolution of the airway disease","No further exacerbations for the rest of the patient's life"],
  answer:0,
  rationale:"Somebody with COPD, who is already compromised in the respiratory system, is probably never going to have a saturation of 100%. Telling them to put the oxygen on until they hit 100% is not realistic. Be realistic — get them back to their own level of wellness."},
 {c:"NUR 308T",qid:"308-w1-97",level:3,gate:"308T-3e94175f66",errs:[null,"stem-misread","stem-misread","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"A patient has had bronchitis two years in a row. What does that time frame establish?",
  options:["It meets the definition of chronic bronchitis","It rules out a chronic problem","It confirms an acute infection only","It has no bearing on the diagnosis"],
  answer:0,
  rationale:"To be diagnosed with a chronic disease there is usually a time frame attached, and it varies by condition. Bronchitis two years in a row is chronic bronchitis. The time frame is how the classification is made."},
 {c:"NUR 308T",qid:"308-w1-98",level:4,gate:"308T-3e94175f66",errs:[null,"assessment-vs-action","knowledge","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"You have no access to the chart and the patient is not talkative. What single question opens up their whole medical history without being invasive?",
  options:["\"Do you have a list of your medications?\"","\"What brought you in today?\"","\"How many surgeries have you had?\"","\"Are you compliant with your treatment?\""],
  answer:0,
  rationale:"Asking what is going on right now tells you about right now. Asking for the medication list gives you the broad picture — every problem they are being treated for is on it. Then look at the meds, and look up the ones you do not know."},
 {c:"NUR 308T",qid:"308-w1-99",level:4,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","scope"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"Which of these are reasons a patient stops taking a medication?",
  options:["They feel better; the cost; they do not like how it makes them feel","They ran out of refills and the pharmacy could not reach the provider","They misunderstood the route and could not take it the way it was written","They were told to stop by another nurse during a previous admission"],
  answer:0,
  rationale:"They feel better, so they stop — and teaching that feeling better means the drug is working, not that it can stop, is one of the most important things you will teach. Money is always an issue. And they may not like the way the drug makes them feel — a statin causing muscle cramps, for example."},
 {c:"NUR 308T",qid:"308-w1-100",level:5,gate:"308T-3e94175f66",errs:[null,"safety","safety","safety"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"A patient on long-term corticosteroids says the drug makes them feel awful and they are going to stop taking it. What is the priority teaching?",
  options:["Do not stop — steroids are tapered, or adrenal insufficiency follows. Call.","Stopping is reasonable if the side effects have become intolerable","Cut the dose in half for a week and see whether the side effects settle","Stop it now and restart it if the original symptoms come back"],
  answer:0,
  rationale:"Some medications cannot simply be stopped. Steroids have to be tapered, and stopping abruptly can lead to adrenal insufficiency. The teaching for every drug is the same shape: if you are having side effects, call — do not stop. There are other drugs out there, and the provider can find one."},
 {c:"NUR 308T",qid:"308-w1-101",level:4,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"A patient has hyperlipidemia. What chain does the lecture describe if nothing changes?",
  options:["Cholesterol builds plaque, plaque narrows the vessels, hypertension follows","High cholesterol drops the blood pressure as the vessels lose their tone","High cholesterol resolves on its own with age as the appetite falls","High cholesterol affects only the coronary vessels, never the rest"],
  answer:0,
  rationale:"If you have hyperlipidemia, you build up plaque, and you have hypertension — or if you do not yet, you will, unless something changes. The same pattern runs through obesity to type 2 diabetes, and from there to hypertension and hyperlipidemia. If it is not there already, it is coming."},
 {c:"NUR 308T",qid:"308-w1-102",level:4,gate:"308T-3e94175f66",errs:[null,"knowledge","scope","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"An older patient reports a new symptom and the provider moves on without addressing it. What is this an example of?",
  options:["Ageism — dismissing an older person's complaint","Appropriate triage of a low-acuity complaint","A scope-of-practice issue for the nurse to report","Therapeutic silence used to let the patient reflect"],
  answer:0,
  rationale:"Ageism is discrimination based on age, and it happens in healthcare. Older people come in, they complain about something, and they get dismissed a little — not taken seriously. It shows up in the hiring line too, and it is something to watch for in yourself as well as in others."},
 {c:"NUR 308T",qid:"308-w1-103",level:3,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"A retired patient is on a fixed income from Social Security. Under which category does this belong?",
  options:["A social determinant of health","A comorbidity","A modifiable risk factor","An activity of daily living"],
  answer:0,
  rationale:"Social Security is based on what a person earned, so a client who did not earn much has less now. Money falls under the social determinants of health, and it shapes whether they can get the food, get to the store, and afford the medications."},
 {c:"NUR 308T",qid:"308-w1-104",level:4,gate:"308T-3e94175f66",errs:[null,"scope","knowledge","assessment-vs-action"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"An older adult has been in the hospital for two weeks and is now medically stable. Why refer to rehabilitation?",
  options:["To get the muscles back so the patient can go home and be safe","To keep the bed occupied until a long-term placement is arranged","Because every patient over 65 is referred at discharge, regardless","To avoid the discharge assessment that would otherwise be required"],
  answer:0,
  rationale:"Somebody who has been in a bed for any amount of time has lost muscle. Rehabilitation is meant to get them back up and get those muscles back to where they were, so they can go home and be safe. The nurse is the one who flags it to the social worker or case management."},
 {c:"NUR 308T",qid:"308-w1-105",level:5,gate:"308T-3e94175f66",errs:[null,"prioritization","knowledge","prioritization"],unit:"Content 1 — Gerontology & chronic illness",
  stem:"When does discharge planning start, and what question opens it?",
  options:["On admission — \"What is your life like when you go home?\"","On the day of discharge — \"Do you have a ride?\"","After the first exacerbation — \"How much money do you have?\"","When the provider writes the order — \"Do you understand your medications?\""],
  answer:0,
  rationale:"Discharge starts on admission. You do not have to ask how much money they have. Ask what their life is like when they go home, and they will tell you — I live alone, I have three flights of stairs, there is no supermarket near me. That is where the plan comes from."},
 {c:"NUR 308T",qid:"308-w1-106",level:3,gate:"308T-3e94175f66",errs:[null,"knowledge","assessment-vs-action","knowledge"],unit:"Content 3 — Vision",
  stem:"You walk into the room for the first time. What is the organizing principle for a quick look at the eyes?",
  options:["Everything on one side should look the same as the other side","Only the pupils matter on a first pass","The eyes are assessed only when the patient reports a problem","Nothing can be assessed without a Snellen chart"],
  answer:0,
  rationale:"Sixty seconds of situational awareness. Everything on one side should be the same as on the other. A drooping lid, an asymmetric pupil — you should see it and recognize it. Look at the lids, lashes and brows, whether the eyes follow you while you talk, whether the sclera is white or red or yellow, and whether there is any drainage."},
 {c:"NUR 308T",qid:"308-w1-107",level:2,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 3 — Vision",
  stem:"What is injected for a fluorescein angiography?",
  options:["A non-radioactive dye that travels through the eye's vessels","A radioactive tracer that concentrates in the retina","An antibiotic that treats infection behind the lens","A local anesthetic that numbs the surface of the eye"],
  answer:0,
  rationale:"Fluorescein angiography is the injection of a non-radioactive dye that travels through the blood into the vessels of the eye, where it illuminates them and gives a better picture. It is done when something is suspected, not routinely."},
 {c:"NUR 308T",qid:"308-w1-108",level:4,gate:"308T-3e94175f66",errs:[null,"safety","stem-misread","stem-misread"],unit:"Content 3 — Vision",
  stem:"A patient's tonometry reading is elevated. What comes next, and why?",
  options:["Gonioscopy, to tell an open angle from a closed one","Repeat the tonometry in a year","A slit lamp examination, to look for cataract","Perimetry, to measure the pressure again"],
  answer:0,
  rationale:"Tonometry is done first and it is routine — the puff of air, painless. If the pressure is normal it ends there. If it is elevated or abnormal, gonioscopy follows, because we need to know whether the angle is open or closed. Perimetry is a different test: it maps the visual field."},
 {c:"NUR 308T",qid:"308-w1-110",level:4,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 3 — Vision",
  stem:"How should the nurse describe the position of items on the meal tray to a patient with severe visual impairment?",
  options:["By the face of a clock — drink at 12 o'clock, utensils at 3 o'clock","By naming the foods in the order they were plated","As left, middle and right","By describing what is closest to the edge of the tray"],
  answer:0,
  rationale:"Use the clock system: everybody knows a clock, so the drink is at 12 o'clock and the utensils are at 3 o'clock. You help, and you stay there if they need you — but you do not do it for them. Teaching the clock is what lets them do it themselves."},
 {c:"NUR 308T",qid:"308-w1-112",level:5,gate:"308T-3e94175f66",errs:[null,"safety","knowledge","knowledge"],unit:"Content 3 — Vision",
  stem:"A patient already taking a beta blocker for hypertension is started on timolol eye drops. What is the concern?",
  options:["Timolol is absorbed systemically and can lower the heart rate further","Eye drops have no systemic effect, so there is no concern at all","The oral beta blocker will block the drop from working in the eye","The drops must be given at the same moment as the oral dose"],
  answer:0,
  rationale:"Timolol maleate is the prototype beta blocker drop, and it has systemic effects — it can lower the heart rate in a sensitive person. Think about a patient already being treated by a cardiologist with a beta blocker who now develops glaucoma. They do not need to be on two. There are other drug classes, and this is a conversation the prescribers need to have with each other."},
 {c:"NUR 308T",qid:"308-w1-114",level:4,gate:"308T-3e94175f66",errs:[null,"stem-misread","knowledge","knowledge"],unit:"Content 3 — Vision",
  stem:"Why is a cycloplegic given before an intravitreal injection?",
  options:["It paralyzes the eye so the awake patient cannot move it under the needle","It dilates the pupil so the retina can be seen during the injection","It numbs the conjunctiva so the needle is not felt going in","It lowers the intraocular pressure so the injection does not raise it"],
  answer:0,
  rationale:"A mydriatic dilates the eye. A cycloplegic paralyzes it. The patient has to be awake for the injection — nobody is putting them to sleep for it — so the eye is paralyzed, the reaction is taken away, and the medication can be given safely."},
 {c:"NUR 308T",qid:"308-w1-115",level:3,gate:"308T-3e94175f66",errs:[null,"stem-misread","knowledge","knowledge"],unit:"Content 3 — Vision",
  stem:"Glaucoma medications work in which two ways?",
  options:["They decrease aqueous production or increase its outflow","They increase aqueous production or decrease its outflow","They dissolve the clouded lens or reshape the cornea","They constrict the retinal vessels or dilate them"],
  answer:0,
  rationale:"Glaucoma is a group of conditions with raised intraocular pressure, and the pressure comes either from making too much fluid or from the fluid not being able to get where it needs to go. So the drugs either decrease production or increase outflow. Either way the aim is to bring the pressure down."},
 {c:"NUR 308T",qid:"308-w1-116",level:5,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 3 — Vision",
  stem:"Which of these raises the risk of glaucoma?",
  options:["Long-term corticosteroids, and menopause before 43","A diet high in vitamin A and leafy greens","Wearing contact lenses for more than ten years","Reading in low light through the teenage years"],
  answer:0,
  rationale:"Risk factors include genetics, older age, certain ethnicities, medical conditions such as diabetes and high blood pressure, an eye injury, menopause before the age of 43, and long-term corticosteroid use. Think about who is on steroids long term — that is a real population, not a hypothetical one."},
 {c:"NUR 308T",qid:"308-w1-117",level:5,gate:"308T-3e94175f66",errs:[null,"safety","safety","safety"],unit:"Content 3 — Vision",
  stem:"How urgently does acute angle-closure glaucoma need to be seen?",
  options:["Immediately — it needs an opening made, or the vision is lost","At the next scheduled clinic visit, once the drops are started","Within a week, once a course of pressure-lowering drops has been tried","Only if the pain is not relieved by analgesia within the hour"],
  answer:0,
  rationale:"The iris blocks the drainage angle, the fluid has nowhere to go, and the pressure keeps building. This is somebody who needs to be seen yesterday. It usually requires an intervention that makes an opening and keeps it open to bring the pressure down. If the pressure is not resolved, they lose the vision. And eye pain is never normal."},
 {c:"NUR 308T",qid:"308-w1-118",level:4,gate:"308T-3e94175f66",errs:[null,"stem-misread","knowledge","knowledge"],unit:"Content 3 — Vision",
  stem:"What is characteristic of chronic angle-closure glaucoma?",
  options:["It develops over time and is asymptomatic until the damage is done","It presents suddenly with severe pain, halos and vomiting","It resolves without treatment once the angle opens on its own","It never requires medication once the angle has been opened"],
  answer:0,
  rationale:"Chronic angle closure is not the acute emergency. It happens over time and is asymptomatic until the damage is done. It usually requires going in and opening it up, and then medication — most of these patients are on drops for life to manage the pressure."},
 {c:"NUR 308T",qid:"308-w1-119",level:5,gate:"308T-3e94175f66",errs:[null,"safety","knowledge","knowledge"],unit:"Content 3 — Vision",
  stem:"A patient two days after cataract surgery asks whether it is all right to hold in a sneeze. What do you tell them?",
  options:["No — holding it raises the pressure. Sneeze with the mouth open.","Yes — holding it protects the eye from the force of the sneeze","It makes no difference either way once the incision has closed","Only hold it while lying down, when the pressure is already lower"],
  answer:0,
  rationale:"Holding a sneeze in increases the pressure in the head and the eye, and after any eye problem you never want to increase the pressure. Same reason for no bending or stooping, keeping activities light, and no lifting weights or straining — anything that raises the pressure is out."},
 {c:"NUR 308T",qid:"308-w1-120",level:4,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 3 — Vision",
  stem:"Why is an eye shield worn at night after cataract surgery?",
  options:["So the patient does not rub the eye in their sleep","To keep light out of the eye while the pupil is dilated","To hold the drops in the eye through the night","To keep the eyelid closed so the incision can heal"],
  answer:0,
  rationale:"They turn over in the night and rub at it without knowing. The shield is what stops them. Post-operatively they also report vision changes, flashing lights, redness, swelling or pain that increases — some swelling is expected, but it should not get worse."},
 {c:"NUR 308T",qid:"308-w1-122",level:4,gate:"308T-3e94175f66",errs:[null,"knowledge","safety","knowledge"],unit:"Content 3 — Vision",
  stem:"A patient on an anti-VEGF injection for wet macular degeneration is not responding to it. What happens next?",
  options:["They move to the next drug in the class","The injections are stopped and the disease is left to run","The dose is doubled","They switch to photodynamic therapy permanently"],
  answer:0,
  rationale:"There is a prototype and then there are the others. Sometimes people cannot tolerate a particular agent or it does not work for them, so they move to the next one. Injections are usually more frequent at the start and spaced out as the eye responds."},
 {c:"NUR 308T",qid:"308-w1-123",level:3,gate:"308T-3e94175f66",errs:[null,"knowledge","safety","safety"],unit:"Content 3 — Vision",
  stem:"Which teaching belongs in the discharge instructions for conjunctivitis?",
  options:["Change the pillowcase daily, wash hands, keep the dropper off the eye","Patch the eye until the redness clears, usually about ten days","Stop the drops once the eye looks better, usually about two days","Share the drops within the household so everyone is treated at once"],
  answer:0,
  rationale:"It is very contagious — one person has it, you come into contact with them, and you have it. Change the pillowcase every day, wash hands, do not touch the dropper to the eye, and do not share drops or towels. It commonly spreads to the other eye as well. Bacterial conjunctivitis is treated with an antibiotic such as ciprofloxacin; the eye improves in about two days but the course runs the full prescription."},
 {c:"NUR 308T",qid:"308-w1-124",level:4,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 3 — Vision",
  stem:"How does orbital cellulitis usually begin?",
  options:["An infection enters through a small break in the skin near the eye","Pressure builds behind the eye and pushes it forward in the socket","The lens becomes cloudy and inflamed and the swelling spreads out","The retina detaches and the fluid behind it becomes infected"],
  answer:0,
  rationale:"It is inflammation of the tissue around the eye, and it is usually related to an infection. It can be something as small as a nick in the skin that lets something in. It is serious, and it needs to be treated."},
 {c:"NUR 308T",qid:"308-w1-125",level:5,gate:"308T-3e94175f66",errs:[null,"knowledge","knowledge","safety"],unit:"Content 3 — Vision",
  stem:"A patient is newly diagnosed with type 2 diabetes. What should the nurse expect about the eyes?",
  options:["Retinal damage may already be underway, because the diabetes was present before it was diagnosed","The retina is protected until the diabetes has been present for ten years","Retinopathy occurs only in type 1 diabetes","No eye examination is needed until vision changes"],
  answer:0,
  rationale:"With type 2 it is entirely possible that they did not know they had it. There may already be damage happening before anyone did anything about it. High glucose damages the retinal vessels and the smallest vessels go first, which is why the yearly dilated exam matters — and why an eye doctor is sometimes the one who says, what is going on here, and starts the conversation."},
 {c:"NUR 308T",qid:"308-w1-126",level:5,gate:"308T-3e94175f66",errs:[null,"safety","assessment-vs-action","knowledge"],unit:"Content 3 — Vision",
  stem:"An object is embedded in a patient's eye and it has been shielded. What else does the nurse need to establish?",
  options:["What the object was and how fast it was travelling","Whether the patient has had an eye exam in the past year","Whether the patient wears corrective lenses","The patient's visual acuity in the uninjured eye"],
  answer:0,
  rationale:"It is important to know what the trauma was. She described a client who came in with what looked like a small hole in the eye — it turned out to have been a skate blade, and that person did not survive. What the object was and how fast it was travelling changes everything about what is underneath, and shielding the eye is only the first half of the job."},
 /* ---- terrain checks: structure questions, from the Vision and Hearing decks */
 {c:"NUR 308T",qid:"308-t-e01",level:1,gate:"308T-3e94175f66",struct:"eye",errs:["knowledge",null,"knowledge","stem-misread"],unit:"Content 3 — Vision",
  stem:"Which structure produces the aqueous humor?",
  options:["The trabecular meshwork","The ciliary body","The choroid","The lacrimal gland"],answer:1,
  rationale:"The ciliary body makes the aqueous humor and holds the lens on its zonules. The trabecular meshwork is where the fluid leaves, not where it is made; the lacrimal gland makes tears, on the outside of the eye."},
 {c:"NUR 308T",qid:"308-t-e02",level:1,gate:"308T-3e94175f66",struct:"eye",errs:["stem-misread","knowledge",null,"knowledge"],unit:"Content 3 — Vision",
  stem:"Where does the aqueous humor leave the eye?",
  options:["Through the pupil, into the vitreous behind it","Through the optic disc, alongside the retinal vessels","Through the trabecular meshwork in the drainage angle","Through the lacrimal duct at the inner corner of the lids"],answer:2,
  rationale:"The fluid passes from behind the iris, through the pupil, across the anterior chamber and out through the trabecular meshwork where the iris meets the cornea - the drainage angle. When that drain is impaired, pressure builds: glaucoma."},
 {c:"NUR 308T",qid:"308-t-e03",level:1,gate:"308T-3e94175f66",struct:"eye",errs:["knowledge","knowledge","knowledge",null],unit:"Content 3 — Vision",
  stem:"A cataract is an opacity of which structure?",
  options:["The cornea","The retina","The vitreous","The lens"],answer:3,
  rationale:"A cataract is a cloudy lens. The lens focuses light onto the retina, so when it clouds, vision blurs painlessly and glare gets worse. Surgery removes the lens."},
 {c:"NUR 308T",qid:"308-t-e04",level:2,gate:"308T-3e94175f66",struct:"eye",errs:[null,"knowledge","stem-misread","knowledge"],unit:"Content 3 — Vision",
  stem:"Which structure is damaged by the raised pressure of glaucoma?",
  options:["The optic nerve","The lens","The cornea","The ciliary body"],answer:0,
  rationale:"Glaucoma is damage to the optic nerve related to increased intraocular pressure. The nerve carries the picture to the brain, and the damage takes peripheral vision first, silently."},
 {c:"NUR 308T",qid:"308-t-e05",level:2,gate:"308T-3e94175f66",struct:"eye",errs:["knowledge",null,"knowledge","knowledge"],unit:"Content 3 — Vision",
  stem:"In acute angle-closure glaucoma, which structure blocks the drain?",
  options:["The lens, swelling forward","The iris, closing the drainage angle","The cornea, thickening over the angle","The vitreous, pressing from behind"],answer:1,
  rationale:"In angle closure the iris is pushed into the drainage angle and blocks it, so the aqueous cannot reach the trabecular meshwork and the pressure spikes. This is why dilating drops are contraindicated in narrow angles."},
 {c:"NUR 308T",qid:"308-t-e06",level:1,gate:"308T-3e94175f66",struct:"eye",errs:["knowledge","knowledge",null,"stem-misread"],unit:"Content 3 — Vision",
  stem:"Which structure provides sharp central vision?",
  options:["The optic disc","The peripheral retina","The macula","The pupil"],answer:2,
  rationale:"The macula, at the center of the retina, gives sharp central vision. Macular degeneration takes central vision and leaves the periphery; glaucoma does the reverse."},
 {c:"NUR 308T",qid:"308-t-e07",level:2,gate:"308T-3e94175f66",struct:"eye",errs:["knowledge",null,"knowledge","knowledge"],unit:"Content 3 — Vision",
  stem:"In wet macular degeneration, where do the abnormal vessels grow?",
  options:["In the cornea, over the pupil","Under the retina, at the macula","In the iris, near the angle","Along the optic nerve"],answer:1,
  rationale:"Wet macular degeneration is abnormal vessels growing under the retina at the macula. Anti-VEGF drugs injected into the vitreous slow that growth; photodynamic therapy seals the vessels."},
 {c:"NUR 308T",qid:"308-t-e08",level:2,gate:"308T-3e94175f66",struct:"eye",errs:["knowledge","knowledge","knowledge",null],unit:"Content 3 — Vision",
  stem:"Gonioscopy examines which part of the eye, and to answer what question?",
  options:["The retina, to look for drusen","The lens, to grade a cataract","The optic disc, to measure cupping","The drainage angle, to tell open from closed"],answer:3,
  rationale:"Gonioscopy looks at the anterior chamber angle - the drainage angle - to distinguish open-angle from angle-closure glaucoma. It is done after tonometry finds the pressure raised."},
 {c:"NUR 308T",qid:"308-t-a01",level:1,gate:"308T-3e94175f66",struct:"ear",errs:["knowledge",null,"knowledge","knowledge"],unit:"Content 2 — Hearing & balance",
  stem:"Sound reaches the inner ear by which route?",
  options:["Canal, eustachian tube, cochlea, nerve","Canal, eardrum, ossicles, cochlea, nerve","Canal, mastoid, vestibule, nerve","Canal, eardrum, semicircular canals, nerve"],answer:1,
  rationale:"Sound goes down the canal, onto the tympanic membrane, across the three ossicles - malleus, incus, stapes - into the cochlea, and out along the vestibulocochlear nerve. The eustachian tube and mastoid are off that path; the semicircular canals are balance."},
 {c:"NUR 308T",qid:"308-t-a02",level:1,gate:"308T-3e94175f66",struct:"ear",errs:["knowledge","knowledge",null,"stem-misread"],unit:"Content 2 — Hearing & balance",
  stem:"Acute otitis media is an infection of which space?",
  options:["The external canal","The inner ear","The middle ear","The mastoid only"],answer:2,
  rationale:"Otitis media is infection of the middle ear, the air space behind the eardrum - otalgia, fever, hearing loss, most often in children. External otitis is the canal; repeated middle-ear infection can reach the mastoid."},
 {c:"NUR 308T",qid:"308-t-a03",level:2,gate:"308T-3e94175f66",struct:"ear",errs:[null,"knowledge","knowledge","knowledge"],unit:"Content 2 — Hearing & balance",
  stem:"A myringotomy is a cut made in which structure?",
  options:["The tympanic membrane","The eustachian tube","The cochlea","The external canal"],answer:0,
  rationale:"A myringotomy is an incision in the tympanic membrane to drain the fluid trapped in the middle ear behind it."},
 {c:"NUR 308T",qid:"308-t-a04",level:2,gate:"308T-3e94175f66",struct:"ear",errs:["knowledge",null,"knowledge","stem-misread"],unit:"Content 2 — Hearing & balance",
  stem:"Which structure is the site of the problem in Ménière’s disease?",
  options:["The tympanic membrane and the space behind it","The endolymphatic sac and duct","The ossicles and the oval window","The external canal and the pinna"],answer:1,
  rationale:"Ménière’s disease is abnormal inner-ear fluid balance: malabsorption in the endolymphatic sac or a blocked endolymphatic duct. That is why the surgery for it is decompression of that sac."},
 {c:"NUR 308T",qid:"308-t-a05",level:2,gate:"308T-3e94175f66",struct:"ear",errs:["knowledge","knowledge","knowledge",null],unit:"Content 2 — Hearing & balance",
  stem:"Sound is blocked by wax in the canal. What kind of hearing loss is this, and why?",
  options:["Sensorineural, because the cochlea is not reached","Mixed, because the canal and the nerve are both involved","Functional, because nothing is structurally wrong","Conductive, because the block is before the cochlea"],answer:3,
  rationale:"Conductive loss is a problem of the external or middle ear - anything stopping sound before it reaches the cochlea: wax, fluid, a stiff drum. Sensorineural loss is damage to the cochlea or the nerve."},
 {c:"NUR 308T",qid:"308-t-a06",level:2,gate:"308T-3e94175f66",struct:"ear",errs:["knowledge",null,"knowledge","knowledge"],unit:"Content 2 — Hearing & balance",
  stem:"A cochlear implant replaces the work of which structure?",
  options:["The ossicles","The cochlea","The eustachian tube","The tympanic membrane"],answer:1,
  rationale:"A cochlear implant is for profound bilateral sensorineural loss that hearing aids cannot help - it does the cochlea’s job of turning sound into nerve signal."},
 {c:"NUR 308T",qid:"308-t-a07",level:1,gate:"308T-3e94175f66",struct:"ear",errs:["knowledge","knowledge",null,"knowledge"],unit:"Content 2 — Hearing & balance",
  stem:"Vertigo points to trouble in which part of the ear?",
  options:["The external canal","The middle ear","The inner ear","The mastoid"],answer:2,
  rationale:"Vertigo, the illusion of motion, comes from the vestibular part of the inner ear - the semicircular canals and the fluid around them. Ménière’s disease is the inner-ear problem with episodic incapacitating vertigo."},
 {c:"NUR 308T",qid:"308-t-a08",level:2,gate:"308T-3e94175f66",struct:"ear",errs:["stem-misread","knowledge",null,"knowledge"],unit:"Content 2 — Hearing & balance",
  stem:"Which structure drains and equalizes the middle ear?",
  options:["The external canal","The endolymphatic duct","The eustachian tube","The cochlear duct"],answer:2,
  rationale:"The eustachian tube connects the middle ear to the throat and equalizes it. When it does not drain, fluid sits behind the eardrum. It is why patients blow the nose one side at a time after ear surgery."}

function collectMine(){
  MINE.done={};MINE.qstats={};
  /* `e.xp?...` dropped a zero, so a bulk-cleared item came back worth ten and
     unticking it charged ten it had never been paid */
  S.events.forEach(e=>{if(e.done)MINE.done[evKey(e)]=(e.doneOn||e.date)+(e.xp==null?"":("|"+e.xp));});
  S.questions.forEach(q=>{if(q.seen||q.wrong)MINE.qstats[q.id]=
    {s:q.seen||0,w:q.wrong||0,l:q.lastSeen||null,b:q.box||0,d:q.due||null};});
  return {at:Date.now(),profile:S.profile,logins:S.logins,done:MINE.done,qstats:MINE.qstats,
          misses:MINE.misses,flags:MINE.flags};
}
function applyMine(m){
  if(!m)return;
  if(m.profile)S.profile=freshProfile(m.profile);
  if(m.logins)S.logins=m.logins;
  MINE.done=m.done||{};MINE.qstats=m.qstats||{};MINE.misses=Array.isArray(m.misses)?m.misses:[];
  MINE.flags=m.flags||{};
  S.events.forEach(e=>{const v=MINE.done[evKey(e)];
    if(v){const p=String(v).split("|");e.done=true;e.doneOn=p[0];
      e.xp=(p[1]===undefined||p[1]==="")?10:(+p[1]||0);}
    else{e.done=false;delete e.doneOn;delete e.xp;}});
  S.questions.forEach(q=>{const v=MINE.qstats[q.id];
    if(v){q.seen=v.s;q.wrong=v.w;q.lastSeen=v.l;q.box=v.b||0;q.due=v.d||null;}});
}

/* ---------------------------------------------------------------------------
   WHOSE PROGRESS IS RIGHT

   Ticking a box writes to this device instantly and pushes to the account in
   the background. Close the tab before that push lands - or lose signal - and
   the account still holds the older copy. loadAll used to prefer the account's
   copy outright, so the next visit pulled the stale one down over the good
   one and everything you had just checked off came back unchecked.

   Both copies are stamped now, and the newer one wins. A copy with no stamp is
   from before this existed, so it loses to anything stamped. */
function newerMine(a,b){
  if(!a)return b||null;
  if(!b)return a;
  const ta=+a.at||0, tb=+b.at||0;
  return ta>=tb?a:b;
}

async function loadAll(){

  if(core){S.profile=freshProfile(core.profile);S.courses=core.courses||[];S.events=core.events||[];S.logins=core.logins||{};S.deleted=core.deleted||{};}
  S.materials=Object.values(LS.get("cn_materials",{}));
  S.questions=Object.values(LS.get("cn_questions",{}));
  applyMine(LS.get("cn_mine",null));
  if(!DB)return;
  try{
    const d=await DB.doc("shared/core").get();
    if(d&&d.exists){
      const c=snapData(d)||{};
      if(c.courses&&c.courses.length){S.courses=c.courses;S.events=c.events||[];S.deleted=c.deleted||{};}
    }
    const ms=await DB.collection("materials").get();
    if(ms&&ms.docs&&ms.docs.length){const o={};S.materials=ms.docs.map(x=>{const v=snapData(x)||{};v.id=x.id;o[x.id]=v;return v;});LS.set("cn_materials",o);}
    const qs=await DB.collection("questions").get();
    if(qs&&qs.docs&&qs.docs.length){const o={};S.questions=qs.docs.map(x=>{const v=snapData(x)||{};v.id=x.id;o[x.id]=v;return v;});LS.set("cn_questions",o);}
    let mine=null;
    if(sharedRW){try{const pd=await DB.doc("owner/progress").get();if(pd&&pd.exists)mine=snapData(pd);}catch(e){}}
    const local=LS.get("cn_mine",null);
    const use=newerMine(mine,local);
    applyMine(use);
    /* if this device held the newer copy, push it up so the account catches up */
    if(use&&use===local&&mine)saveMine();
    LS.set("cn_core",{profile:S.profile,courses:S.courses,events:S.events,logins:S.logins,deleted:S.deleted});
  }catch(e){}
}

  const kept=S.events.filter(e=>ids[e.courseId]&&e.custom);
  S.events=S.events.filter(e=>!ids[e.courseId]).concat(kept);   // wipe seeded rows, keep hand-edited ones
  S.deleted={};                                     // and every suppression
  S.profile._keepDone=keepDone;                     // re-apply the ticks after rebuild
  S.profile.resetSeed=RESET_SEED;
  return true;
}
function reapplyDone(){
  const k=S.profile._keepDone;if(!k)return false;
  let n=0;
  const norm=t=>String(t||"").replace(/^\d{3} /,"").replace(/^Dynamic /,"");
  S.events.forEach(e=>{const v=k[norm(e.title)+"|"+e.date];if(v&&!e.done){e.done=true;e.doneOn=v;n++;}});

/* The six 314 "before class" questions that shipped before the real Module 1
   lecture existed were written from general pharmacology, not from that deck,
   and were labelled as if they came off those slides. They are gone from the
   seed; this clears them from anyone who already has them. */
/* Retired on purpose. The 314 p1-* six were invented from general pharmacology
   before the real lecture arrived. The 308 four are statistics - the 308
   instructor said in class she does not test on statistics, so a question whose
   whole answer is "6 in 10" or "56%" is time spent on something that cannot be
   on the exam. */
const DEAD_QUESTIONS=["314-p1-01","314-p1-02","314-p1-03","314-p1-04","314-p1-05","314-p1-06",
  "308-w1-25","308-w1-43","308-w1-44","308-w1-48","308-w1-52"];
/* Everything answered before the schedule existed has no box and no due date,
   so without this every one of them would read as due the moment it shipped -
   a hundred-question pile on day one, which is the fastest way to make someone
   close the app. They are seeded into box 1 and spread over the next few days
   instead, so the queue arrives at a human size. */
const SR_SEED=1;
function seedSchedule(){
  const p=S.profile;
  if(p.srSeed>=SR_SEED)return false;
  p.srSeed=SR_SEED;
  let n=0;
  S.questions.forEach(q=>{
    if(!(q.seen>0)||q.due)return;
    if((q.wrong||0)>0){q.box=0;q.due=today();return;}
    q.box=1;q.due=dshift(today(),1+(n++%3));      // 1-3 days out, in the order met
  });
  if(n)saveQuestions(S.questions.filter(q=>q.due));
  return true;
}
function dropDeadQuestions(){
  const p=S.profile;
  /* NOT latched. seedQuestions() runs before this on every boot, so a latch
     would let a retired question reappear on the second launch and stay. */
  const first=!(p.deadQ>=3);p.deadQ=3;
  const all=LS.get("cn_questions",{});
  let hit=false;
  DEAD_QUESTIONS.forEach(id=>{
    if(all[id]){delete all[id];hit=true;}
    if(MINE.qstats&&MINE.qstats[id]){delete MINE.qstats[id];hit=true;}
  });
  const before=S.questions.length;
  S.questions=S.questions.filter(q=>DEAD_QUESTIONS.indexOf(q.id)<0);
  if(before!==S.questions.length)hit=true;
  if(hit){LS.set("cn_questions",all);
    if(DB&&sharedRW)DEAD_QUESTIONS.forEach(id=>{try{DB.doc("questions/"+id).delete();}catch(e){}});}
  return first||hit;
}
function seedQuestions(){
  if(!SEED_QUESTIONS.length||!S.courses.length)return false;
  const byCode={};S.courses.forEach(c=>{byCode[c.code]=c.id;});
  const have={};S.questions.forEach(q=>{have[q.id]=q;});
  const gone=S.deleted||{};
  let did=false,added=[];
  SEED_QUESTIONS.forEach(q=>{
    const cid=byCode[q.c];if(!cid||gone[q.qid])return;
    const cur=have[q.qid];
    if(cur){                                    // same question: refresh wording, keep their history
      /* Which exam a question counts toward and which unit it sits in are
         structure, not history. They follow the seed every boot - otherwise a
         question kept pointing at an exam whose id had since changed and the
         binder filed it under "Not yet tied to an exam". */
      const wantGate=q.prime?null:(q.gate||null);
      if(cur.gate!==wantGate||cur.unit!==q.unit){cur.gate=wantGate;cur.unit=q.unit;added.push(cur);did=true;}
      const wantTier=q.tier||tierFromLevel(q.level||q.tier||1);
      if(cur.stem!==q.stem||cur.rationale!==q.rationale||(q.errs&&!cur.errs)||cur.tier!==wantTier){
        cur.stem=q.stem;cur.options=q.options;cur.answer=q.answer;cur.rationale=q.rationale;cur.unit=q.unit;cur.tier=wantTier;cur.level=q.level||q.tier||1;cur.errs=q.errs||null;cur.prime=!!q.prime;cur.watch=q.watch||"";cur.struct=q.struct||"";cur.gate=q.prime?null:(q.gate||null);
        added.push(cur);did=true;

    }
    const st=(MINE.qstats||{})[q.qid]||{};
    const rec={id:q.qid,courseId:cid,materialId:q.mid||"seed",
      tier:q.tier||tierFromLevel(q.level||q.tier||1),level:q.level||q.tier||1,gate:q.prime?null:(q.gate||null),unit:q.unit,stem:q.stem,options:q.options,
      answer:q.answer,errs:q.errs||null,rationale:q.rationale,prime:!!q.prime,watch:q.watch||"",struct:q.struct||"",seen:st.s||0,wrong:st.w||0,lastSeen:st.l||null};
    S.questions.push(rec);added.push(rec);did=true;
  });
  if(did)saveQuestions(added);
  return did;
}
function seedCourses(){
  let did=false;
  if(!S.courses.length){
    S.courses=SEED_COURSES.map(c=>({id:uid(),code:c.code,name:c.name,color:c.color,study:c.study}));
    did=true;
  }
  if(!S.courses.length)return did;
  const byCode={};S.courses.forEach(c=>{byCode[c.code]=c.id;});
  const bySid={};S.events.forEach(e=>{if(e.sid)bySid[e.sid]=e;});
  const have={};S.events.forEach(e=>{have[evKey(e)]=true;});
  const gone=S.deleted||{};
  SEED_EVENTS.forEach(e=>{
    const cid=byCode[e.c];if(!cid)return;
    if(gone[e.sid]||gone[cid+"|"+e.t+"|"+e.d])return;         // they removed it on purpose
    const cur=bySid[e.sid];
    if(cur){
      if(cur.custom)return;                                    // theirs now — never overwritten
      if(cur.title!==e.t||cur.date!==e.d||cur.type!==e.y||cur.notes!==e.n||!!cur.fyi!==!!e.f){
        cur.title=e.t;cur.date=e.d;cur.type=e.y;cur.notes=e.n;cur.fyi=e.f?true:undefined;did=true;
      }
      return;
    }
    if(have[cid+"|"+e.t+"|"+e.d]){                             // pre-sid copy: adopt it
      const old=S.events.find(x=>evKey(x)===cid+"|"+e.t+"|"+e.d&&!x.sid);
      if(old){old.sid=e.sid;bySid[e.sid]=old;did=true;return;}
    }
    S.events.push({id:uid(),sid:e.sid,courseId:cid,title:e.t,type:e.y,date:e.d,notes:e.n,fyi:e.f?true:undefined,done:false});
    did=true;

}
/* XP is reconciled from the records that justify it, on every load.
   Two ledgers: p.xpEarned accumulates awards that leave no re-checkable trace
   (quiz sessions, milestones, trophies, daily goal, boss wins) and only ever
   grows; everything else is derived from what is actually ticked right now.
   So a wiped or re-seeded calendar can never leave XP banked behind it. */
const XP_FIX=2;
function earnXp(n){S.profile.xpEarned=(S.profile.xpEarned||0)+n;addXp(n);}
function dayCleared(d){
  const same=todoOf(S.events.filter(x=>x.date===d));
  return same.length>1&&same.every(x=>x.done);
}
function eventXp(){
  const p=S.profile,bon=p.dayBonus=p.dayBonus||{};
  let x=0,changed=false;
  S.events.forEach(e=>{if(e.done)x+=e.xp||10;});
  Object.keys(bon).forEach(d=>{if(!dayCleared(d)){delete bon[d];changed=true;}});
  return {xp:x+10*Object.keys(bon).length,changed:changed};
}
function repairXp(){
  const p=S.profile,ev=eventXp();
  if(!(p.xpFix>=XP_FIX)){
    // first run: rebuild the non-event ledger from the surviving records,
    // clamping down only — a generous quiz rate keeps a real total safe
    let proxy=0;
    TROPHIES.forEach(tr=>{if(p.trophies&&p.trophies[tr.id])proxy+=tr.xp||100;});
    const M={r1:100,r2:150,r3:250,pt:200,h:400,gate:1500,prime:PRIME_XP};
    Object.keys(p.awarded||{}).forEach(k=>{proxy+=M[k.split(":")[0]]||0;});
    proxy+=18*(p.correct||0)+3*Math.max(0,(p.answered||0)-(p.correct||0));
    /* The daily bonus is paid at the tier's multiplier, not flat, and a cleared
       week pays WEEK_XP on top - neither was represented here, so the proxy came
       in thousands of XP under a real total and the clamp deleted the
       difference on the next boot, with no toast and no way to get it back.
       Both are counted now, at the most generous rate, because this number is
       only ever used as a ceiling. */
    const mult=Math.max.apply(null,TIERS.map(t=>t.m));
    proxy+=Math.round(DAY_XP*mult)*(p.goalHits||0)+150*(p.bossWins||0);
    proxy+=WEEK_XP*Object.keys(p.weekPaid||{}).length;
    p.xpEarned=Math.max(0,Math.min(proxy,(p.xp||0)-ev.xp));
    p.xpFix=XP_FIX;p.xp=p.xpEarned+ev.xp;
    return true;
  }
  const want=Math.max(0,(p.xpEarned||0)+ev.xp);
  if(p.xp!==want||ev.changed){p.xp=want;return true;}
  return false;
}
function repairEvents(){
  const seenId={},byKey={},keep=[];
  let changed=false;
  S.events.forEach(e=>{
    if(!e.id||seenId[e.id]){e.id=uid();changed=true;}
    seenId[e.id]=true;
    const k=evKey(e),prev=byKey[k];
    if(prev){
      if(e.done&&!prev.done){prev.done=true;prev.doneOn=e.doneOn||e.date;}
      changed=true;return;                       // drop the duplicate
    }
    byKey[k]=e;keep.push(e);
  });
  if(changed)S.events=keep;
  return changed;
}

/* Participation is derived from the calendar items themselves — no parallel store. */

function clashingDays(evs){

function focusTarget(){

  const inThis=calEvents().some(e=>{const d=parseD(e.date);return d.getFullYear()===y&&d.getMonth()===m;});

  if(next){const d=parseD(next);return {y:d.getFullYear(),m:d.getMonth()};}

}
