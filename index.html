  stem:"Applying pharmacokinetic principles to individualized pharmacotherapy is termed:",
  options:["Medication reconciliation","Titration to effect","Therapeutic drug monitoring","Therapeutic substitution"],
  answer:2,
  rationale:"Application of pharmacokinetic principles to individualized pharmacotherapy is termed therapeutic drug monitoring. Medication reconciliation is the separate process of comparing everything a client is taking."},
 {c:"NUR 314",qid:"314-m1p-11",level:2,prime:true,errs:["knowledge", null, "scope", "knowledge"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  watch:"Why reconciliation exists",
  stem:"The purpose of medication reconciliation is to:",
  options:["Confirm the client can afford every prescription on the list","Compare everything the client takes to catch duplicates and interactions","Decide which specialist should manage each drug on the list","Establish a therapeutic level for each drug on the list"],
  answer:1,
  rationale:"Medication reconciliation means reconciling all the meds: tell me everything you are on, and let us look for drug-drug interactions and duplicates. It matters because specialists often do not communicate with one another, and clients may not know that Tylenol and acetaminophen are the same drug."},
 {c:"NUR 314",qid:"314-m1p-12",level:1,prime:true,errs:[null, "prioritization", "prioritization", "assessment-vs-action"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  watch:"The step that always comes first",
  stem:"Which step of the nursing process always comes first?",
  options:["Assessment","Diagnosis","Planning","Implementation"],
  answer:0,
  rationale:"Always start with assessment. You cannot do something before you assess it, and if the assessment was not done then you cannot do an intervention. This is key when answering test questions."},
 {c:"NUR 314",qid:"314-m1-01",level:2,gate:"314-3997640035",errs:["knowledge", null, "knowledge", "stem-misread"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"After the age of 40, the glomerular filtration rate decreases by an average of:",
  options:["12 mL/min","8 mL/min","20 mL/min","8 mL/min per decade after age 65"],
  answer:1,
  rationale:"After the age of 40 the GFR decreases an average of 8 mL/min, although the age-related decrease varies from person to person. GFR is one of the most important indicators of renal function, since the kidneys' filtering of blood is one of the most important things they do."},
 {c:"NUR 314",qid:"314-m1-02",level:2,gate:"314-3997640035",errs:[null, "safety", "knowledge", "knowledge"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"A serum creatinine level in an older adult:",
  options:["May stay within normal limits even after the filtration rate has fallen","Is the single most reliable indicator of renal function in any age group","Rises in step with the filtration rate as it falls, at every age","Is unaffected by age, muscle mass or the filtration rate"],
  answer:0,
  rationale:"Serum creatinine levels will often remain within normal limits even when the GFR decreases. Creatinine is used to look at kidney function but it is not always 100 percent reliable compared with GFR, so a normal creatinine does not clear an older adult for full-dose renally excreted drugs."},
 {c:"NUR 314",qid:"314-m1-03",level:2,gate:"314-3997640035",errs:["knowledge", "knowledge", "pharm-specific", null],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"For drugs with decreased hepatic metabolism in older adults, clearance typically decreases by:",
  options:["10 to 15 percent","50 to 60 percent","70 to 80 percent","30 to 40 percent"],
  answer:3,
  rationale:"Hepatic metabolism of many drugs decreases with age, and for those drugs clearance typically decreases 30 to 40 percent. Theoretically maintenance doses should be decreased by that percentage, but the rate of drug metabolism varies greatly from person to person, so adjustments must be individualized."},
 {c:"NUR 314",qid:"314-m1-04",level:2,gate:"314-3997640035",errs:["knowledge", "knowledge", null, "stem-misread"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"Benzodiazepines such as diazepam and flurazepam, or their active metabolites, may have half-lives in older adults of up to:",
  options:["24 hours","48 hours","96 hours","96 hours, but only in clients with liver disease"],
  answer:2,
  rationale:"Diazepam, flurazepam and their active metabolites have half-lives up to 96 hours in older adults. That is why benzodiazepines are problematic in this population: the drug is simply not cleared as quickly."},
 {c:"NUR 314",qid:"314-m1-05",level:2,gate:"314-3997640035",errs:["knowledge", null, "knowledge", "pharm-specific"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"Concentrations of a chronically used drug increase until a steady state is reached, which takes approximately:",
  options:["One to two half-lives","Five to six half-lives","Ten to twelve half-lives","Twenty-four hours regardless of half-life"],
  answer:1,
  rationale:"Toxicity may develop slowly in the older person because concentrations of chronically used drugs increase from five to six half-lives until a steady state is achieved. Signs of toxicity may not appear until days or weeks after therapy is started, which is often after discharge."},
 {c:"NUR 314",qid:"314-m1-06",level:2,gate:"314-3997640035",errs:[null, "knowledge", "pharm-specific", "pharm-specific"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"What is the maximum daily dose of acetaminophen the instructor identifies?",
  options:["3 grams per day","2 grams per day","4 grams per day","5 grams per day"],
  answer:0,
  rationale:"The maximum dosage should be capped at three grams per day. Acetaminophen is very toxic to the liver, which is why repeated dosing when the drug seems not to be working is dangerous."},
 {c:"NUR 314",qid:"314-m1-07",level:2,gate:"314-3997640035",errs:["stem-misread", "pharm-specific", "pharm-specific", null],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"Which two drugs are given as examples of highly protein-bound drugs with a higher risk of toxic effects when serum albumin levels decrease?",
  options:["Diazepam and flurazepam","Furosemide and lithium","Aspirin and acetaminophen","Phenytoin and warfarin"],
  answer:3,
  rationale:"Phenytoin, an anticonvulsant, and warfarin or Coumadin, an anticoagulant, are the examples given of highly protein-bound drugs. With both you would monitor therapeutic effect and also keep an eye on the serum albumin level."},
 {c:"NUR 314",qid:"314-m1-08",level:2,gate:"314-3997640035",errs:["knowledge", "knowledge", null, "stem-misread"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"With aging, which of the following occurs?",
  options:["Body fat decreases and total body water increases","Both body fat and total body water increase","Body fat increases and total body water decreases","Both body fat and total body water decrease"],
  answer:2,
  rationale:"With age body fat generally increases and total body water decreases. The increased fat increases the volume of distribution for highly lipophilic drugs such as diazepam and may meaningfully increase their elimination half-life."},
 {c:"NUR 314",qid:"314-m1-09",level:2,gate:"314-3997640035",errs:["knowledge", null, "knowledge", "stem-misread"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"The Beers criteria was initially developed by an expert consensus panel in:",
  options:["1981","1991","2001","2023, when it was most recently revised"],
  answer:1,
  rationale:"It was initially developed by an expert consensus panel in 1991 and is the most widely cited criteria used to assess inappropriate drug prescribing. It is re-evaluated approximately every three years, most recently in 2023."},
 {c:"NUR 314",qid:"314-m1-10",level:2,gate:"314-3997640035",errs:[null, "pharm-specific", "safety", "safety"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"An older adult taking a proton pump inhibitor also requires a calcium supplement. Which form is preferred?",
  options:["Calcium citrate","Calcium carbonate","Either form, they absorb identically","Neither, calcium is contraindicated"],
  answer:0,
  rationale:"Calcium carbonate requires an acidic environment for optimal absorption. Any increase in gastric pH, whether age-related or caused by a proton pump inhibitor, decreases calcium absorption and increases the risk of constipation. Older adults should use calcium citrate, which dissolves more easily in a less acidic environment."},
 {c:"NUR 314",qid:"314-m1-11",level:2,gate:"314-3997640035",errs:["pharm-specific", "stem-misread", "knowledge", null],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"A client is started on warfarin. Which dietary component requires consistency?",
  options:["Vitamin C, found in citrus fruit and juices","Potassium, found in bananas and potatoes","Calcium, found in dairy and fortified foods","Vitamin K, found in green leafy vegetables"],
  answer:3,
  rationale:"With warfarin or Coumadin you want to be careful with how much vitamin K is being taken, meaning green leafy vegetables or anything high in vitamin K. Potassium is the concern with furosemide, not warfarin."},
 {c:"NUR 314",qid:"314-m1-12",level:2,gate:"314-3997640035",errs:["pharm-specific", "stem-misread", null, "pharm-specific"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"According to the drug table, which electrolyte requires monitoring in a client taking furosemide?",
  options:["Sodium","Calcium","Potassium","Magnesium"],
  answer:2,
  rationale:"Lasix or furosemide is a diuretic that eliminates potassium from the body, so the question becomes whether potassium needs to be supplemented. Furosemide also appears on the diuretics list of drugs with decreased renal elimination in older adults."},
 {c:"NUR 314",qid:"314-m1-13",level:2,gate:"314-3997640035",errs:["pharm-specific", null, "knowledge", "stem-misread"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"Which of these is an example of a medication requiring therapeutic drug level monitoring?",
  options:["Acetaminophen","Lithium","Calcium citrate","Enteric-coated aspirin"],
  answer:1,
  rationale:"Lithium was used last semester as the example: you need to know the therapeutic drug level to know whether the medication is therapeutic. Anticoagulants fall into this category too, where clotting times determine whether you are in therapeutic range."},
 {c:"NUR 314",qid:"314-m1-14",level:3,gate:"314-3997640035",errs:[null, "knowledge", "safety", "pharm-specific"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"An older adult has been taking diazepam around the clock for generalized anxiety. Over two weeks the client becomes increasingly sedated and unsteady on their feet. What best explains this?",
  options:["It is highly lipophilic, and more body fat has stretched its half-life","It is being excreted too fast, so the blood level swings up and down","It has lost potency over the two weeks and a higher dose is needed","A higher gastric pH has released each dose early and all at once"],
  answer:0,
  rationale:"With age body fat increases, which increases the volume of distribution for highly lipophilic drugs such as diazepam and may meaningfully increase the elimination half-life. On a scheduled rather than as-needed regimen this raises the potential for toxicity, and in a client with mobility issues it increases the chance of falling."},
 {c:"NUR 314",qid:"314-m1-15",level:3,gate:"314-3997640035",errs:["safety", "knowledge", "safety", null],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"A client was started on a chronically dosed medication during a short hospital stay and did well. Two weeks after discharge the client is brought to the emergency department confused and oversedated. What is the most likely explanation?",
  options:["The client developed a new allergy to the drug","The drug was subtherapeutic in the hospital","The client was given the wrong drug at discharge","The drug accumulated toward steady state after discharge"],
  answer:3,
  rationale:"Toxicity may develop slowly because concentrations of chronically used drugs increase over five to six half-lives until steady state, and signs of toxicity may not appear until days or weeks after therapy is started. Clients are fine in hospital and then present through the emergency department later, not in a good place."},
 {c:"NUR 314",qid:"314-m1-16",level:3,gate:"314-3997640035",errs:["safety", "pharm-specific", null, "knowledge"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"An older adult on a proton pump inhibitor for GERD reports new stomach upset after starting enteric-coated aspirin. What is the most likely cause?",
  options:["The aspirin dose is too high for the client's age","The proton pump inhibitor has inactivated the aspirin","Increased gastric pH is causing early release of the enteric coating","Slowed gastric emptying has delayed absorption"],
  answer:2,
  rationale:"The enteric coating exists to prevent breakdown until the drug reaches an acidic environment. An increased gastric pH causes early release and increases the risk of GI adverse effects, so the client also does not get the expected benefit."},
 {c:"NUR 314",qid:"314-m1-17",level:3,gate:"314-3997640035",errs:["pharm-specific", null, "stem-misread", "knowledge"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"An older adult takes acetaminophen for mild pain, feels no relief after 30 minutes, and takes another dose. Which age-related change best explains why the first dose seemed ineffective?",
  options:["Decreased renal elimination raised the peak concentration of the first dose","Slowed GI motility delayed absorption, onset and the peak of the first dose","Decreased serum albumin left more of the first dose as free drug","Increased body fat shortened the half-life of the first dose"],
  answer:1,
  rationale:"Age-related slowing of GI motility, or the use of anticholinergic drugs, can prolong movement of drugs through the stomach into the small intestine. For drugs absorbed in the upper small intestine such as acetaminophen this delays absorption and onset and reduces peak concentration. The danger is exactly this: the client takes more, and reaches toxic levels of a drug that is hepatotoxic."},
 {c:"NUR 314",qid:"314-m1-18",level:3,gate:"314-3997640035",errs:[null, "pharm-specific", "knowledge", "stem-misread"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"A client on phenytoin has a serum albumin of 2.4 g/dL and is showing signs of toxicity despite a therapeutic total drug level. What explains this?",
  options:["With less albumin available to bind, more free drug is circulating","Low albumin accelerates hepatic metabolism of phenytoin","Low albumin prevents absorption of phenytoin","Low albumin causes phenytoin to be stored in fat"],
  answer:0,
  rationale:"Phenytoin is highly protein bound, and highly protein-bound drugs carry a higher risk of toxic effects when serum albumin levels decrease. Only unbound drug is active, so a standard dose behaves like a larger one. This is why albumin is watched alongside the drug level."},
 {c:"NUR 314",qid:"314-m1-19",level:3,gate:"314-3997640035",errs:["stem-misread", "knowledge", "pharm-specific", null],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"An older client taking furosemide reports muscle weakness and cramping. Which finding should the nurse anticipate?",
  options:["A high serum potassium","A low serum calcium","A high serum sodium","A low serum potassium"],
  answer:3,
  rationale:"Furosemide is a diuretic that eliminates potassium from the body, which is why the question of supplementation arises. Weakness and cramping are consistent with the resulting hypokalemia."},
 {c:"NUR 314",qid:"314-m1-20",level:4,gate:"314-3997640035",errs:["safety", "stem-misread", null, "assessment-vs-action"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"A nurse is preparing to administer insulin to an older adult. What must be done first?",
  options:["Administer the insulin as scheduled","Check the client's most recent A1C","Obtain a finger stick blood glucose","Ask the client whether they have eaten"],
  answer:2,
  rationale:"We are not going to give insulin unless we know what that finger stick is. Giving insulin before assessing it could mean giving insulin to someone whose glucose is already low, which only makes the problem worse. There is always an assessment piece associated with giving medications."},
 {c:"NUR 314",qid:"314-m1-21",level:4,gate:"314-3997640035",errs:["safety", null, "safety", "scope"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"An antihypertensive is due, and the client's blood pressure is lower than the parameters allow. What should the nurse do?",
  options:["Give half the ordered dose","Hold the dose, document, and reassess the blood pressure","Give the dose as ordered since it is scheduled","Discontinue the medication from the record"],
  answer:1,
  rationale:"You do not give an antihypertensive if the blood pressure is too low. That does not mean it is never given again: people sometimes wake with a low pressure that rises through the day. Hold, document and reassess. Discontinuing a medication is outside nursing scope."},
 {c:"NUR 314",qid:"314-m1-22",level:4,gate:"314-3997640035",errs:[null, "pharm-specific", "safety", "pharm-specific"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"An older adult on omeprazole needs calcium supplementation for bone health. What should the nurse expect to be used?",
  options:["Calcium citrate","Calcium carbonate","No calcium while on a proton pump inhibitor","Calcium carbonate given with an antacid"],
  answer:0,
  rationale:"Calcium carbonate needs an acidic environment. On a proton pump inhibitor the gastric pH is raised, so absorption falls and constipation risk rises. Calcium citrate dissolves more easily in a less acidic environment and is the appropriate choice."},
 {c:"NUR 314",qid:"314-m1-23",level:4,gate:"314-3997640035",errs:["safety", "safety", "assessment-vs-action", null],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"A client says they feel much better and plan to stop their medications. What is the nurse's best response?",
  options:["Tell the client it is reasonable to stop now that the symptoms have resolved","Tell the client to stop one medication at a time and watch what happens","Document that the client is non-adherent and notify the provider","Explain that feeling better means it is working, and to call the provider before stopping"],
  answer:3,
  rationale:"People are notorious for stopping medications once they feel better, and feeling better is precisely because the medication is working. Some medications should also never be stopped abruptly because of rebound effects. If a client wants to stop, they should have a conversation with the provider first."},
 {c:"NUR 314",qid:"314-m1-24",level:4,gate:"314-3997640035",errs:["scope", "safety", null, "scope"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"An older adult is admitted taking medications prescribed by a cardiologist, an endocrinologist and a dermatologist. Which nursing action is most appropriate?",
  options:["Ask the client which prescriber to contact","Hold all medications until the family arrives","Perform medication reconciliation","Delegate the medication list to the UAP"],
  answer:2,
  rationale:"Specialists frequently do not communicate with one another, so no one knows the full list. Medication reconciliation is the process for catching duplicates, including the same drug under two names, and drug-drug interactions. Compiling a medication list is not within the scope of unlicensed assistive personnel."},
 {c:"NUR 314",qid:"314-m1-25",level:4,gate:"314-3997640035",errs:["stem-misread", null, "knowledge", "safety"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"A nurse gives an oral analgesic. When should the effect be re-evaluated?",
  options:["Within 15 minutes","Within 30 to 60 minutes","Within 5 minutes","At the end of the shift"],
  answer:1,
  rationale:"Evaluation timing follows the route. For an oral medication you go back within 30 to 60 minutes depending on what was given. Fifteen minutes is the interval for something given intravenously."},
 {c:"NUR 314",qid:"314-m1-26",level:4,gate:"314-3997640035",errs:[null, "stem-misread", "knowledge", "assessment-vs-action"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"A nurse gives a medication intravenously. When should the effect be re-evaluated?",
  options:["Within 15 minutes","Within 30 to 60 minutes","Within 2 hours","Only if the client complains"],
  answer:0,
  rationale:"If we are giving something intravenously we go back within 15 minutes. Oral medications are re-evaluated within 30 to 60 minutes. Evaluation is not optional and does not wait for the client to report a problem."},
 {c:"NUR 314",qid:"314-m1-27",level:4,gate:"314-3997640035",errs:["safety", "safety", "knowledge", null],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"A provider is starting a new antihypertensive in an 82-year-old. Which approach should the nurse anticipate?",
  options:["Start at the standard adult dose to reach effect quickly","Start at a high dose and taper down","Withhold treatment because of the client's age","Start with a low dose and adjust based on the client's response"],
  answer:3,
  rationale:"Starting slow with low doses is necessary because you do not know how a medication will affect a given person. Just because the textbook says it happens a certain way does not mean it happens that way for everybody. You start conservatively and adjust as you see the client respond."},
 {c:"NUR 314",qid:"314-m1-28",level:4,gate:"314-3997640035",errs:["knowledge", "knowledge", null, "safety"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"When teaching an older adult about a newly prescribed medication, the nurse should:",
  options:["Teach the client alone to protect confidentiality","Provide written material only, to avoid overwhelming the client","Include the family in the teaching in case the client cannot manage the regimen alone","Teach only the intended effects, since side effects cause anxiety"],
  answer:2,
  rationale:"Always pull the family in as well, in case the client is not able to care for themselves at some point. Teaching must cover why the medication is being taken, how and when to take it, any assessments needed beforehand, intended versus adverse effects, and when to call the provider."},
 {c:"NUR 314",qid:"314-m1-29",level:5,gate:"314-3997640035",errs:["prioritization", null, "pharm-specific", "prioritization"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"A nurse has four medications due at the same time for four older adults. Which should be addressed first?",
  options:["The client due for a multivitamin who has not eaten breakfast","The client due for insulin whose blood glucose has not been checked","The client due for calcium citrate who reports mild constipation","The client due for a stool softener who has not had a bowel movement"],
  answer:1,
  rationale:"All four are legitimate tasks, so this is about order. Insulin carries the greatest potential for harm and it has an assessment that must precede it. Giving insulin without knowing the finger stick risks worsening a low glucose. The other three carry no comparable immediate risk."},
 {c:"NUR 314",qid:"314-m1-30",level:5,gate:"314-3997640035",errs:[null, "assessment-vs-action", "prioritization", "scope"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"An older adult on warfarin, furosemide and diazepam is admitted after a fall. Which nursing action takes priority?",
  options:["Assess the client's current status and reconcile the medications","Teach the client to keep vitamin K in the diet consistent from week to week","Request a physical therapy referral for gait training before discharge","Ask the provider to discontinue the diazepam because it is a Beers drug"],
  answer:0,
  rationale:"All four have a place, but assessment comes before intervention, and reconciliation is what reveals the interactions and duplicates behind a fall in a client on multiple drugs. Teaching and referrals follow. Requesting that a specific drug be stopped is a judgment made after the picture is complete, and prescribing decisions are not the nurse's alone."},
 {c:"NUR 314",qid:"314-m1-31",level:5,gate:"314-3997640035",errs:["assessment-vs-action", "prioritization", "prioritization", null],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"A nurse is about to administer acetaminophen to an older adult for a fever. Which action comes first?",
  options:["Document that the medication was given","Explain the expected outcome to the client","Plan to re-evaluate in 30 to 60 minutes","Take the client's temperature"],
  answer:3,
  rationale:"Every one of these belongs to the nursing process, so the question is order. Assessment always comes first: if we are giving acetaminophen to relieve a fever, the temperature is the assessment. Outcome identification, implementation, documentation and re-evaluation all follow it."},
 {c:"NUR 314",qid:"314-m1-32",level:5,gate:"314-3997640035",errs:["safety", "safety", null, "scope"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"An older adult's medication list includes a drug appearing on the Beers criteria. What should the nurse do first?",
  options:["Withhold the medication until the provider is contacted","Tell the client the medication is unsafe at their age","Assess the client for adverse effects related to that medication","Ask the pharmacy to substitute a different drug"],
  answer:2,
  rationale:"Beers identifies medications that are potentially inappropriate, not automatically forbidden, and the criteria explicitly carve out settings such as hospice and palliative care. Assessment precedes action. Withholding a dose or arranging a substitution are not independent nursing decisions, and telling a client a prescribed drug is unsafe before assessing is both premature and alarming."},
 {c:"NUR 314",qid:"314-m1-33",level:5,gate:"314-3997640035",errs:["prioritization", null, "pharm-specific", "stem-misread"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"Four older adults are receiving new prescriptions. Which client should the nurse assess first?",
  options:["The client starting a topical antifungal cream for a rash on the foot","The client with chronic kidney disease starting a renally excreted antibiotic","The client starting calcium citrate for osteoporosis prevention","The client starting a daily multivitamin with iron for fatigue"],
  answer:1,
  rationale:"Renal function is the largest single determinant of how a drug is cleared, and most medications are excreted through the kidneys. In a client whose kidneys are not functioning properly, we do not always know how the medication will behave, which places that client at the greatest risk of accumulation and toxicity."},
 {c:"NUR 314",qid:"314-m1-34",level:5,gate:"314-3997640035",errs:[null, "stem-misread", "safety", "scope"],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"A client on hospice care is prescribed a medication listed on the Beers criteria. What is the nurse's most appropriate action?",
  options:["Give it — the first Beers category excludes hospice and palliative clients","Withhold it, because a drug on the Beers criteria is never given to an older adult","Contact the provider to question the order before giving any Beers drug","Give a reduced dose to limit the risk while still treating the symptom"],
  answer:0,
  rationale:"The first Beers category is medications to avoid if the client is over 65 and not in a hospice or palliative care setting. Hospice and palliative care are about comfort, and medications such as narcotics for pain are deliberately taken out of that restriction. Missing the qualifier in the stem is the trap here. Adjusting a dose independently is outside nursing scope."},
 {c:"NUR 314",qid:"314-m1-35",level:5,gate:"314-3997640035",errs:["assessment-vs-action", "scope", "safety", null],unit:"Module 1 \u2014 Principles of pharmacology & the older adult",
  stem:"An older adult reports taking both Tylenol and acetaminophen daily for arthritis. Which action is the priority?",
  options:["Teach the client that the two are the same drug","Notify the provider that the client is non-adherent","Suggest the client switch to ibuprofen","Determine the total daily dose the client is actually taking"],
  answer:3,
  rationale:"Teaching matters, but assessment comes first, and the immediate danger is the total dose. Acetaminophen is very toxic to the liver and should be capped at three grams per day. Clients without healthcare experience often do not know that drugs carry different names for the same medication, so we never assume the education has been given or understood."},

 {c:"NUR 308T",qid:"308-w1-01",level:2,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "pharm-specific"],unit:"Content 3 \u2014 Vision",
  stem:"On a Snellen chart, what does a result of 20/20 mean?",
  options:["The patient can read the \u201c20\u201d line at a distance of 20 feet","The patient sees at 20 feet what a normal eye sees at 200 feet","The patient has 20 degrees of peripheral vision","The patient's intraocular pressure is 20 mmHg"],
  answer:0,
  rationale:"20/20 means the patient can read the \u201c20\u201d line at a distance of 20 feet. Acuity is recorded for each eye separately; when a patient cannot read the chart at all, acuity is recorded as finger count or hand motion."},
 {c:"NUR 308T",qid:"308-w1-02",level:2,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 3 \u2014 Vision",
  stem:"A patient has a drooping eyelid. Which term documents this finding?",
  options:["Ptosis","Nystagmus","Scotoma","Emmetropia"],
  answer:0,
  rationale:"Ptosis is a drooping eyelid. Nystagmus is an oscillating movement of the eyeball, a scotoma is a blind area in the visual field, and emmetropia is normal vision."},
 {c:"NUR 308T",qid:"308-w1-03",level:1,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 3 \u2014 Vision",
  stem:"Which diagnostic test measures intraocular pressure?",
  options:["Tonometry","Gonioscopy","Perimetry","Ophthalmoscopy"],
  answer:0,
  rationale:"Tonometry measures intraocular pressure. Gonioscopy examines the front of the eye to distinguish open-angle from closed-angle glaucoma, perimetry evaluates the field of vision, and ophthalmoscopy examines the cornea, lens and retina."},
 {c:"NUR 308T",qid:"308-w1-04",level:2,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 3 \u2014 Vision",
  stem:"Perimetry testing is used to evaluate which of the following?",
  options:["The field of vision","Intraocular pressure","Color discrimination","The angle of the anterior chamber"],
  answer:0,
  rationale:"Perimetry evaluates the field of vision and identifies scotomas \u2014 blind areas within the visual field. Tonometry measures pressure and gonioscopy assesses the anterior chamber angle."},
 {c:"NUR 308T",qid:"308-w1-05",level:1,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 3 \u2014 Vision",
  stem:"Which refractive error is described as nearsightedness?",
  options:["Myopia","Hyperopia","Astigmatism","Emmetropia"],
  answer:0,
  rationale:"Myopia is nearsightedness and hyperopia is farsightedness. Astigmatism is distortion caused by irregularity of the cornea, and emmetropia is normal vision. Refractive errors can be corrected by lenses that focus light rays on the retina."},
 {c:"NUR 308T",qid:"308-w1-06",level:2,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 3 \u2014 Vision",
  stem:"Legal blindness is defined as a best corrected visual acuity that does not exceed which value in the better eye?",
  options:["20/200","20/70","20/400","20/20"],
  answer:0,
  rationale:"Legal blindness is a BCVA that does not exceed 20/200 in the better eye, or a widest field of vision of 20 degrees or less. Low vision is a BCVA of 20/70 to 20/200; blindness ranges from 20/400 to no light perception."},
 {c:"NUR 308T",qid:"308-w1-07",level:4,gate:"308T-3e94175f66",errs:[null, "assessment-vs-action", "scope", "safety"],unit:"Content 3 \u2014 Vision",
  stem:"A patient is legally blind. Which nursing action would be inappropriate?",
  options:["Offer to feed the patient all meals","Allow the patient to hold the nurse's arm above the elbow while walking a step behind","Describe food items on the meal tray using clock terms","Remove obstacles from the room and describe furniture placement"],
  answer:0,
  rationale:"When caring for patients with low vision or blindness it is important to encourage and support independence as much as possible, so feeding the patient all meals is inappropriate. Guiding by the arm, using clock terms to describe placement, and removing obstacles all support safety and independence."},
 {c:"NUR 308T",qid:"308-w1-08",level:4,gate:"308T-3e94175f66",errs:[null, "safety", "pharm-specific", "stem-misread"],unit:"Content 3 \u2014 Vision",
  stem:"A patient is prescribed two different ophthalmic drops. How should the nurse instruct the patient to administer them?",
  options:["Wait 5 to 10 minutes between the two medications","Instill them back to back so neither is forgotten","Mix the two drops in the conjunctival sac","Give one in each eye to avoid interaction"],
  answer:0,
  rationale:"Multiple drop types need 5\u201310 minute intervals between administrations. Correct administration is essential for optimal therapeutic results, since the eye's ability to absorb medication is limited."},
 {c:"NUR 308T",qid:"308-w1-09",level:2,gate:"308T-3e94175f66",errs:[null, "pharm-specific", "knowledge", "pharm-specific"],unit:"Content 3 \u2014 Vision",
  stem:"Which technique decreases systemic absorption of an ophthalmic medication?",
  options:["Occluding the lacrimal duct after instillation","Instilling the drop directly onto the cornea","Having the patient blink rapidly after instillation","Warming the solution before instillation"],
  answer:0,
  rationale:"Systemic absorption can be decreased by occluding the lacrimal duct. Topical medications are used most often because they are least invasive and have the fewest side effects, but systemic effects can still occur."},
 {c:"NUR 308T",qid:"308-w1-10",level:5,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 3 \u2014 Vision",
  stem:"Glaucoma is best described as which of the following?",
  options:["Optic nerve damage from raised pressure as aqueous humor backs up","An opacity or cloudiness of the lens that scatters light entering the eye","A slow breakdown of the retinal layers with drusen deposits under them","Damage to the retinal vessels from years of high blood sugar"],
  answer:0,
  rationale:"Glaucoma is a group of ocular conditions in which damage to the optic nerve is related to increased IOP caused by congestion of the aqueous humor. It is the leading cause of blindness in adults in the United States and incidence increases with age."},
 {c:"NUR 308T",qid:"308-w1-11",level:3,gate:"308T-3e94175f66",errs:[null, "stem-misread", "knowledge", "knowledge"],unit:"Content 3 \u2014 Vision",
  stem:"A patient reports sudden blurred vision, severe eye pain, headache, nausea and halos around lights. What is the nurse's priority interpretation?",
  options:["A true eye emergency — acute angle-closure glaucoma","The expected findings of open-angle glaucoma, seen at a routine exam","A typical presentation of a cataract, worked up at the next visit","Findings that suggest dry eye syndrome from reduced tear production"],
  answer:0,
  rationale:"In angle-closure glaucoma the iris blocks the drainage angle and eye pressure rises very quickly. Sudden blurry vision, severe eye pain, headache, nausea and vomiting, and rainbow-colored halos around lights make it a true eye emergency \u2014 angle-closure glaucoma can cause blindness if not treated right away."},
 {c:"NUR 308T",qid:"308-w1-12",level:3,gate:"308T-3e94175f66",errs:[null, "stem-misread", "knowledge", "knowledge"],unit:"Content 3 \u2014 Vision",
  stem:"Why is open-angle glaucoma described as the \u201csilent thief\u201d?",
  options:["It is so slow that peripheral vision is gone before the patient notices","It causes sudden, severe pain that patients dismiss until it is too late","It cannot be detected by any test until blindness is already complete","It resolves without treatment in most patients, so it is rarely reported"],
  answer:0,
  rationale:"In open-angle glaucoma the trabecular meshwork is partially blocked and pressure rises gradually. It happens so slowly that vision may be lost before the patient is aware. Manifestations include peripheral vision loss, blurring, halos, difficulty focusing, and difficulty adjusting to low lighting."},
 {c:"NUR 308T",qid:"308-w1-13",level:2,gate:"308T-3e94175f66",errs:[null, "pharm-specific", "pharm-specific", "knowledge"],unit:"Content 3 \u2014 Vision",
  stem:"Timolol maleate, used in the treatment of glaucoma, belongs to which drug class?",
  options:["Beta-adrenergic blocker","Prostaglandin analog","Cholinergic","Carbonic anhydrase inhibitor"],
  answer:0,
  rationale:"Timolol maleate is the prototype beta-adrenergic blocker, used for chronic open-angle glaucoma, aphakic glaucoma, secondary glaucoma and ocular hypertension. Bimatoprost is the prostaglandin analog prototype, pilocarpine the cholinergic, and acetazolamide the carbonic anhydrase inhibitor."},
 {c:"NUR 308T",qid:"308-w1-14",level:2,gate:"308T-3e94175f66",errs:[null, "pharm-specific", "pharm-specific", "knowledge"],unit:"Content 3 \u2014 Vision",
  stem:"Which medication is an osmotic agent used to temporarily reduce IOP during an acute attack of glaucoma?",
  options:["Mannitol","Brimonidine","Pilocarpine","Bimatoprost"],
  answer:0,
  rationale:"Mannitol is the osmotic prototype and temporarily reduces IOP in acute attacks of glaucoma; it is also used to reduce IOP before surgery. Brimonidine is an alpha2-adrenergic agonist, pilocarpine a cholinergic, and bimatoprost a prostaglandin analog."},
 {c:"NUR 308T",qid:"308-w1-15",level:4,gate:"308T-3e94175f66",errs:[null, "pharm-specific", "pharm-specific", "knowledge"],unit:"Content 3 \u2014 Vision",
  stem:"A patient has used topical corticosteroid eye drops long term. Which complications should the nurse monitor for?",
  options:["Glaucoma, cataracts and increased risk of infection","Hypoglycemia, weight loss and a fall in blood pressure","Bradycardia, hypotension and a slowed reaction time","Tinnitus, vertigo and a fluctuating hearing loss"],
  answer:0,
  rationale:"Side effects of long-term topical steroids include glaucoma, cataracts, and increased risk of infection. To avoid these effects, oral NSAID therapy may be used as an alternative to steroid use."},
 {c:"NUR 308T",qid:"308-w1-16",level:3,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 3 \u2014 Vision",
  stem:"Which set of findings is characteristic of cataracts?",
  options:["Painless blurry vision, glare sensitivity and reduced acuity","Severe eye pain, rainbow halos and nausea with vomiting","Sudden loss of peripheral vision with a headache and eye ache","Purulent discharge with crusting of the lids on waking"],
  answer:0,
  rationale:"Cataracts are an opacity or cloudiness of the lens producing painless blurry vision, sensitivity to glare and reduced visual acuity. Diagnostic findings include decreased visual acuity and opacity of the lens seen by ophthalmoscope, slit lamp or inspection."},
 {c:"NUR 308T",qid:"308-w1-17",level:5,gate:"308T-3e94175f66",errs:[null, "safety", "safety", "knowledge"],unit:"Content 3 \u2014 Vision",
  stem:"Which discharge instruction is appropriate after cataract surgery?",
  options:["Avoid bending or stooping for an extended period","Sleep on the side of the affected eye the night after surgery","Resume all normal activities on postoperative day 2","Attempt to hold in a sneeze if it occurs"],
  answer:0,
  rationale:"Patients should avoid bending or stooping for an extended period, avoid lying on the side of the affected eye the night after surgery, keep activity light, and avoid lifting, pushing or pulling objects heavier than 15 lb. Sneezing should not be held in because it increases IOP \u2014 it should be done with an open mouth to decrease pressure."},
 {c:"NUR 308T",qid:"308-w1-18",level:5,gate:"308T-3e94175f66",errs:[null, "stem-misread", "stem-misread", "knowledge"],unit:"Content 3 \u2014 Vision",
  stem:"Which finding after cataract surgery should the patient be taught to report to the physician immediately?",
  options:["Continuous flashing lights","Mild itching that resolves with rest","A scratchy sensation on the first day","Slightly blurred vision that improves over the week"],
  answer:0,
  rationale:"Patients are instructed to call the physician immediately if vision changes, continuous flashing lights appear, redness, swelling or pain increase, the type and amount of drainage increases, or significant pain is not relieved by acetaminophen."},
 {c:"NUR 308T",qid:"308-w1-19",level:2,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 3 \u2014 Vision",
  stem:"Which statement about age-related macular degeneration is correct?",
  options:["The dry (nonexudative) type is the more common of the two","The wet type is the more common of the two","AMD is the most common cause of blindness in children","AMD is caused by increased intraocular pressure"],
  answer:0,
  rationale:"AMD is the most common cause of vision loss in people older than 60. The dry or nonexudative type is most common at 85\u201390% and involves slow breakdown of the retinal layers with drusen. The wet type may have abrupt onset and involves proliferation of abnormal vessels under the retina."},
 {c:"NUR 308T",qid:"308-w1-20",level:1,gate:"308T-3e94175f66",errs:[null, "safety", "safety", "assessment-vs-action"],unit:"Content 3 \u2014 Vision",
  stem:"After photodynamic therapy for AMD, which instruction is essential?",
  options:["Avoid sunlight or bright light for 5 days","Remain on bed rest with the head flat for 48 hours","Take nothing by mouth, including water, for 12 hours","Apply a warm compress to the eye every hour for 3 days"],
  answer:0,
  rationale:"In photodynamic therapy a light-sensitive dye is injected and a laser activates it, shutting down abnormal vessels without damaging the retina. The patient must avoid sunlight or bright light for 5 days after treatment to avoid activating dye in vessels near the skin surface."},
 {c:"NUR 308T",qid:"308-w1-21",level:2,gate:"308T-3e94175f66",errs:[null, "pharm-specific", "pharm-specific", "knowledge"],unit:"Content 3 \u2014 Vision",
  stem:"Bevacizumab, ranibizumab and aflibercept are used in wet AMD because they act as which of the following?",
  options:["VEGF inhibitors","Carbonic anhydrase inhibitors","Topical anesthetics","Mast cell stabilizers"],
  answer:0,
  rationale:"These are intravitreal vascular endothelial growth factor (VEGF) inhibitors; faricimab is a VEGF-Ang2 inhibitor. Risks include retinal detachment, stroke and local injection reactions."},
 {c:"NUR 308T",qid:"308-w1-22",level:4,gate:"308T-3e94175f66",errs:[null, "stem-misread", "stem-misread", "knowledge"],unit:"Content 3 \u2014 Vision",
  stem:"A patient splashes a chemical in the eye. For how long should the eye be flushed?",
  options:["20 minutes","5 minutes","10 minutes","15 minutes"],
  answer:0,
  rationale:"When an exposure occurs the eye should be continuously flushed with tap water for 20 minutes, and flushing should begin within 5 minutes for the best outcome. The bottle or container should be saved so emergency responders know which chemical was involved."},
 {c:"NUR 308T",qid:"308-w1-23",level:5,gate:"308T-3e94175f66",errs:[null, "safety", "assessment-vs-action", "safety"],unit:"Content 3 \u2014 Vision",
  stem:"A patient arrives with a foreign object embedded in the eye. What is the priority action?",
  options:["Shield the eye with a metal shield or cup and leave the object in place","Remove the object with sterile forceps and irrigate the eye with saline","Irrigate the eye with a steady stream of water until the object comes out","Apply firm pressure over the closed lid to keep the object from moving"],
  answer:0,
  rationale:"In emergency treatment of eye trauma the nurse does not remove foreign objects. The eye is protected using a metal shield or paper cup. Chemical injuries, by contrast, are flushed."},
 {c:"NUR 308T",qid:"308-w1-24",level:4,gate:"308T-3e94175f66",errs:[null, "pharm-specific", "pharm-specific", "safety"],unit:"Content 3 \u2014 Vision",
  stem:"Mydriatic and cycloplegic agents are contraindicated in which situation?",
  options:["A patient with narrow angles or shallow anterior chambers","A patient with dry eye syndrome and reduced tear production","A patient with a corneal abrasion from a contact lens","A patient with allergic conjunctivitis and itching"],
  answer:0,
  rationale:"Mydriatics (which dilate) and cycloplegics (which paralyze) are contraindicated with narrow angles or shallow anterior chambers, and in patients on monoamine oxidase inhibitors or tricyclic antidepressants. They may cause CNS symptoms and increased blood pressure, especially in children or older adults."},
 {c:"NUR 308T",qid:"308-w1-26",level:2,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"In a normal Rinne test, what is the expected result?",
  options:["Air conduction is heard twice as long as bone conduction","Bone conduction is heard longer than air conduction","Air and bone conduction are equal","Sound lateralizes to the poorer ear"],
  answer:0,
  rationale:"Normal hearing shows an air-conduction time twice as long as bone conduction. In conductive hearing loss, bone conduction is longer than or equal to air conduction. In sensorineural loss, air conduction is still longer than bone conduction but not twice as long."},
 {c:"NUR 308T",qid:"308-w1-27",level:4,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"During a Weber test the sound lateralizes to the patient's poorer ear. This suggests which type of loss?",
  options:["Conductive hearing loss","Sensorineural hearing loss","Mixed hearing loss","Functional hearing loss"],
  answer:0,
  rationale:"On the Weber test, normal hearing indicates sound in both ears, conductive loss makes the sound travel toward the poor ear, and sensorineural loss makes the sound travel toward the good ear."},
 {c:"NUR 308T",qid:"308-w1-28",level:4,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"Age-related hearing loss is known by which term?",
  options:["Presbycusis","Otalgia","Otorrhea","Labyrinthitis"],
  answer:0,
  rationale:"Presbycusis is the increased incidence of hearing loss with age. Otalgia is ear pain, otorrhea is ear drainage, and labyrinthitis is an inner-ear condition."},
 {c:"NUR 308T",qid:"308-w1-29",level:1,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"Sensorineural hearing loss results from damage to which structures?",
  options:["The cochlea or vestibulocochlear nerve","The external auditory canal","The tympanic membrane","The ossicles of the middle ear"],
  answer:0,
  rationale:"Sensorineural loss is caused by damage to the cochlea or vestibulocochlear nerve. Conductive loss is caused by an external or middle ear problem, mixed loss involves both, and functional (psychogenic) loss is caused by an emotional problem."},
 {c:"NUR 308T",qid:"308-w1-30",level:1,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"Which is an early symptom of hearing loss?",
  options:["Tinnitus, often described as ringing in the ears","Complete loss of speech discrimination","Purulent drainage from the ear","Facial nerve paralysis"],
  answer:0,
  rationale:"Early symptoms include tinnitus \u2014 the perception of sound, often ringing in the ears \u2014 increasing inability to hear in a group, and turning up the volume on the TV. Impairment may be gradual and not recognized by the person experiencing it."},
 {c:"NUR 308T",qid:"308-w1-31",level:1,gate:"308T-3e94175f66",errs:[null, "knowledge", "assessment-vs-action", "assessment-vs-action"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"Which technique best supports communication with a hearing-impaired patient?",
  options:["Use a low-tone, normal voice and face the person","Shout in a high-pitched voice into the affected ear","Speak quickly to limit the length of the conversation","Stand behind the patient to avoid distraction"],
  answer:0,
  rationale:"Guidelines include using a low-tone normal voice, speaking slowly and distinctly, reducing background noise and distractions, facing the person and getting their attention, speaking into the less impaired ear, using gestures and facial expressions, and writing information or obtaining a sign language translator if necessary."},
 {c:"NUR 308T",qid:"308-w1-32",level:2,gate:"308T-3e94175f66",errs:[null, "safety", "safety", "assessment-vs-action"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"A patient has a vegetable fragment lodged in the ear canal. Which action should be avoided?",
  options:["Irrigating the ear canal","Referral for removal by suction","Inspection with an otoscope","Removal by instrumentation in the operating room"],
  answer:0,
  rationale:"Objects that may swell, such as vegetables or insects, should not be irrigated. Foreign body removal can be dangerous and may require extraction in the operating room. Cerumen impaction, by contrast, may be removed by gentle irrigation with the lowest pressure."},
 {c:"NUR 308T",qid:"308-w1-33",level:3,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"Which manifestations are associated with acute otitis media?",
  options:["Otalgia, fever and hearing loss","Painless progressive vision loss","Vertigo with a low-sodium requirement","Purulent nasal drainage without ear symptoms"],
  answer:0,
  rationale:"Acute otitis media is seen most frequently in children and presents with otalgia (ear pain), fever and hearing loss. Treatment includes antibiotic therapy and myringotomy or tympanotomy to remove fluid from the ear."},
 {c:"NUR 308T",qid:"308-w1-34",level:4,gate:"308T-3e94175f66",errs:[null, "stem-misread", "knowledge", "knowledge"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"On the second day after mastoid surgery a patient reports constant throbbing pain and has a fever. What does the nurse suspect?",
  options:["Infection","Expected opening of the Eustachian tube","Normal graft healing","Cerumen impaction"],
  answer:0,
  rationale:"Occasional sharp, shooting pains may occur as the Eustachian tube opens and allows air into the middle ear and are expected. Constant throbbing pain and fever may indicate infection and should be reported."},
 {c:"NUR 308T",qid:"308-w1-35",level:1,gate:"308T-3e94175f66",errs:[null, "stem-misread", "safety", "safety"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"Which instruction is correct for a patient recovering from mastoid surgery?",
  options:["Blow the nose gently one side at a time and sneeze with the mouth open","There are no activity restrictions after this procedure","Blow both nostrils firmly to clear the Eustachian tube","Shower with the head under running water to keep the ear clean"],
  answer:0,
  rationale:"Patients are taught to blow the nose gently one side at a time and to sneeze and cough with the mouth open, to avoid heavy lifting, exertion and nose blowing that could dislodge grafts or prostheses, and to avoid getting water in the ear. There are activity restrictions after this procedure."},
 {c:"NUR 308T",qid:"308-w1-36",level:4,gate:"308T-3e94175f66",errs:[null, "knowledge", "pharm-specific", "knowledge"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"Why may a patient's hearing be reduced for several weeks after mastoid surgery?",
  options:["Edema, blood and fluid in the middle ear, and the dressings and packing","Permanent destruction of the cochlea by the surgical instruments","Ototoxic effects of the anesthetic on the eighth cranial nerve","A cerumen impaction that forms behind the surgical dressing"],
  answer:0,
  rationale:"Hearing may be reduced for several weeks after surgery because of edema, accumulation of blood and fluid in the middle ear, and dressings and packings. The nurse uses measures to improve hearing and communication during this period."},
 {c:"NUR 308T",qid:"308-w1-37",level:5,gate:"308T-3e94175f66",errs:[null, "knowledge", "pharm-specific", "pharm-specific"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"Which set of manifestations is characteristic of M\u00e9ni\u00e8re's disease?",
  options:["Fluctuating hearing loss, tinnitus, aural fullness and episodic vertigo","Painless blurred vision, glare sensitivity and reduced visual acuity","Fever, otalgia and purulent drainage from the affected ear","Sudden unilateral facial droop, slurred speech and arm weakness"],
  answer:0,
  rationale:"M\u00e9ni\u00e8re's disease results from abnormal inner ear fluid balance caused by malabsorption of the endolymphatic sac or blockage of the endolymphatic duct. Manifestations include fluctuating progressive hearing loss, tinnitus, a feeling of pressure or fullness, and episodic incapacitating vertigo that may be accompanied by nausea and vomiting."},
 {c:"NUR 308T",qid:"308-w1-38",level:3,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"Which dietary instruction is part of the management of M\u00e9ni\u00e8re's disease?",
  options:["Limit sodium to 2000 mg per day","Increase sodium to 4000 mg per day","Restrict all dietary protein","Eliminate calcium-containing foods"],
  answer:0,
  rationale:"Treatment includes a low-sodium diet of 2000 mg/day. Meclizine (Antivert) may be used, along with tranquilizers, antiemetics and diuretics. Surgical management may be used to eliminate attacks of vertigo."},
 {c:"NUR 308T",qid:"308-w1-39",level:1,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"Which term describes the illusion of motion or a spinning sensation?",
  options:["Vertigo","Dizziness","Nystagmus","Tinnitus"],
  answer:0,
  rationale:"Vertigo is the illusion of motion or a spinning sensation. Dizziness is any altered sense of orientation in space, and nystagmus is involuntary rhythmic movement of the eyes associated with vestibular dysfunction."},
 {c:"NUR 308T",qid:"308-w1-40",level:2,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"An acoustic neuroma is a tumor of which cranial nerve?",
  options:["VIII","V","VII","X"],
  answer:0,
  rationale:"Acoustic neuroma is a tumor of the VIII cranial nerve. It is listed among conditions of the inner ear along with tinnitus, labyrinthitis, benign positional vertigo and ototoxicity."},
 {c:"NUR 308T",qid:"308-w1-41",level:4,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 2 \u2014 Hearing & balance",
  stem:"A cochlear implant is indicated for which patient?",
  options:["Profound bilateral sensorineural loss that hearing aids do not help","A cerumen impaction that has not responded to irrigation","Recurrent acute otitis media that has not responded to antibiotics","A perforated tympanic membrane that has not healed on its own"],
  answer:0,
  rationale:"A cochlear implant is an auditory prosthesis used for people with profound sensorineural hearing loss bilaterally who do not benefit from conventional hearing aids."},
 {c:"NUR 308T",qid:"308-w1-42",level:1,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"By definition, a chronic illness persists for longer than what period?",
  options:["3 months","2 weeks","6 weeks","12 months"],
  answer:0,
  rationale:"A chronic illness has a long disease course, persisting for more than 3 months. It is incurable and can only be managed, affects the individual and their family, varies from minor inconvenience to total disability, and is not limited to the elderly."},
 {c:"NUR 308T",qid:"308-w1-44",level:1,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"How many of the top 10 causes of death in the United States are chronic diseases?",
  options:["7","3","5","10"],
  answer:0,
  rationale:"7 of the top 10 causes of death are chronic diseases. Heart disease and cancer alone account for nearly 48% of all deaths."},
 {c:"NUR 308T",qid:"308-w1-45",level:1,gate:"308T-3e94175f66",errs:[null, "assessment-vs-action", "stem-misread", "assessment-vs-action"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"Which finding distinguishes normal age-related forgetfulness from dementia?",
  options:["The person can remember later or when given time and can use notes to function","The person neglects self-care and struggles with routine daily tasks","The person shows significant changes in language and decision-making","Medical evaluation reveals significant abnormalities"],
  answer:0,
  rationale:"In normal aging the person is able to remember later or when given time, can use notes and reminders to function, maintains daily tasks and self-care, and has an essentially normal medical evaluation. Dementia involves rarely recalling even with a reminder, significant changes in memory, language and decision-making, and neglect of self-care."},
 {c:"NUR 308T",qid:"308-w1-46",level:2,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"A patient needs help for depression when signs have been present daily for longer than what period?",
  options:["2 weeks","3 days","6 months","1 year"],
  answer:0,
  rationale:"A person needs help when signs of depression go on every day for more than 2 weeks. Signs include loss of interest or pleasure in usual activities, fatigue and loss of energy, feelings of worthlessness or excessive guilt, difficulty thinking or concentrating, and suicidal thinking or attempts."},
 {c:"NUR 308T",qid:"308-w1-47",level:2,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"Which describes the aging cardiovascular system?",
  options:["The heart works harder but accomplishes less, with irregular beats","The heart muscle enlarges and pumps more blood with each beat","The blood vessels become more elastic and dilate with each beat","The blood volume rises to make up for the slower resting rate"],
  answer:0,
  rationale:"With aging, heart muscles decrease in size allowing fat and calcium deposits, and the aorta and blood vessels harden and shrink. The result is that the heart works harder but accomplishes less, with fewer and more irregular heartbeats and less blood volume."},
 {c:"NUR 308T",qid:"308-w1-49",level:3,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"Which genitourinary changes are expected with aging?",
  options:["Kidneys excrete less, the bladder holds less, and frequency rises","Kidneys excrete more, the bladder holds more, and frequency falls","The bladder holds more, so the older adult voids less often","Renal function is unchanged, so voiding stays the same"],
  answer:0,
  rationale:"With aging the kidneys excrete less urine and the bladder loses capacity, increasing urination frequency. Benign prostatic hyperplasia is common in men, and urge and stress incontinence are common in women due to weakening muscles."},
 {c:"NUR 308T",qid:"308-w1-50",level:1,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"An older adult's skin perspires less than it once did. What is the clinical significance?",
  options:["The body's ability to cool itself is impaired","Wound healing is accelerated","The protective oil layer increases","The risk of skin cancer decreases"],
  answer:0,
  rationale:"Aging skin becomes thinner, looser, more fragile and heals more slowly. It loses its protective oil layer, affecting hydration, and perspires less, impairing the body's ability to cool itself. Bruise appearance is altered and there is higher risk of skin cancer from cumulative sun exposure."},
 {c:"NUR 308T",qid:"308-w1-51",level:2,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"Which statement best describes cognitive change in normal aging?",
  options:["Processing speed, not necessarily ability, is the primary change","Intellectual ability is lost first","Memory loss severe enough to prevent self-care is expected","Reaction time is unaffected by age"],
  answer:0,
  rationale:"Processing speed, not necessarily ability, is the primary change. Slower response and reaction times are typical, and reduced cerebral circulation can lead to dizziness, faintness and frequent falls. Common challenges include word-finding, concentration and processing multiple tasks."},
 {c:"NUR 308T",qid:"308-w1-53",level:1,gate:"308T-3e94175f66",errs:[null, "assessment-vs-action", "assessment-vs-action", "knowledge"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"An older patient with a chronic illness becomes tearful while describing losing independence. What is the nurse's best response?",
  options:["Use open-ended questions, validate the feelings, and stay consistent","Reassure the patient that many people in this position feel far worse","Move the conversation along so the assessment can be finished on time","Explain that these feelings come from elsewhere, not from the illness"],
  answer:0,
  rationale:"The clinical response is to establish a trusting nurse\u2013patient relationship, use open-ended questions to encourage expression, validate emotions and experiences, and provide consistent emotional support. Minimizing emotional distress and rushing the conversation are to be avoided."},
 {c:"NUR 308T",qid:"308-w1-54",level:3,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"What is the foundation of any rehabilitation program?",
  options:["Assessment of function — the activities of daily living","The patient's admitting laboratory values and imaging","The number and kind of medications the patient is prescribed","The patient's insurance coverage and the days it allows"],
  answer:0,
  rationale:"Assessment of functional abilities \u2014 activities of daily living \u2014 is the foundation of any rehabilitation program. Rehabilitation often targets mobility, bowel and bladder control, and sexual dysfunction, with the primary goal of helping the person gain a positive self-image through coping."},
 {c:"NUR 308T",qid:"308-w1-55",level:2,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"Which four pillars form the basis of chronic care management interventions?",
  options:["Teaching, counseling, advocating and referring","Diagnosing, prescribing, dispensing and billing","Screening, admitting, discharging and documenting","Assessing, restraining, isolating and monitoring"],
  answer:0,
  rationale:"The team's work is built on four pillars: teaching, to empower patients and families with knowledge; counseling, to address psychological and emotional challenges; advocating, to ensure needs and rights are met; and referring, to connect patients to specialized services."},
 {c:"NUR 308T",qid:"308-w1-56",level:4,gate:"308T-3e94175f66",errs:[null, "safety", "scope", "scope"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"A patient with COPD continues to smoke. Which principle should guide the nurse's care?",
  options:["The patient has a right to care even when their own behavior contributes","Care may be withheld until the patient agrees to stop smoking","The nurse should express disapproval so the patient is motivated","The patient should be referred elsewhere until the smoking stops"],
  answer:0,
  rationale:"Individuals have a right to receive care even if their own behaviors contribute to their illness. Healthcare professionals must also be aware of their own feelings and biases in order to provide equitable care."},
 {c:"NUR 308T",qid:"308-w1-57",level:4,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"Why does chronic illness in one system often lead to additional conditions?",
  options:["One condition raises the risk and complexity of the next — a domino effect","Chronic illnesses are always genetically linked, so they cluster in families","Treatment of one condition always causes the next one to develop","Chronic illness is limited to a single body system, so the others fail later"],
  answer:0,
  rationale:"Chronic conditions often create a domino effect, where the presence of one illness increases the risk and complexity of developing another \u2014 for example, diabetes mellitus leading to chronic renal disease."},
 {c:"NUR 308T",qid:"308-w1-58",level:4,gate:"308T-3e94175f66",errs:[null, "knowledge", "knowledge", "stem-misread"],unit:"Content 1 \u2014 Gerontology & chronic illness",
  stem:"How does chronic illness typically affect the family?",
  options:["Day-to-day management falls to the family, with economic strain and role reversal","Families are rarely involved in day-to-day management once a plan is in place","The economic impact is minimal because the treatment is covered by insurance","Socialization increases for the family as they rally around the patient"],
  answer:0,
  rationale:"The major responsibility for day-to-day management often falls to family members. This can bring economic strain from lost income and expensive treatments, decreased socialization for the entire family, and role reversal as spouses, children or parents take on caregiving roles."},
