/* ---------- exam gates: the only route past Pharm Fluent ----------
   One gate per exam. It opens when the exam has been sat, everything leading up
   to it is checked off, its Recall questions are clear, and its practice
   test is passed. Ranks 8-13 are bought with gates, never with XP. */
function gateChecklist(ex){
  const prior=S.events.filter(x=>x.courseId===ex.courseId&&x.type==="Exam"&&x.date<ex.date)
    .map(x=>x.date).sort().pop()||"0000-00-00";
  return S.events.filter(e=>e.courseId===ex.courseId&&e.type!=="Exam"&&e.date>prior&&e.date<=ex.date);
}
function gateQuestions(ex,tier){
  return S.questions.filter(q=>!q.prime&&q.gate===ex.sid&&(!tier||(q.tier||1)===tier));
}
function missedBox(list){ return list.filter(q=>(q.wrong||0)>0); }
function tierClear(list){ return list.length>0&&list.every(q=>(q.seen||0)>0&&(q.wrong||0)===0); }
function practiceOf(ex){ return (S.profile.practice||{})[ex.sid]||null; }
/* ---------------------------------------------------------------------------
   A REQUIREMENT YOU CANNOT ATTEMPT IS NOT A REQUIREMENT, IT IS A WALL

   Every gate in the app used to be unwinnable, and in two separate ways.

   It demanded a passed practice test, read from S.profile.practice - which
   nothing in the file ever writes, because the practice tests have not been
   built yet. `practicePassed` was therefore false forever. It also demanded
   `hasBank`, and six of the eight exams have no question bank, so those six
   were shut whatever anyone did.

   The consequence ran a long way. No gate could open, so gatesOpen stayed
   empty, so milestoneLevel could never reach 10, so ranks 10 to 13 - Charge
   Nurse, Preceptor, Nurse Educator, Nightingale - were unreachable in an app
   named after rank 10, and the $960 of gate money never paid.

   So each requirement now applies only where it can be met. Sitting the exam
   and clearing the coursework always count. A question bank counts when there
   is one. A practice test counts once one has been taken - and it will start
   counting on its own the day practice tests ship, with no change here. */
function gateState(ex){
  const list=gateChecklist(ex);
  const t1=gateQuestions(ex,1),t2=gateQuestions(ex,2),t3=gateQuestions(ex,3);
  const pr=practiceOf(ex);
  const st={ex:ex,checklist:list,
    checklistDone:list.length>0&&list.every(e=>e.done),
    sat:dayDiff(ex.date)<0||!!ex.done,
    hasBank:(t1.length+t2.length+t3.length)>0,
    t1:t1,t2:t2,t3:t3,
    r1:tierClear(t1),r2:tierClear(t2),r3:tierClear(t3),
    missed:missedBox(t1.concat(t2,t3)),
    practice:pr,
    practicePassed:!!(pr&&pr.best>=PASS_MARK),
    honours:!!(pr&&pr.first>=HONOURS)};
  st.earned=st.sat&&st.checklistDone
    &&(!st.hasBank||st.r1)          // clear the bank if this exam has one
    &&(!pr||st.practicePassed);     // pass the practice test if one has been taken
  st.open=st.earned||!!((S.profile.gatesOpen||{})[ex.sid]);   // once cleared, stays cleared
  return st;
}
function allGates(){
  return S.events.filter(e=>e.type==="Exam").sort((a,b)=>a.date.localeCompare(b.date)).map(gateState);
}
function tierLeft(tier){
  const q=S.questions.filter(x=>x.gate&&(x.tier||1)===tier);
  return {total:q.length,left:q.filter(x=>!((x.seen||0)>0&&(x.wrong||0)===0)).length};
}
/* Rank 13 asked for a first-try 90 on all eight practice tests, which do not
   exist, so it was unreachable even in theory. The standard for Nightingale is
   now something a person can actually hold themselves to today, and it tightens
   by itself as practice tests arrive: nothing wrong anywhere in the gated
   banks, an honours pass on every practice test that HAS been taken, and a
   career accuracy that stands up over a real number of questions. */
const ACC_MIN=0.90, ACC_N=300;
function distinction(gs){
  const p=S.profile, ans=p.answered||0, cor=p.correct||0;
  const taken=gs.filter(g=>g.practice);
  return {accOK:ans>=ACC_N&&cor/ans>=ACC_MIN, ans:ans,
          acc:ans?cor/ans:0, testsOK:taken.every(g=>g.honours),
          testsLeft:taken.filter(g=>!g.honours).length};
}
function milestoneLevel(){
  const gs=allGates(),total=gs.length,open=gs.filter(g=>g.open).length;
  const apply=tierLeft(2),prio=tierLeft(3);
  const missed=S.questions.filter(q=>q.gate&&(q.wrong||0)>0).length;
  const honours=gs.filter(g=>g.honours).length;
  const dis=distinction(gs);
  let lvl=0,next="";
  if(total>0&&open===total){
    lvl=10;
    if(apply.total>0&&apply.left===0)lvl=11;
    if(lvl===11&&prio.total>0&&prio.left===0)lvl=12;
    if(lvl===12&&missed===0&&dis.accOK&&dis.testsOK)lvl=13;
  }
  if(lvl===0)next=(total-open)+" more exam gate"+((total-open)===1?"":"s");
  else if(lvl===10)next=apply.total?apply.left+" level 3\u20134 questions left":"no level 3\u20134 questions loaded yet";
  else if(lvl===11)next=prio.total?prio.left+" level 5 questions left":"no level 5 questions loaded yet";
  else if(lvl===12){
    const bits=[];
    if(missed)bits.push(missed+" missed");
    if(!dis.testsOK)bits.push(dis.testsLeft+" practice test"+(dis.testsLeft===1?"":"s")+" without a first-try 90");
    if(!dis.accOK)bits.push(dis.ans<ACC_N
      ?(ACC_N-dis.ans)+" more questions answered"
      :"90% career accuracy (you are at "+Math.round(dis.acc*100)+"%)");
    next=bits.join(", ");
  }
  return {lvl:lvl,open:open,total:total,next:next,apply:apply,prio:prio,missed:missed,honours:honours,dis:dis};
}

/* ============================ game math ============================ */
function xpProgress(xp){
  let lvl=1,cum=0,need=250;
  while(lvl<XP_CAP&&xp>=cum+need){cum+=need;lvl++;need=Math.round(need*1.22);}
  return {lvl:lvl,into:xp-cum,need:need,pct:Math.min(1,(xp-cum)/need),capped:lvl>=XP_CAP&&xp>=cum+need};
}
/* -------------------------------------------------------------------------
   THE LADDER RUNS ON THE SEMESTER CLOCK

   XP was the wrong engine: it topped out at nine, and a hard week in September
   could carry you further up the ladder than the calendar had any business
   allowing. So the ladder is paced to the term instead. A rank opens roughly
   every week, and the last one opens a week before finals - so the top of the
   ladder is something you reach by staying with the course all semester, not
   by grinding one weekend.

   Two things have to be true to hold a rank: the week has to have arrived, and
   you have to be caught up. Being caught up is everything already due that is
   ticked off, plus the exam gates for exams that have already happened. Falling
   behind holds you where you are; it never takes back a rank you have earned. */
const RANK_STEPS=RANKS.length-1;                 // twelve moves from Student Nurse to the top
const FINALS_LEAD=1;                             // the top rank opens this many weeks before finals
function termWeeks(){
  const t=termBounds();
  if(!t)return null;
  const wk=d=>Math.floor((parseD(d)-t.start)/604800000);
  const exams=S.events.filter(e=>e.type==="Exam"||/final exam/i.test(e.title||"")).map(e=>e.date).sort();
  const fin=exams.length?exams[exams.length-1]:dkey(t.end);
  const top=Math.max(RANK_STEPS,wk(fin)-FINALS_LEAD);   // never squeeze the ladder shorter than its steps
  return {t:t,wk:wk,now:wk(today()),top:top,finals:fin};
}
/* the Sunday a given rank opens */
function rankOpens(lvl){
  const T=termWeeks();if(!T)return null;
  const w=Math.round((lvl-1)*T.top/RANK_STEPS);
  return dkey(weekStart(T.t,w));
}
/* -------------------------------------------------------------------------
   SIXTY-FIVE LEVELS

   A full week is five levels: eighty questions you have not answered before,
   and that week's tasks. Thirteen weeks of that reaches the top, two weeks
   before finals. The name changes every fifth level, so the thirteen rank
   names cover the ladder exactly - one to five is Student Nurse, sixty-one to
   sixty-five is Nightingale - while the number moves every single level.

   Of those five, three come from questions and two from tasks.

   Only the FIRST answer to a question counts. A question that comes round
   again on its spaced-repetition schedule is worth studying and worth XP, but
   it does not move the ladder, and a question met in a ward round is the same
   question it was in Study. The four rounds inside each boss room are their
   own content and count once each.

   Because levels come off a running total rather than a weekly reckoning, a
   heavy week banks itself: answer a hundred and the extra twenty is already on
   the board. What limits anyone is how many questions exist to be answered. */
/* A hundred levels in twenty tiers of five. Thirteen of those tiers have
   names; the seven above them are deliberately blank. At five levels a week
   the named ladder runs out around week thirteen and the rest is a mountain
   nobody is expected to climb this semester - which is the point of leaving it
   visible and unnamed. Anyone who does get up there keeps the last name we
   have until we write the new ones. */
const LEVEL_MAX=100;
const TIER_SIZE=5;
const TIER_COUNT=LEVEL_MAX/TIER_SIZE;      // twenty
const rankName=t=>RANKS[Math.min(t,RANKS.length)-1];
const tierNamed=t=>t<=RANKS.length;
const WEEK_Q=80;                  // a week of practice
const LV_FROM_Q=3;                // three of the week's five levels
const LV_FROM_TASKS=2;            // and two from the week's tasks
const Q_PER_LEVEL=WEEK_Q/LV_FROM_Q;

/* every distinct question this person has ever answered, plus the boss rounds
   they have played, which are content of their own */
function uniqueAnswered(){
  const q=S.questions.filter(x=>!x.prime&&(x.seen||0)>0).length;
  return q+Object.keys(S.profile.fightSeen||{}).length;
}
/* one week's tasks, done over due. The current week counts only what has come
   due so far, so Wednesday is not judged on Friday's homework. */
function weekWork(a,z){
  const end=z>today()?today():z;
  if(end<a)return {credit:0,due:0,done:0};
  const due=todoOf(S.events.filter(e=>e.date>=a&&e.date<=end));
  const done=due.filter(e=>e.done).length;
  return {credit:due.length?Math.min(1,done/due.length):1,due:due.length,done:done};
}
function caughtUp(){
  const T=termWeeks(), from=S.profile.joined||"2000-01-01";
  const u=uniqueAnswered();
  if(!T)return {levels:0,due:0,done:0,unique:u,week:null,share:1};
  let lv=0,due=0,done=0;
  for(let w=0;w<=T.top;w++){
    const a=dkey(weekStart(T.t,w));
    if(a>today())break;
    if(dshift(a,6)<from)continue;
    const r=weekWork(a,dshift(a,6));
    lv+=r.credit*LV_FROM_TASKS;due+=r.due;done+=r.done;
  }
  const wa=dkey(weekStart(T.t,T.now));
  return {levels:lv,due:due,done:done,unique:u,share:due?done/due:1,
          week:weekWork(wa,dshift(wa,6))};
}
const tierOfLevel=l=>Math.min(TIER_COUNT,Math.floor((l-1)/TIER_SIZE)+1);
function levelInfo(xp){
  const T=termWeeks(), c=caughtUp();
  const qLv=c.unique/Q_PER_LEVEL;
  const earned=qLv+c.levels;
  const lvl=Math.max(S.profile.rankMax||1,Math.min(LEVEL_MAX,1+Math.floor(earned+1e-9)));
  const into=Math.max(0,Math.min(1,earned-(lvl-1)));
  const tier=tierOfLevel(lvl);
  return {lvl:lvl,tier:tier,into:into,need:1,pct:lvl>=LEVEL_MAX?1:into,
          rank:rankName(tier),named:tierNamed(tier),paced:!!T,earned:earned,qLevels:qLv,taskLevels:c.levels,
          heldBy:lvl>=LEVEL_MAX?"top":"open",caught:c,
          week:T?T.now+1:1,weeks:T?T.top+1:1,finals:T?T.finals:null,
          inTier:lvl-(tier-1)*TIER_SIZE,tierTop:Math.min(LEVEL_MAX,tier*TIER_SIZE)};
}
/* one line saying why you are not higher up yet */
/* What is left before the next rank, said in the two things you can actually
   go and do about it. Questions carry half a week, so the count is doubled. */
/* what closes the gap to the next level, in the two things you can go and do */
function rankWhy(li){
  if(li.heldBy==="top")return "Level "+LEVEL_MAX+" \u2014 the top of the mountain.";
  const left=1-li.into;
  const qs=Math.ceil(left*Q_PER_LEVEL);
  const w=li.caught.week||{due:0,done:0};
  const owed=Math.max(0,w.due-w.done);
  const bits=["Level "+(li.lvl+1)+": "+qs+" new question"+(qs===1?"":"s")];
  if(owed)bits.push("or clear "+owed+" task"+(owed===1?"":"s"));
  return bits.join(" ");
}
/* five levels a week is the pace the calendar sets */
const PACE_PER_WEEK=LV_FROM_Q+LV_FROM_TASKS;
function paceLevel(){const T=termWeeks();return T?Math.min(LEVEL_MAX,1+T.now*PACE_PER_WEEK):1;}
function rankPace(li){
  if(!li.paced)return "";
  const due=paceLevel();
  if(li.lvl>due+1)return "ahead of pace";
  if(li.lvl<due-1)return "behind pace";
  return "on pace";
}

function syncLatches(){
  const p=S.profile;p.gatesOpen=p.gatesOpen||{};
  let changed=false;
  allGates().forEach(g=>{if(g.earned&&!p.gatesOpen[g.ex.sid]){p.gatesOpen[g.ex.sid]=today();changed=true;}});
  if(!p.lvl65){p.rankMax=1;p.lvl65=true;changed=true;}   // the old 1-13 latch is not a level
  const li=levelInfo(p.xp).lvl;
  if(li>(p.rankMax||1)){p.rankMax=li;changed=true;}
  return changed;
}
function awardMilestones(silent){
  const p=S.profile;p.awarded=p.awarded||{};
  let got=0;
  if(syncLatches())got++;
  const give=(key,xp,name,detail)=>{if(p.awarded[key])return;p.awarded[key]=today();earnXp(xp);got++;
    if(!silent)toast(name,detail,true);};
  allGates().forEach(g=>{
    /* Keyed by the exam, never by its position. The old key was "gate"+index
       into a date-sorted list, so adding an earlier exam shifted every later
       one onto a fresh key and paid it all over again. */
    const id=g.ex.sid||g.ex.id||(g.ex.courseId+"|"+g.ex.title+"|"+g.ex.date);
    if(g.r1)give("r1:"+id,100,"Levels 1\u20132 clear \u2014 "+g.ex.title,"+100 XP. You know the facts cold.");
    if(g.r2)give("r2:"+id,150,"Levels 3\u20134 clear \u2014 "+g.ex.title,"+150 XP. You can use it on a patient.");
    if(g.r3)give("r3:"+id,250,"Level 5 clear \u2014 "+g.ex.title,"+250 XP. The hardest set, done.");
    if(g.practicePassed)give("pt:"+id,200,"Practice test passed","+200 XP \u2014 "+g.ex.title);
    if(g.honours)give("h:"+id,400,"90% first try","+400 XP. That one cannot be earned twice.");
    if(g.open)give("gate:"+id,1500,"Exam gate cleared","+1500 XP \u2014 "+g.ex.title+" is fully behind you.");
  });
  if(got)saveCore();
  return got>0;
}
/* `silent` is for the sweep at boot. Some conditions are satisfied by state
   the app seeded rather than by anything the user just did - the question-bank
   trophy is met the moment the bank loads - and those were sitting unawarded
   until an unrelated action happened to fire this, which showed up as a
   "closest trophy" card with a full progress bar. Award them, don't toast
   them: the user did nothing this second and a toast would say otherwise. */
function checkTrophies(silent){
  /* a new week can open a rank while the app is still open */
  const lv=levelInfo(S.profile.xp).lvl;
  if(lv>(S.profile.rankMax||1))S.profile.rankMax=lv;
  awardMilestones(silent);
  let got=false;
  TROPHIES.forEach(tr=>{
    if(!S.profile.trophies[tr.id]&&tr.t(S.profile,S)){
      S.profile.trophies[tr.id]=today();got=true;
      earnXp(tr.xp||100);
      if(!silent){toast("Trophy \u2014 "+tr.n,"+"+(tr.xp||100)+" XP \u00b7 "+tr.d,true);confetti(70);}
    }
  });
  if(got)saveCore();
}
function addXp(n){S.profile.xp=Math.max(0,(S.profile.xp||0)+n);}
/* ---------------------------------------------------------------------------
   COMMITMENT TIERS
   A goal you typed in yourself is a goal you can retype at 11pm to save a
   streak, which makes the streak worth nothing. So the target is a tier you
   commit to, and a change to it lands at the next day rollover - never in the
   middle of the day it would rescue.

   Everyone runs Standard for their first week. You cannot pick a lane before
   you know how fast you actually go, so on day 8 we show what the first week
   really looked like and let the number make the argument.

   The multiplier is on the daily bonus ONLY. Per-question XP is identical at
   every tier, so nobody is pushed up a tier to keep pace on rank - the tier
   pays for the promise you keep, not for the questions you answer.
--------------------------------------------------------------------------- */
const TIERS=[
 {k:"light",     n:"Light",     g:5,  m:1,    d:"Five a day. A tier you can keep in a bad week."},
 {k:"standard",  n:"Standard",  g:10, m:1.15, d:"Ten a day. About twenty minutes."},
 {k:"intensive", n:"Intensive", g:15, m:1.3,  d:"Fifteen a day. Exam season pace."}];
const TIER_BY={};TIERS.forEach(t=>{TIER_BY[t.k]=t;});
const TIER_DEF="standard";
const PROBATION=7;            // first week is Standard for everyone, no choice
const DAY_XP=50;              // daily target bonus, before the tier multiplier
const WEEK_XP=120;            // weekly target bonus - flat, never multiplied
const SWAP_PRICE=90, SWAP_MAX=2;
const DAYS_KEPT=400;

const tierOf=()=>TIER_BY[S.profile.tier]||TIER_BY[TIER_DEF];
const dayTarget=()=>tierOf().g;
const weekTarget=()=>dayTarget()*7;
const dshift=(iso,n)=>dkey(new Date(parseD(iso).getTime()+n*86400000));
const daysSince=iso=>Math.round((parseD(today())-parseD(iso))/86400000);
const dayRec=d=>(S.profile.days||{})[d];
const dayN=d=>{const r=dayRec(d);return (r&&r.n)||0;};
/* the target is stamped on the day when the day is first worked, so a tier
   change never re-judges a day that is already over */
const dayG=d=>{const r=dayRec(d);return (r&&r.g)||dayTarget();};
const dayHit=d=>{const r=dayRec(d);return !!r&&((r.n||0)>=(r.g||dayTarget())||!!r.swap);};
/* Monday-start weeks, because that is how a semester reads */
const wkStart=iso=>dshift(iso,-((parseD(iso).getDay()+6)%7));
function weekN(iso){const s=wkStart(iso||today());let t=0;for(let i=0;i<7;i++)t+=dayN(dshift(s,i));return t;}
const onProbation=()=>daysSince(S.profile.startDay||today())<PROBATION;
const probationLeft=()=>Math.max(0,PROBATION-daysSince(S.profile.startDay||today()));
function week1Avg(){
  const s=S.profile.startDay||today();let t=0;
  for(let i=0;i<PROBATION;i++)t+=dayN(dshift(s,i));
  return t/PROBATION;
}
function pruneDays(){
  const p=S.profile,keep=dshift(today(),-DAYS_KEPT);
  Object.keys(p.days||{}).forEach(d=>{if(d<keep)delete p.days[d];});
  Object.keys(p.weekPaid||{}).forEach(d=>{if(d<keep)delete p.weekPaid[d];});
}
/* Everyone who was here before the tiers arrived lands on Standard, keeps their
   streak, and keeps whatever they have already done today. */
const TIER_SEED=1;
function migrateTiers(){
  const p=S.profile;
  if(p.tierSeed>=TIER_SEED)return false;
  p.tierSeed=TIER_SEED;
  p.tier=TIER_BY[p.tier]?p.tier:TIER_DEF;
  p.tierNext=null;
  p.swaps=p.swaps||0;p.swapSpent=p.swapSpent||0;
  p.days=p.days||{};p.weekPaid=p.weekPaid||{};
  p.startDay=p.startDay||p.granted||p.lastDay||today();
  if(p.todayDate===today()&&p.todayCount>0&&!p.days[p.todayDate])
    p.days[p.todayDate]={n:p.todayCount,g:TIER_BY[TIER_DEF].g};
  if(!p.lastHit&&p.streak>0)p.lastHit=p.lastDay||today();
  p.rollDay=today();
  delete p.dailyGoal;delete p._goalDone;
  return true;
}
/* The rollover. Walks every day that ended since we last looked: a day that
   missed its target ends the streak, unless it was yesterday and a shift swap
   is on hand. A swap never reaches further back than that - covering a week you
   were away is not what it is for. A pending tier change lands here too. */
function rollDays(){
  const p=S.profile,t=today();
  if(!p.startDay)p.startDay=t;
  if(!TIER_BY[p.tier])p.tier=TIER_DEF;
  p.days=p.days||{};p.weekPaid=p.weekPaid||{};
  if(!p.rollDay){p.rollDay=t;return true;}
  if(p.rollDay>=t)return false;
  let cur=p.rollDay;
  while(cur<t){
    const nx=dshift(cur,1);
    if(!dayHit(cur)&&(p.streak||0)>0){
      if(nx===t&&(p.swaps||0)>0){
        p.swaps--;
        (p.days[cur]=p.days[cur]||{n:0,g:dayG(cur)}).swap=true;
        p.lastHit=cur;
        p.swapNote=cur;
      }else{p.streak=0;p.lastHit=null;}
    }
    cur=nx;
  }
  p.rollDay=t;
  if(p.tierNext&&TIER_BY[p.tierNext]){p.tierLanded=p.tierNext;p.tier=p.tierNext;p.tierNext=null;}
  p.todayDate=t;p.todayCount=dayN(t);
  pruneDays();
  return true;
}
const prettyDay=iso=>{const d=parseD(iso);return MON[d.getMonth()].slice(0,3)+" "+d.getDate();};
/* Called on every render, because a day can turn over while the tab is open. */
function tickDay(){
  if(!rollDays())return;
  const p=S.profile;
  const swap=p.swapNote,landed=p.tierLanded;
  delete p.swapNote;delete p.tierLanded;
  saveCore();
  if(swap)setTimeout(()=>toast("A shift swap was used",
    "You missed "+prettyDay(swap)+", so one of your swaps covered it. Streak intact at "+
    (p.streak||0)+". "+(p.swaps?p.swaps+" left.":"None left."),true),600);
  if(landed)setTimeout(()=>toast("You are on "+TIER_BY[landed].n+" now",
    TIER_BY[landed].g+" questions a day, starting today."),swap?1400:600);
}
function logStudyDay(){
  const t=today();
  S.profile.lastDay=t;
  if(S.profile.todayDate!==t){S.profile.todayDate=t;S.profile.todayCount=dayN(t);}
}
function bumpToday(n){
  const p=S.profile,t=today();
  p.days=p.days||{};p.weekPaid=p.weekPaid||{};
  const rec=p.days[t]||(p.days[t]={n:0,g:dayTarget()});
  if(!rec.g)rec.g=dayTarget();
  const before=rec.n||0, wt=weekTarget(), wk=wkStart(t);
  rec.n=before+n;
  p.todayDate=t;p.todayCount=rec.n;
  if(before<rec.g&&rec.n>=rec.g){
    p.goalHits=(p.goalHits||0)+1;
    p.streak=(p.lastHit===dshift(t,-1)?(p.streak||0)+1:1);
    p.lastHit=t;
    p.longest=Math.max(p.longest||0,p.streak);
    const tr=tierOf(),bonus=Math.round(DAY_XP*tr.m);
    earnXp(bonus);
    toast("Shift complete","+"+bonus+" XP — "+rec.g+" on "+tr.n+
      (tr.m>1?" ("+tr.m+"×)":"")+". Streak: "+p.streak+" day"+(p.streak===1?"":"s")+".",true);
  }
  /* weekPaid is the guard, not the crossing - a week that is already over
     target when we look should still pay, once. */
  if(weekN(t)>=wt&&!p.weekPaid[wk]){
    p.weekPaid[wk]=true;earnXp(WEEK_XP);
    toast("Week cleared","+"+WEEK_XP+" XP — "+wt+" questions this week. A heavy day covers a light one.",true);
  }
}

/* ---------------------------------------------------------------------------
   CONFETTI

   For the moments that deserve it: a trophy, a boss beaten, a perfect round.
   Sixty pieces in the sticker colours, dropped from the top and gone in two
   seconds. Never on an ordinary right answer - a thing that happens every time
   stops being a celebration. */
function confetti(n){
  if(!document.body)return;
  let host=document.getElementById("confHost");
  if(!host){host=document.createElement("div");host.id="confHost";document.body.appendChild(host);}
  const cols=["#FF6B6B","#FFC93C","#4CC9F0","#9B5DE5","#2EC4B6","#FF9F1C","#F15BB5","#9EE493"];
  const N=n||60;let html="";
  for(let i=0;i<N;i++){
    const x=Math.random()*100, d=(0.9+Math.random()*1.3).toFixed(2), dl=(Math.random()*0.5).toFixed(2);
    const w=6+Math.random()*6, h=8+Math.random()*8, r=Math.floor(Math.random()*360);
    html+='<i style="left:'+x.toFixed(1)+'%;width:'+w.toFixed(0)+'px;height:'+h.toFixed(0)+'px;background:'+
      cols[i%cols.length]+';animation-duration:'+d+'s;animation-delay:'+dl+'s;transform:rotate('+r+'deg);'+
      (Math.random()<.3?'border-radius:99px;':'')+'"></i>';
  }
  host.innerHTML=html;
  clearTimeout(host._t);host._t=setTimeout(()=>{host.innerHTML="";},2600);
}
function toast(n,d,gold){
  const el=document.createElement("div");
  el.className="toast"+(gold?" gold":"");
  el.innerHTML='<div class="n">'+esc(n)+'</div><div class="d">'+esc(d)+'</div>';
  const host=$("#toasts");host.appendChild(el);
  while(host.children.length>3)host.firstChild.remove();
  setTimeout(()=>{el.style.transition="opacity .4s, transform .4s";el.style.opacity="0";el.style.transform="translateY(8px)";setTimeout(()=>el.remove(),420);},4200);
}
function modal(title,bodyHtml,footHtml){
  const host=$("#modalHost");
  host.innerHTML='<div class="veil" id="veil"><div class="sheet" role="dialog" aria-modal="true"><header><h3>'+esc(title)+'</h3><button class="btn sm ghost" id="mClose">Close</button></header><div class="bd">'+bodyHtml+'</div>'+(footHtml?'<footer>'+footHtml+'</footer>':'')+'</div></div>';
  $("#mClose").onclick=closeModal;
  $("#veil").addEventListener("mousedown",e=>{if(e.target.id==="veil")closeModal();});
  return host;
}
function closeModal(){$("#modalHost").innerHTML="";}

function renderVitals(){
  const p=S.profile,li=levelInfo(p.xp),g=dayTarget();
  const cnt=dayN(today());
  const pct=Math.min(1,cnt/g),C=2*Math.PI*15;
  const acc=p.answered?Math.round(p.correct/p.answered*100):0;
  $("#vitals").innerHTML=
   '<div class="vital"><div class="rank">'+esc(li.rank)+'</div><div class="l">Level '+li.lvl+'</div></div>'+
   '<div class="xpwrap">'+
     '<div class="mono" style="font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:10px">'+

const evKey=e=>e.sid?("sid:"+e.sid):(e.courseId+"|"+e.title+"|"+e.date);
const courseById=id=>S.courses.find(c=>c.id===id);
const isStudy=c=>c&&c.study!==false;
const studyCourses=()=>S.courses.filter(isStudy);
const courseColor=id=>{const c=courseById(id);return c?c.color:"var(--faint)";};
const courseName=id=>{const c=courseById(id);return c?(c.code||c.name):"General";};
/* Attendance, not a to-do: a class or a scheduled clinical day is somewhere you
   turn up. It gets no tick box and never counts toward what is due. */
const isFyi=e=>!!(e&&(e.fyi||e.type==="Lecture"));
const isFinal=e=>!!(e&&e.type==="Exam"&&/final/i.test(e.title||""));
/* The 25 rows of the nurse builder and what each one is before you touch it.
   Counting the rows that differ is how "you actually designed them" is judged,
   rather than "you opened the panel and pressed Save". */
const AV_DEFAULT={pres:"f",cut:"long",skin:"c",color:"brown",eyes:"brown",eyeshape:"round",
  brow:"",browy:"",cheeks:"",lip:"",neck:"",necklen:"",ears:"",mask:"",cap:"",metal:"gold",
  face:"",nose:"",mouth:"",build:"average",beard:"none",makeup:"none",jewel:"none",
  specs:"none",shield:"",gown:"",fit:"straight",shoes:"runner",shoecol:"white",hcol:"slate",
  nline:"",jacket:"",under:"",socks:"",sockcol:"white",scope:"",penlight:"",
  watch:"",badge:"",hairacc:"",acccol:"teal",bindi:"",bindicol:"red",pose:""};
const AV_ROWS=Object.keys(AV_DEFAULT).length;
let AV_SEED=null;            // the figure the builder dealt, until it is saved
/* Measured against where the student STARTED, not against AV_DEFAULT.
   The builder now deals a random figure on a first open rather than opening on
   a fair-skinned woman, and diffing that deal against AV_DEFAULT counted
   fourteen changes nobody had made - which handed over the "changed 12 things"
   trophy and promised +250 XP for pressing Save on a figure the app drew
   itself. The dealt figure is the baseline; only what they actually touch
   counts. */
function avatarDepth(a){
  if(!a||a.on===false)return 0;
  const base=Object.assign({},AV_DEFAULT,
    AV_SEED||(S.profile&&S.profile.avatarSeed)||{});   // live deal first, then the saved one
  let n=0;
  Object.keys(AV_DEFAULT).forEach(k=>{
    const v=a[k];
    if(v===undefined||v===null)return;
    if(String(v)!==String(base[k]))n++;
  });
  return n;
}
const todoOf=list=>list.filter(e=>!isFyi(e));
function pillSub(e){
  const n=String(e.notes||"").split(/(?<=\.)\s|\u2014/)[0].trim();
  if(n.length<=64)return n;
  const cut=n.slice(0,62);
  const i=Math.max(cut.lastIndexOf(" \u00b7 "),cut.replace(/[\s\u00b7]+$/,"").lastIndexOf(" "));
  return (i>28?cut.slice(0,i):cut).replace(/[\s\u00b7]+$/,"")+"\u2026";
}
/* ---------------------------------------------------------------------------
   Day cells are built as fixed course lanes. Every class keeps the same row
   inside every cell, in the order the courses are listed, so the eye learns
   where to look instead of reading. A class with nothing that day leaves its
   row empty rather than letting the one below slide up.
   Type is a shape, never a color: the course color has to survive.
--------------------------------------------------------------------------- */
const TYPEMARK={Exam:"\u25B2","Med Math":"\u25A0",Quiz:"\u25C6",Clinical:"\u2605",Assignment:"\u25CF",Reading:"\u25CB",Lecture:"\u25CB"};
function markOf(e){return isFyi(e)?"\u25CB":(TYPEMARK[e.type]||"\u25CF");}
function shortTitle(e){
  return String(e.title||"")
    .replace(/^\u2605\s*/,"").replace(/\s*\u2605$/,"")
    .replace(/^(NUR\s*)?\d{3}[A-Z]?\s*[\u2014\-:]?\s*/,"")
    .replace(/\s+(due|due at clinical)\.?$/i,"")
    .replace(/reply to peer (\d)/i,"reply $1")
    .replace(/initial post/i,"post")
    .replace(/^class\s*-\s*/i,"")
    .trim()||String(e.title||"");
}
function laneOrder(){
  const list=calCourse==="all"?S.courses.slice():S.courses.filter(c=>c.id===calCourse);
  return list.sort((a,b)=>String(a.code||a.name).localeCompare(String(b.code||b.name),undefined,{numeric:true}));
}
function laneItem(e,detail){
  const st=(e.done?"done":"")+(isFyi(e)?" fyi":"");
  return '<span class="li '+st+'" data-lev="'+e.id+'" title="'+esc(e.title)+'">'+
    '<b class="mk">'+markOf(e)+'</b>'+(detail?'<span class="tx">'+esc(shortTitle(e))+'</span>':'')+'</span>';
}
function cellLanes(evs,detail){
  if(!evs.length)return "";
  const order=laneOrder();
  const rows=order.map(c=>({c:c,list:evs.filter(e=>e.courseId===c.id)}));
  let last=-1;rows.forEach((r,i)=>{if(r.list.length)last=i;});
  const orphan=evs.filter(e=>!order.some(c=>c.id===e.courseId));
  let out='<span class="lanes">';
  rows.slice(0,last+1).forEach(r=>{
    if(!r.list.length){out+='<span class="lane hole"></span>';return;}
    const code=String(r.c.code||r.c.name||"").replace(/^NUR\s*/,"");
    const left=todoOf(r.list).filter(e=>!e.done).length;
    // an exam / quiz / clinical / one-off is worth its name even in the compact view
    const hero=r.list.find(e=>e.type==="Exam")||r.list.find(e=>e.type==="Med Math")||
               r.list.find(e=>e.type==="Quiz")||r.list.find(e=>e.type==="Clinical")||
               r.list.find(e=>e.type==="Assignment"&&!/ DQ \d/.test(e.title));
    const shown=detail?r.list:(hero?[hero]:r.list);
    out+='<span class="lane'+(left?"":" clear")+'" style="--lc:'+r.c.color+'">'+
      '<span class="tag">'+esc(code)+'</span>'+
      '<span class="lit">'+shown.map(e=>laneItem(e,detail||!!hero)).join("")+
      (!detail&&hero&&r.list.length>1?'<span class="li xtra">+'+(r.list.length-1)+'</span>':'')+
      '</span></span>';
  });
  orphan.forEach(e=>{out+='<span class="lane" style="--lc:var(--faint)"><span class="tag">?</span>'+
    '<span class="lit">'+laneItem(e,true)+'</span></span>';});
  return out+'</span>';
}
function dotsRow(list){
  if(!list.length)return "";
  const todo=todoOf(list), left=todo.filter(e=>!e.done).length;
  const shown=list.slice(0,7);
  return '<span class="dots">'+
    shown.map(e=>'<i class="'+(e.done?"off":"")+'" style="background:'+courseColor(e.courseId)+'"></i>').join("")+
    (list.length>shown.length?'<i class="more"></i>':'')+
    (todo.length?'<b>'+(left?left+" due":"all done")+'</b>':'')+'</span>';
}
function pillHtml(e){
  const t=(e.type||"").toLowerCase();
  const cls="pill"+(t==="exam"?" exam":t==="med math"?" medmath":t==="quiz"?" quiz":t==="clinical"?" clinical":"");
  const sub=pillSub(e);
  return '<span class="'+cls+'" style="--lc:'+courseColor(e.courseId)+';'+(e.done?"opacity:.45;text-decoration:line-through;":"")+'" title="'+esc(e.title)+'">'+
    '<span class="lbl">'+esc(e.title)+'</span>'+(sub?'<span class="sub">'+esc(courseName(e.courseId))+' \u00b7 '+esc(sub)+'</span>':'')+'</span>';
}
const typeLabel=e=>e&&e.type==="Quiz"?"Dynamic quiz":(e?e.type:"");
function dueChip(ev){
  if(ev.done)return '<span class="due done">done</span>';
  const n=dayDiff(ev.date);
  const days=k=>Math.abs(k)+" day"+(Math.abs(k)===1?"":"s");
  /* A clinical day or a lecture is somewhere you were, not something you owe.
     One in the past has been and gone - calling it "late" is telling a student
     they missed a deadline that never existed. Only work you hand in can be
     late. */
  if(isFyi(ev))return n<0?'<span class="due past">'+days(n)+' ago</span>'
    :n===0?'<span class="due now">today</span>'
    :'<span class="due far">in '+days(n)+'</span>';
  if(n<0)return '<span class="due over">'+days(n)+' late</span>';
  if(n===0)return '<span class="due now">today</span>';
  if(n===1)return '<span class="due now">tomorrow</span>';
  if(n<=7)return '<span class="due soon">'+n+' days</span>';
  return '<span class="due far">'+n+' days</span>';
}
/* follows the course tab, so the month summary, Next up and the study plan
   all narrow to the class you picked */
function calEvents(){return calCourse==="all"?S.events:S.events.filter(e=>e.courseId===calCourse);}
function upcoming(limit){
  return todoOf(calEvents().slice()).filter(e=>!e.done||dayDiff(e.date)>=0)
    .sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title))
    .filter(e=>dayDiff(e.date)>=-21).slice(0,limit||14);
}
/* Six recurring posts a week across 305 and 314 buried everything that
   mattered - the 9/22 exam was pushed clean off a twelve-row list. These fold
   one week of one course's discussion work into a single row. */
const DQ_RE=/DQ\s+(\d+)/i;
function dqOf(e){
  if(!e||!DQ_RE.test(e.title||""))return null;
  const wk=+DQ_RE.exec(e.title)[1];
  const m=/reply to peer\s*(\d+)/i.exec(e.title||"");
  return {wk:wk, part:m?+m[1]:0};          // 0 = the initial post
}
const MILESTONE=e=>e&&(e.type==="Exam"||e.type==="Med Math"||e.type==="Quiz");
function milestones(n){
  return calEvents().filter(e=>!e.done&&MILESTONE(e)&&dayDiff(e.date)>=0)
    .sort((a,b)=>a.date.localeCompare(b.date)).slice(0,n||4);
}
/* Everything that is not a milestone, with each course-week of discussion work
   collapsed into one entry. Returns rows of {k:"dq"|"ev"}. */
function upcomingGroups(limit){
  const raw=todoOf(calEvents().slice())
    .filter(e=>!MILESTONE(e))
    .filter(e=>!e.done&&dayDiff(e.date)>=-21)
    .sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title));
  const rows=[],seen={};
  raw.forEach(e=>{
    const d=dqOf(e);
    if(!d){rows.push({k:"ev",e:e,date:e.date});return;}
    const key=e.courseId+"|"+d.wk;
    if(seen[key]){seen[key].items.push(e);return;}
    const g={k:"dq",cid:e.courseId,wk:d.wk,items:[e],date:e.date};
    seen[key]=g;rows.push(g);
  });
  // a group's own parts may be spread over the week - sort them, post first
  rows.forEach(g=>{if(g.k==="dq")g.items.sort((a,b)=>(dqOf(a).part-dqOf(b).part));});
  return rows.slice(0,limit||6);
}
function dqRow(g){
  const parts=g.items, all=S.events.filter(e=>e.courseId===g.cid&&(dqOf(e)||{}).wk===g.wk);
  const done=all.filter(e=>e.done).length;
  const next=parts.find(e=>!e.done)||parts[0];
  const label=e=>{const d=dqOf(e);return d&&d.part?("R"+d.part):"Post";};
  return '<div class="ev dqrow"><span class="stripe" style="background:'+courseColor(g.cid)+'"></span>'+
    '<div class="body"><div class="t">'+esc(courseName(g.cid))+' &middot; Week '+g.wk+' discussion</div>'+
    '<div class="m"><span>'+done+' of '+all.length+' done</span><span>&middot;</span>'+
    '<span>post + '+(all.length-1)+' replies</span></div>'+
    '<div class="dqparts">'+all.map(e=>
      '<label class="dqp'+(e.done?" on":"")+'"><input type="checkbox" data-wk="'+e.id+'" data-key="'+esc(evKey(e))+'"'+
      (e.done?" checked":"")+' aria-label="'+esc(e.title)+'">'+label(e)+'</label>').join("")+'</div></div>'+
    dueChip(next)+'</div>';
}
function studyPlan(){
  const out=[];
  calEvents().filter(e=>!e.done&&(e.type==="Exam"||e.type==="Med Math"||e.type==="Quiz")).forEach(e=>{
    (e.type==="Exam"?[7,3,1]:e.type==="Med Math"?[3,1]:[2]).forEach(off=>{
      const d=new Date(parseD(e.date).getTime()-off*86400000),k=dkey(d);
      if(dayDiff(k)>=0&&dayDiff(k)<=14)out.push({date:k,off:off,ev:e});
    });
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);
}

/* ============================ ICS export ============================ */
function icsDate(iso){return iso.replace(/-/g,"");}
function buildIcs(){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Trophos//EN","CALSCALE:GREGORIAN"];
  const push=(uidv,date,summary,desc,alarmDays)=>{
    const d=parseD(date),end=dkey(new Date(d.getTime()+86400000));
    L.push("BEGIN:VEVENT","UID:"+uidv+"@charge-nurse","DTSTAMP:"+icsDate(today())+"T090000Z",
      "DTSTART;VALUE=DATE:"+icsDate(date),"DTEND;VALUE=DATE:"+icsDate(end),
      "SUMMARY:"+summary.replace(/[,;]/g," "),"DESCRIPTION:"+String(desc||"").replace(/[,;]/g," ").replace(/\n/g," "),
      "BEGIN:VALARM","TRIGGER:-P"+alarmDays+"D","ACTION:DISPLAY","DESCRIPTION:"+summary.replace(/[,;]/g," "),"END:VALARM","END:VEVENT");
  };
  S.events.forEach(e=>push(e.id,e.date,"["+courseName(e.courseId)+"] "+e.type+": "+e.title,e.notes,1));
  studyPlan().forEach((b,i)=>push("plan"+i+b.date,b.date,"Study block — "+courseName(b.ev.courseId)+" ("+b.off+"d to "+b.ev.title+")","Suggested study session",0));
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
async function exportIcs(){
  const data=buildIcs();
  if(DL){
    try{await DL.save({filename:"charge-nurse.ics",data:data});toast("Calendar file saved","Open it once and everything lands in your phone's calendar with alerts.");return;}

/* A number that lands rather than appears. Only on first paint of an element -
   re-running it on every render would make the page twitch every time you tick
   a box. Marked done on the node so a re-render leaves settled numbers alone. */
function countUp(root){
  if(REDUCED)return;
  (root||document).querySelectorAll("[data-count]").forEach(el=>{
    if(el.dataset.counted)return;
    el.dataset.counted="1";
    const to=+el.dataset.count; if(!isFinite(to)||to<=0)return;
    const dur=to<10?420:700, t0=performance.now();
    const step=now=>{
      const k=Math.min(1,(now-t0)/dur);
      const e=1-Math.pow(1-k,3);                 // ease-out, so it settles
      el.textContent=String(Math.round(to*e));
      if(k<1)requestAnimationFrame(step);
    };
    el.textContent="0";requestAnimationFrame(step);
  });
}

/* ---------------------------------------------------------------------------

              Free items only. It occupies the slot labelled yours, so dressing
              it in things you cannot pick would be a bait.
     "owned"  the builder's Random button. Everything you have actually bought,
              because that is most of the point of owning it.
     "any"    the shift behind you. Ignores the locker entirely - these are other
              people, and seeing the gown and the rainbow hair on someone else is
              exactly the reason to go and buy them.

   "any" also leans on the items that still read at a third of the size and a
   third of the opacity: hair, hijabs, gowns, jackets, pants, shoes. Earrings and

  };

    /* spikes read as a crown of horns once the figure is small and dim */

      .filter(c=>!(bold&&c==="spike")&&cutOK(c,toneOf(skin))),DEFAULT_CUT[pres]),
    color:pick("c",HAIRS_NATURAL,"brown"),

    eyes:rnd(deep?EYES_DEEP:EYES_NATURAL),
    eyeshape:rnd(EYESHAPES_KIND),
    face:rnd(FACES_ALL), nose:rnd(NOSES_ALL), mouth:rnd(MOUTHS_ALL),

    makeup:chance(0.3)?rnd(["liner","lashes","smoky"]):"none",
    pose:chance(0.3)?"pockets":""};

  maybe("sk","socks",[""].concat(Object.keys(SOCKPAT)),0.3);
  if(a.socks)a.sockcol=rnd(Object.keys(SOCKS));
  maybe("nl2","nline",["","v","mock","notch","henley"],0.4);
  maybe("un","under",["","white","black","navy","grey","teal"],0.28);
  maybe("jk","jacket",["","white"],0.2);
  maybe("gw","gown",["","on"],0.07);
  maybe("st","scope",[""].concat(Object.keys(SCOPES)),0.4);
  maybe("ha","hairacc",[""].concat(Object.keys(HAIRACC)),0.25);
  if(a.hairacc)a.acccol=rnd(Object.keys(ACCCOL));
  // detail that only reads up close, so the crowd mostly skips it
  maybe("j","jewel",["none","stud","pearl","hoop","drop","pearldrop","butterfly"],bold?0.18:0.35);
  maybe("mt","metal",["gold","silver"],0.5);
  maybe("g","specs",bold?SPECS_KIND:["none","round","rect","thin","cat","heart","star"],bold?0.22:0.3);
  maybe("wa","watch",["","wrist","fob"],bold?0.15:0.3);
  maybe("id","badge",["","on"],bold?0.2:0.3);
  maybe("pl","penlight",["","on"],bold?0.1:0.25);
  if(!bold){
    maybe("mk","mask",["","surgical","n95"],0.15);
    maybe("sh","shield",["","on"],0.07);

}
/* The shift is mostly in plain scrubs. A few people have one nice thing on, and
   that is what makes it worth wanting - a whole row of nurses in gowns and
   coloured clogs is a uniform, not an aspiration. Roughly a third wear nothing
   from the locker at all. */
const FLAIR_ROWS=["ft","sn","sc","st","gw","jk","sk","g","j","ha","un","id","h"];
function addFlair(a){
  const roll=Math.random();
  const n=roll<0.34?0:roll<0.70?1:roll<0.90?2:3;
  if(!n)return;
  const rows=FLAIR_ROWS.slice();
  if(a.cap==="hijab")rows.push("hc");
  for(let k=0;k<n&&rows.length;k++){
    const row=rows.splice(Math.floor(Math.random()*rows.length),1)[0];
    let vals=Object.keys(LOCKS[row]||{});
    if(row==="h")vals=vals.filter(v=>v!=="spike"&&cutOK(v,toneOf(a.skin))&&
      (CUTS[a.pres]||CUTS.f).some(c=>c[0]===v));
    if(row==="g")vals=vals.filter(v=>v!=="heart"&&v!=="star");
    if(!vals.length){k--;continue;}
    a[ROWFIELD[row]]=rnd(vals);

let CROWD=null;

/* Eight full-body SVGs is a quarter of a megabyte of markup, and none of it

let CROWD_HTML=null, CROWD_N=0;
function crowdRow(){
  const w=(typeof window!=="undefined"&&window.innerWidth)||900;
  const n=w<430?4:w<640?6:8;                       // always even, so nobody stands dead centre
  if(CROWD_HTML&&CROWD_N===n)return CROWD_HTML;
  const all=crowdAvatars();
  let out='';
  for(let i=0;i<n;i++){
    const t=((i-(n-1)/2)/((n-1)/2));                // -1 .. 1
    const d=Math.abs(t);                            // 0 at the middle = furthest back
    const sc=(0.50+0.26*d).toFixed(3);              // small in the distance
    /* push the innermost pair outward - on a linear spread they stand directly
       behind the hero and are never seen at all */
    const push=Math.sign(t)*(0.26+0.74*d);
    const left=(50+push*(w<430?30:34)).toFixed(1);
    const bottom=Math.round(30-20*d);               // further back sits higher
    const op=(0.50+0.18*d).toFixed(2);
    out+='<span class="cw" aria-hidden="true" style="--sc:'+sc+';left:'+left+'%;bottom:'+bottom+'px;'+
      'opacity:'+op+';z-index:'+Math.round(d*10)+';transform:translateX(-50%) scale('+sc+');'+
      'animation-delay:'+(60*i)+'ms">'+nurseAvatar(1,150,all[i],true)+'</span>';
  }

  return (CROWD_HTML='<div class="crowd">'+out+'</div>');
}

const owns=id=>!!(S.profile.bought||{})[id];
const lockOf=(row,val)=>{const m=LOCKS[row],id=m&&m[val];return (id&&!owns(id))?id:null;};
function dollarsEarned(){

/* ---------------------------------------------------------------------------
   SEMESTER MAP
   The whole term on one sheet, in two readings of the same data.

   Lanes  - one horizontal row per class across every week of the term, so you
            can see at a glance which class is heavy when, and which weeks light
            all four rows up at once.
   Heat   - one square per day, weekday down, week across. No titles, no color
            coding by class: just where the weight sits.
   Both are built from the same week grid, so the columns line up top to bottom.
--------------------------------------------------------------------------- */
function termBounds(){
  const ds=S.events.map(e=>e.date).filter(Boolean).sort();
  if(!ds.length)return null;
  const a=parseD(ds[0]),b=parseD(ds[ds.length-1]);
  a.setDate(a.getDate()-a.getDay());            // back to the Sunday
  b.setDate(b.getDate()+(6-b.getDay()));        // on to the Saturday
  const weeks=Math.round((b-a)/604800000)+1;
  return {start:a,end:b,weeks:weeks};
}
const weekStart=(t,i)=>{const d=new Date(t.start);d.setDate(d.getDate()+i*7);return d;};
const niceDate=iso=>{const d=parseD(iso);return MON[d.getMonth()].slice(0,3)+" "+d.getDate();};
function monthSpans(t){
  const out=[];
  for(let i=0;i<t.weeks;i++){
    const d=weekStart(t,i),m=d.getMonth();
    const last=out[out.length-1];
    if(last&&last.m===m)last.n++;
    else out.push({m:m,y:d.getFullYear(),n:1});
  }
  return out;
}
/* One column per DAY, not per week. Position on the strip is the date, so a
   mark needs no label: the eye reads "third week of October, Tuesday" straight
   off the grid. Exams and quizzes are full-height bars, everything else is a
   dot, so the shape of the term survives at any size. Hovering names an item,
   clicking opens that day. */
function semLanes(t){
  const courses=laneOrder();
  const months=monthSpans(t);
  const days=t.weeks*7, tod=today();
  let h='<div class="tl" style="--n:'+days+'">'+
    '<div class="tlc tlcorner"></div>'+
    months.map(m=>'<div class="tlm" style="grid-column:span '+(m.n*7)+'">'+MON[m.m].slice(0,3)+'</div>').join("")+
    '<div class="tlc tlcorner2"></div>';
  for(let i=0;i<t.weeks;i++){
    const d=weekStart(t,i),e=new Date(d);e.setDate(e.getDate()+6);
    const now=tod>=dkey(d)&&tod<=dkey(e);
    h+='<div class="tlw'+(now?" now":"")+'" style="grid-column:span 7">'+
       (now?'now':MON[d.getMonth()].slice(0,3)+' '+d.getDate())+'</div>';
  }
  courses.forEach(c=>{
    const mine={};
    S.events.forEach(x=>{if(x.courseId===c.id)(mine[x.date]=mine[x.date]||[]).push(x);});
    const all=S.events.filter(x=>x.courseId===c.id);
    const left=todoOf(all).filter(x=>!x.done).length;
    h+='<div class="tlc lab" style="--lc:'+c.color+'"><b>'+esc(String(c.code||c.name).replace(/^NUR\s*/,""))+'</b>'+
       '<i>'+(left?left+" left":"clear")+'</i></div>';
    const capEnd=[-999,-999,-999];           // rightmost column each caption line reaches
    for(let i=0;i<days;i++){
      const d=new Date(t.start);d.setDate(d.getDate()+i);
      const iso=dkey(d),list=mine[iso];
      let k="dc";
      if(d.getDay()===6)k+=" satx";
      if(iso===tod)k+=" now";
      if(!list){h+='<div class="'+k+'"></div>';continue;}
      const rank=e=>e.type==="Exam"?6:e.type==="Med Math"?5:e.type==="Clinical"?4:
        e.type==="Quiz"?3:isFyi(e)?0:(/ DQ \d/.test(e.title)?1:2);
      const top=list.slice().sort((a,b)=>rank(b)-rank(a))[0];
      const r=rank(top);
      const shape=r===6?("bar exam"+(isFinal(top)?" fin":"")):r===5?"bar mm":r===4?"bar clin":r===3?"bar quiz":r===2?"pip":r===1?"dot":"tick";
      const done=todoOf(list).length&&todoOf(list).every(x=>x.done);
      const names=list.map(x=>"• "+x.title).join("\n");
      let cap="";
      if(r>=4||r===2){
        cap=shortTitle(top).split(/\s+[\u2014-]\s+/)[0].replace(/\s*\(.*$/,"").trim();
        if(cap.length>20){                      // trim on a word, never mid-word
          const c=cap.slice(0,20), sp=c.lastIndexOf(" ");
          cap=(sp>6?c.slice(0,sp):c).trim();
        }
      }
      let ucls="";
      if(cap){
        // a caption is centred on its own column and runs about 0.62 day-columns
        // per character, so it occupies i +/- half its width. Take the first of
        // three lines whose last caption has already ended, rather than letting
        // two of them print over each other.
        const half=cap.length*0.45+1.6;  // mono width at zoom 1, plus a gap so two
                                         // neighbours never read as one string
        let row=capEnd.findIndex(x=>i-half>x);
        if(row<0)row=0;                          // three deep and still clashing
        capEnd[row]=i+half;
        ucls="r"+(row+1);
        if(i<9)ucls+=" lft"; else if(i>days-9)ucls+=" rgt";
      }
      h+='<div class="'+k+' has" data-sday="'+iso+'" role="button" tabindex="0" style="--lc:'+c.color+'"'+
         ' title="'+esc(MON[d.getMonth()].slice(0,3)+" "+d.getDate()+"\n"+names)+'">'+
         '<i class="'+shape+(done?" off":"")+'"></i>'+
         (cap?'<u class="'+ucls+'">'+esc(cap)+'</u>':'')+'</div>';
    }
  });
  return h+'</div>';
}
/* The heat map asked you to decode a color ramp on a weekday-by-week grid
   before it told you anything. This says the same thing in one reading: how
   many things week N holds, split by class, on the same week columns as the
   lanes directly above, so the two line up. */
function semWeeks(t){
  const courses=laneOrder();
  const days=t.weeks*7;
  const wks=[];let max=1;
  for(let i=0;i<t.weeks;i++){
    const sd=weekStart(t,i),ed=new Date(sd);ed.setDate(ed.getDate()+6);
    const a=dkey(sd),b=dkey(ed);
    const seg=courses.map(c=>({c:c,n:todoOf(S.events.filter(x=>x.courseId===c.id&&x.date>=a&&x.date<=b)).length}))
                     .filter(x=>x.n);
    const n=seg.reduce((q,x)=>q+x.n,0);
    const hot=S.events.filter(x=>x.date>=a&&x.date<=b)
      .filter(x=>x.type==="Exam"||x.type==="Med Math");
    if(n>max)max=n;
    wks.push({a:a,b:b,sd:sd,seg:seg,n:n,hot:hot,now:today()>=a&&today()<=b});
  }
  let h='<div class="wk" style="--n:'+days+'">'+
    '<div class="tlc lab wklab"><b>per week</b><i>max '+max+'</i></div>';
  wks.forEach(w=>{
    const tip=MON[w.sd.getMonth()].slice(0,3)+" "+w.sd.getDate()+"\n"+
      (w.n?w.n+" to-do"+(w.n>1?"s":""):"nothing due")+
      (w.seg.length?"\n"+w.seg.map(x=>"  "+String(x.c.code||x.c.name).replace(/^NUR\s*/,"")+"  "+x.n).join("\n"):"")+
      (w.hot.length?"\n"+w.hot.map(x=>"  ! "+x.title).join("\n"):"");
    h+='<div class="wkc'+(w.now?" now":"")+'" style="grid-column:span 7" title="'+esc(tip)+'">'+
       '<span class="wkx">'+(w.hot.length?(w.hot.some(x=>x.type==="Exam")?"\u25B2":"\u25A0"):"")+'</span>'+
       '<span class="wkn">'+(w.n||"")+'</span>'+
       '<span class="wkp"><span class="wkb" style="height:'+Math.round(w.n/max*100)+'%">'+
         w.seg.map(x=>'<i style="background:'+x.c.color+';flex:'+x.n+'"></i>').join("")+
       '</span></span></div>';
  });
  return h+'</div>';
}
function fitZoom(){
  const t=termBounds();if(!t)return 1;
  const w=(window.innerWidth||1200)-34;                 // the sheet's own padding
  const z=(w-58)/(t.weeks*7*8);                         // label column + one column per day
  return Math.max(0.6,Math.min(1.6,Math.round(z*20)/20));
}

   program it has a second answer nobody shows you: the weighted EXAM average
   has to clear 77 on its own before any other assignment counts at all. A
   normal calculator averages everything together and can read a comfortable 85
   while the exam average sits at 74 and the course is already lost.

   So every course carries an optional gate, and the app always reports whichever
   constraint binds - never the friendlier of the two.
--------------------------------------------------------------------------- */
const GRADE_SCALE=[{g:"A",m:93},{g:"A-",m:90},{g:"B+",m:87},{g:"B",m:83},{g:"B-",m:80},
 {g:"C+",m:77},{g:"C",m:73},{g:"C-",m:70},{g:"D+",m:67},{g:"D",m:60},{g:"F",m:0}];
const letterFor=p=>{const r=GRADE_SCALE.find(x=>p>=x.m);return r?r.g:"F";};
const cutFor=g=>{const r=GRADE_SCALE.find(x=>x.g===g);return r?r.m:null;};
/* Straight off each syllabus. Defaults, not gospel - every row is editable, and
   a course with no seed starts empty so anyone can build their own. */
const GRADE_SEED_V=5;      // bump to reword the seeded rows without losing scores
const GRADE_SEED={
 "NUR 308T":{pass:77,gate:{cat:"exam",min:77,n:"exam average"},
   src:"NUR 308 Fall 26 syllabus",items:[
   {n:"Exam 1",w:25,cat:"exam"},{n:"Exam 2",w:25,cat:"exam"},{n:"Exam 3",w:25,cat:"exam"},
   {n:"Final Exam",w:15,cat:"exam"},
   {n:"Quizzes",w:10,cat:"other",pn:10,h:"ten at 1% each \u2014 enter them one by one"}]},
 "NUR 314":{pass:77,gate:{cat:"exam",min:77,n:"exam average"},restructure:5,
   src:"Brightspace gradebook",items:[
   {n:"Exam 1 \u00b7 9/22",w:15,cat:"exam",max:100},
   {n:"Exam 2 \u00b7 10/20",w:15,cat:"exam",max:100},
   {n:"Exam 3 \u00b7 11/17",w:15,cat:"exam",max:100},
   {n:"Exam 4 \u00b7 12/15",w:15,cat:"exam",max:100},
   {n:"Prep U case studies",w:10,cat:"other",pn:4,pmax:100,multi:1,
     h:"four, 2.5% each, each marked out of 100"},
   {n:"Discussion posts",w:30,cat:"other",pn:14,pmax:100,multi:1,
     h:"fourteen, 2.14% each, each marked out of 100"}]},
 "NUR 305":{pass:77,gate:null,src:"Brightspace gradebook",restructure:5,items:[
   {n:"Educational assessment",w:20,cat:"other",max:20,h:"one assignment, marked out of 20"},
   {n:"Patient education assignment",w:25,cat:"other",max:25,h:"marked out of 25"},
   {n:"Group PowerPoint presentation",w:25,cat:"other",max:25,h:"marked out of 25"},
   {n:"Discussion",w:30,cat:"other",pn:14,pmax:20,multi:1,
     h:"fourteen items, each marked out of 20 \u2014 weeks 1\u201312 plus two PowerPoint weeks"}]}};
function gradebooks(){
  const p=S.profile;p.grades=p.grades||{};let made=false;
  S.courses.forEach(c=>{
    const seed=GRADE_SEED[c.code];
    if(!p.grades[c.id]&&seed){
      p.grades[c.id]={target:null,pass:seed.pass,gate:seed.gate?Object.assign({},seed.gate):null,
        src:seed.src,seedV:GRADE_SEED_V,
        items:seed.items.map(i=>Object.assign({id:uid(),h:""},i,
          {s:null,pv:i.pn?new Array(i.pn).fill(null):undefined}))};
      made=true;
    }
  });
  // reword seeded rows in place when the seed changes, keeping every score
  S.courses.forEach(c=>{
    const seed=GRADE_SEED[c.code],gb=p.grades[c.id];
    if(!seed||!gb||gb.seedV>=GRADE_SEED_V)return;
    if(seed.restructure&&(gb.seedV||0)<seed.restructure){
      // weights, counts and point scales all moved - relabelling in place would
      // silently reinterpret any number already typed, so rebuild the rows
      gb.items=seed.items.map(i=>Object.assign({id:uid(),h:""},i,
        {s:null,pv:i.pn?new Array(i.pn).fill(null):undefined}));
      gb.src=seed.src;gb.seedV=GRADE_SEED_V;made=true;return;
    }
    if(gb.items.length===seed.items.length){
      gb.items.forEach((it,i)=>{
        const sd=seed.items[i];
        it.n=sd.n;it.h=sd.h||"";it.w=sd.w;it.cat=sd.cat;
        it.multi=sd.multi||0;
        if(sd.max)it.max=sd.max; else delete it.max;
        if(sd.pmax)it.pmax=sd.pmax; else delete it.pmax;
        if(sd.pn){it.pn=sd.pn;if(!Array.isArray(it.pv))it.pv=new Array(sd.pn).fill(null);}
        else if(!sd.multi){delete it.pn;delete it.pv;}
      });
      if(seed.gate&&gb.gate)gb.gate.n=seed.gate.n;
    }
    gb.seedV=GRADE_SEED_V;made=true;
  });
  if(made)saveCore();      // item ids must be stable across renders
  return p.grades;
}
const gbOf=cid=>(S.profile.grades||{})[cid]||null;
/* A row is either one number you type, or a set of parts - ten 1% quizzes, say -
   that the app averages for you. Asking a student to average ten quizzes by hand
   and then type the result is asking them to do the calculator's job, and it is
   where a wrong number gets in. Parts win over the typed number whenever any
   part has been entered; the average is over the parts TAKEN so far, not over
   all of them, so three 100s reads as 100 and not as 30. */
const partsOf=i=>Array.isArray(i.pv)?i.pv:null;
const partsIn=i=>{const pv=partsOf(i);return pv?pv.filter(x=>x!==null&&x!==undefined&&x!==""):[];};
/* Brightspace grades most things out of raw points, not percent - 18 out of 20.
   Making the student convert is the same trap that let a 10 land in a percent
   box, so a row can declare what it is marked out of and take the raw number. */
const maxOf=i=>i.max||100;
const pmaxOf=i=>i.pmax||100;
function partAvg(i){
  const v=partsIn(i).map(Number);
  return v.length?v.reduce((a,b)=>a+b,0)/(v.length*pmaxOf(i))*100:null;
}
function scoreOf(i){
  const a=partAvg(i);if(a!==null)return a;
  if(i.s===null||i.s===undefined||i.s==="")return null;
  return (+i.s)/maxOf(i)*100;
}
const hasScore=i=>scoreOf(i)!==null;
/* ---------------------------------------------------------------------------
   HOW MUCH OF A ROW HAS ACTUALLY BEEN DECIDED

   A row split into fourteen discussion posts is fourteen separate slots, each
   worth a fourteenth of that row's weight. Entering one of them settles one
   fourteenth - not the whole row.

   The old code banked the entire weight the moment any part was typed, and it
   was badly wrong in both directions. Type a 0 for one missed post out of
   fourteen and the app moved all 30 points of that row into "graded at 0%",
   which made the ceiling 70 and reported an untouched course as already lost.
   Type four exams, one Prep U and one post and leftW hit zero, so the app
   announced the semester settled with thirteen posts still to come.

   Weight now moves in slot-sized pieces, which is the only way the two numbers
   can mean what they say. */
const partsN=i=>{const pv=partsOf(i);return pv?Math.max(pv.length,i.pn||0):0;};
function itemSplit(i){
  const n=partsN(i), w=+i.w||0;
  if(n>0){
    const v=partsIn(i).map(Number), k=v.length;
    if(!k)return {pts:0,doneW:0,leftW:w,slots:n,slotsDone:0,any:false};
    const avg=v.reduce((a,b)=>a+b,0)/(k*pmaxOf(i))*100;
    const dW=w*k/n;
    return {pts:dW*avg/100,doneW:dW,leftW:w-dW,slots:n,slotsDone:k,any:true};
  }
  const sc=scoreOf(i);
  return sc===null?{pts:0,doneW:0,leftW:w,slots:1,slotsDone:0,any:false}
                  :{pts:w*sc/100,doneW:w,leftW:0,slots:1,slotsDone:1,any:true};
}
function rollUp(items){
  return items.reduce((a,i)=>{const x=itemSplit(i);
    a.pts+=x.pts;a.doneW+=x.doneW;a.leftW+=x.leftW;
    a.slots+=x.slots;a.slotsDone+=x.slotsDone;if(x.any)a.any++;
    return a;},{pts:0,doneW:0,leftW:0,slots:0,slotsDone:0,any:0});
}
/* Every number the two questions need, in one pass. Percentages are course
   points: an item worth w with score s contributes w*s/100. */
function gradeCalc(cid){
  const gb=gbOf(cid);if(!gb||!gb.items.length)return null;
  const it=gb.items, W=it.reduce((a,i)=>a+(+i.w||0),0);
  if(!(W>0))return null;               // a gradebook with no weight anywhere says nothing
  const r=rollUp(it);
  const o={W:W,doneW:r.doneW,leftW:r.leftW,scored:r.slotsDone,total:r.slots,
    rows:it.length,rowsAny:r.any,
    current:r.doneW>0?r.pts/r.doneW*100:null,   // grade on the work that has come back
    floor:r.pts/W*100,                          // if everything left were a zero
    ceiling:(r.pts+r.leftW)/W*100,              // if everything left were perfect
    pts:r.pts,gate:null};
  if(gb.gate){
    const ex=it.filter(i=>i.cat===gb.gate.cat);
    const exW=ex.reduce((a,i)=>a+(+i.w||0),0);
    if(exW>0){
      const e=rollUp(ex);
      o.gate={min:gb.gate.min,label:gb.gate.n,W:exW,leftW:e.leftW,
        scored:e.slotsDone,count:e.slots,
        current:e.doneW>0?e.pts/e.doneW*100:null,
        final:(e.pts+e.leftW)/exW*100,             // best still possible
        settled:e.leftW<=1e-9,
        need:e.leftW>1e-9?(gb.gate.min*exW/100-e.pts)*100/e.leftW:null};
      o.gate.met=o.gate.settled?(e.pts/exW*100)>=gb.gate.min-1e-9:null;
      o.gate.lost=o.gate.final<gb.gate.min-1e-9;
    }
  }
  return o;
}
/* TWO requirements, and they are NOT comparable. The exam gate is an average
   over the exams alone; the course grade is an average over everything still
   outstanding. Those are different denominators, so taking the larger of the
   two numbers is meaningless - an earlier version did exactly that and reported
   nonsense. Both are returned, each labelled with what it is an average OF, and
   both have to be satisfied: clearing the gate does not pass the course, and
   passing on paper does not clear the gate.

   The third number is the useful one: land the remaining exams exactly on the
   gate minimum, and this is what the non-exam work then has to average. */
function gradeNeed(cid,target){
  const gb=gbOf(cid),c=gradeCalc(cid);if(!gb||!c)return null;
  const t=target!=null?target:(gb.target!=null?gb.target:gb.pass);
  const pass=gb.pass||77;
  const over=(x,lw,pts,W)=>lw>0?(x*W/100-pts)*100/lw:null;
  const course={
    target:t,pass:pass,
    need:over(t,c.leftW,c.pts,c.W),
    passNeed:over(pass,c.leftW,c.pts,c.W),
    current:c.current,ceiling:c.ceiling,floor:c.floor,leftW:c.leftW,
    settled:c.leftW===0,
    lost:c.ceiling<t-1e-9,
    passLost:c.ceiling<pass-1e-9,
    secured:c.floor>=t-1e-9};
  const gate=c.gate?Object.assign({},c.gate):null;
  /* The "or" line: land the remaining exams exactly on the gate, and this is
     what everything else then has to average. It is only worth saying when it
     is actually true. The old version clamped the exam figure into 0-100 and
     then called the clamp "the gate", which put two contradictory sentences on
     one screen: block 1 saying the exam average was already out of reach, and
     block 2 saying "land the remaining exams on 100.0% (the gate)". It also
     printed alternatives needing 137%. Both are now simply not offered. */
  let after=null;
  if(gate&&!gate.settled&&!gate.lost&&gate.need!=null&&gate.need>=0&&gate.need<=100){
    const nonW=c.leftW-gate.leftW;
    const ptsAfter=c.pts+gate.leftW*gate.need/100;
    const nd=nonW>0?over(t,nonW,ptsAfter,c.W):null;
    if(nd!=null&&nd<=100)
      after={examAt:gate.need,nonW:nonW,need:nd,landsAt:ptsAfter/c.W*100};
  }
  return {target:t,pass:pass,course:course,gate:gate,after:after,calc:c};
}
/* The shift. Five facts, and every one of them is a promise you made to

/* One row per course. The pill is the gate, not the grade, because the gate is

/* ---------------------------------------------------------------------------
   WHAT IS LATE

   Somebody who starts using this in week six has five weeks of ticks behind
   them, and no amount of good design makes forty checkboxes feel like a fresh
   start. So the backlog gets its own board at the top of Home, everything on
   it pulses until it is dealt with, and one button clears the lot.

   Clearing in bulk pays NO XP, deliberately. The XP in this app is for using
   the app; you did that coursework in a lecture hall weeks ago, and handing
   over four hundred points for one tap would make the number meaningless and
   would trip half the trophies on the way past. The button says so. */
const LATE_BACK=120;                       // how far back the board looks
function lateItems(){
  const from=S.profile.joined||"2000-01-01";

    .sort((a,b)=>a.date.localeCompare(b.date));

  const L=lateItems();

/* The front of the Study tab is four tiles and four one-line drawers. Everything
   a mode does is written on its own face, because a paragraph at the top of a
   screen is read once and then never again. */
/* ---------------------------------------------------------------------------
   ONE COURSE AT A TIME

   Study used to offer "All courses", and every number on the page was then
   computed over the merged bank: one ladder, one mastery, one set of weak
   spots. 308T has 58 questions and 314 has 35, so 308T dominated every
   average - "Name it: Mastered, 93%" was 308T's level 1 with 314's untouched
   level 1 folded in. That opened level 3 in a course whose level 1 had never
   been answered, and the level then reported "6 / 6" for a fourteen-question
   level because the old bar was six questions at 80%.

   They are different classes with different exams. There is no reading of
   "mastered" that spans them, so the merged view is gone: Study is always one
   course, and every level, every percentage and every weak spot on the page
   belongs to that course alone. */
/* ---------------------------------------------------------------------------
   STUDY, AS THREE SCREENS INSTEAD OF ONE PILE

   Study used to be a single page carrying course chips, four mode tiles and
   five collapsible drawers - binder, levels, before class, daily target, what
   you get wrong - all at once, with headings like "2 exams * 6 modules" that
   meant nothing until you opened them. Everything was reachable and nothing
   was clear.

   It is a path now, and each screen asks one question.

     pick  - which class?
     class - the binder for that class, plus a quick practice run
     exam  - which module inside this exam?
     weak  - what am I actually bad at, and where?

   The daily target has left the building: it is a commitment that runs in the
   background and reports on Home, not a thing to configure while you are
   trying to start studying. */
let studyAt="pick", studyExam=null;
function studyCrumb(label,back){
  if(back==="fightroster")return '<button type="button" class="crumb" id="fBack">\u2039 '+label+'</button>';
  return '<button type="button" class="crumb" data-sback="'+back+'">'+
    '<span aria-hidden="true">‹</span> '+esc(label)+'</button>';
}
function resumeCard(){
  const pk=parkedRound();if(!pk)return '';

    redo:"redo of the ones you missed",flagged:"flagged run",major:"major weak spots run",
    topic:"module round",review:"review",due:"run at your queue"}[pk.r.mode]||"round";

    '<span class="eyebrow">Where you left off</span>'+

      pk.r.i+' of '+pk.qs.length+' done</div>'+

  const cs=studyCourses();

    '<div class="card pad"><b>No study courses yet.</b><div class="note" style="margin-top:4px">Add a class on the Calendar tab and its questions will live here.</div></div>';
  /* Anything past the picker needs a real class. Resolve rather than bounce -
     landing back on the picker because courseFilter was still "all" loses the
     screen the user asked for. */
  if(studyAt!=="pick"&&!cs.some(c=>c.id===courseFilter))courseFilter=cs[0].id;

function artKind(name){
  const n=String(name||"").toLowerCase();
  if(/vision|eye|sight|ocular|retina|cataract|glaucoma/.test(n))return "vision";
  if(/hearing|balance|ear|audi|vestib|cochlea/.test(n))return "hearing";
  if(/pharm|medicat|drug|kinetic|dynamic|dose/.test(n))return "pharm";
  if(/geronto|chronic|aging|ageing|older|elder/.test(n))return "geront";
  if(/mental|psych|mood|cognit|depress/.test(n))return "mind";

/* A class code like "NUR 308T" says nothing about what is in it, so a course
   takes the motif of whatever it mostly teaches. */
function courseArtKind(cid){
  const c={};
  S.questions.filter(q=>!q.prime&&q.courseId===cid).forEach(q=>{
    const k=artKind(q.unit||"");c[k]=(c[k]||0)+1;});
  const keys=Object.keys(c).filter(k=>k!=="base");
  if(!keys.length)return null;
  keys.sort((a,b)=>c[b]-c[a]);
  return keys[0];

/* ---------------------------------------------------------------------------
   SEARCH

   One box over everything: the question itself, its options, the unit it came
   from and the concepts listed under that unit. "Glaucoma" should find the
   glaucoma questions whether or not the word "glaucoma" is in the stem, which
   is what searching the concept list buys.

   Results are drawn straight into the page rather than through render(), so
   the box keeps focus while you type. */
let FIND="";
const normal=x=>String(x||"").toLowerCase();
function searchHits(term){
  const t=normal(term).trim();
  if(t.length<2)return null;
  const words=t.split(/\s+/).filter(Boolean);
  const all=words.every.bind(words);
  const cs=studyCourses();
  const pool=S.questions.filter(q=>!q.prime&&cs.some(c=>c.id===q.courseId));
  /* A question is a hit when the words are in the question itself. The concept
     list belongs to the whole unit, so matching it makes the TOPIC a hit, not
     all forty of its questions - otherwise "cataract" returned every question
     about the eye and the four real ones were lost in them. */
  const qs=pool.filter(q=>{
    const c=courseById(q.courseId)||{};
    const h=normal([q.stem,(q.options||[]).join(" "),c.code,c.name].join(" | "));
    return all(w=>h.indexOf(w)>=0);
  });
  const units={};
  pool.forEach(q=>{const k=q.courseId+"||"+(q.unit||"");
    units[k]=units[k]||{courseId:q.courseId,unit:q.unit||"",qs:[],hits:0};
    units[k].qs.push(q);});
  qs.forEach(q=>{const u=units[q.courseId+"||"+(q.unit||"")];if(u)u.hits++;});
  const tops=Object.keys(units).map(k=>units[k]).filter(u=>{
    if(u.hits)return true;
    const h=normal(u.unit+" | "+unitConcepts(u.unit).join(" | "));
    return all(w=>h.indexOf(w)>=0);
  }).sort((a,b)=>b.hits-a.hits);
  /* what the big button runs: the questions themselves if any matched,
     otherwise everything under the topics that matched */
  const run=qs.length?qs:[].concat.apply([],tops.map(u=>u.qs));
  return {qs:qs,tops:tops,run:run};
}
/* The results are redrawn without render(), so they carry their own wiring. */
function wireFind(){
  const R=()=>searchHits(FIND);
  const go=$("#fAll");
  if(go)go.onclick=()=>{const r=R();if(!r||!r.run.length)return;
    const left=stillOpen(r.run), use=left.length?left:r.run;
    startSession(left.length?"topic":"review",'\u201c'+FIND.trim()+'\u201d',shuffle(use.slice()).map(q=>q.id));};
  $$("[data-ftop]").forEach(b=>b.onclick=()=>{
    const bits=b.dataset.ftop.split("||");
    const qs=S.questions.filter(q=>!q.prime&&q.courseId===bits[0]&&(q.unit||"")===bits[1]);
    if(!qs.length)return;
    courseFilter=bits[0];
    const left=stillOpen(qs), use=left.length?left:qs;
    startSession(left.length?"topic":"review",bits[1]||"Topic",shuffle(use.slice()).map(q=>q.id));});
  $$("[data-fq]").forEach(b=>b.onclick=()=>{
    const q=S.questions.find(x=>x.id===b.dataset.fq);if(!q)return;
    courseFilter=q.courseId;
    startSession("topic",q.unit||"One question",[q.id]);});
}

    const rowFor=(r,sub)=>{
      const l=stillOpen(r.qs).length;

    /* One topic in a content section is just a painting. Two or more get the
       section named once above them, so "Content 2" is not said twice. */
    if(g.single)return rowFor(g.rows[0],false);

      '<span>'+(lf?lf+' left of '+g.qs.length:'all '+g.qs.length+' right')+'</span></div>'+

/* ---------------------------------------------------------------------------
   HOT STREAK

   The roulette wheel was the wrong game. Three and a bit seconds of spinning
   bought exactly one question, so a ten-question round spent half a minute
   watching an animation - and a pie chart of multipliers is not a thing anyone
   wants to look at twice.

   This is push-your-luck instead, which is the oldest honest game mechanic
   there is: every right answer grows a pot and raises the multiplier, and at
   any moment you can bank what you have or keep going. Get one wrong and the
   unbanked pot is gone and a life with it. Three lives.

   No waiting anywhere. Question, answer, decision, next question - and the
   decision is the whole game, because the pot is only worth something once you
   choose to stop. */
const HS_MULT=[1,1,2,2,3,3,4,4,5,6,8,10];
const HS_LIVES=3;
const hsMult=n=>HS_MULT[Math.min(n,HS_MULT.length-1)];
let GAME=null;
function hsPool(){
  const src=GAME&&GAME.both
    ? S.questions.filter(q=>!q.prime&&studyCourses().some(c=>c.id===q.courseId))
    : filteredQuestions();
  /* things you have not nailed come first, but a run should never stall for
     lack of questions, so everything is in the bag */
  const open=stillOpen(src), rest=src.filter(q=>!open.includes(q));
  return shuffle(open.slice()).concat(shuffle(rest.slice()));
}
function hsStart(both){
  const g={both:!!both,lives:HS_LIVES,streak:0,best:0,pot:0,banked:0,
           answered:0,correct:0,picked:null,over:false,flash:null};
  GAME=g;
  g.bag=hsPool();
  if(!g.bag.length){GAME=null;toast("No questions yet","This game needs a question bank.");return;}
  g.i=0;g.q=g.bag[0];
  studyAt="game";render();window.scrollTo(0,0);
}
/* heat: the whole screen warms as the streak climbs, so you can feel the pot
   getting heavy without reading a number */
function hsHeat(n){
  if(n>=9)return "h4"; if(n>=6)return "h3"; if(n>=3)return "h2"; if(n>=1)return "h1"; return "";
}
function studyGame(){
  if(!GAME)return studyPick(studyCourses());
  const g=GAME, c=courseById(courseFilter)||{};
  const heat=hsHeat(g.streak);
  const head='<div class="vhead"><div>'+studyCrumb(g.both?"Study":esc(c.code||"Class"),g.both?"pick":"class")+
    '<h1 style="margin-top:6px" class="hstitle">Hot Streak</h1></div></div>';
  if(g.over){
    const best=S.profile.hsBest||0;
    return head+
     '<div class="card pad hsover">'+
       '<div class="hsbig">'+(g.banked>=best&&g.banked>0?"New best":"Run over")+'</div>'+
       '<div class="hsscore">'+g.banked+'</div>'+
       '<div class="note">'+g.correct+' right of '+g.answered+' · longest streak '+g.best+
         (g.xp?' · +'+g.xp+' XP':'')+'</div>'+
       '<div class="row" style="margin-top:16px;justify-content:center">'+
         '<button class="btn primary hsbtn" id="hsAgain">Run it again</button>'+
         '<button class="btn" data-sback="'+(g.both?"pick":"class")+'">Done</button></div>'+
     '</div>';
  }
  const q=g.q;
  const hearts=Array.from({length:HS_LIVES},(_,i)=>
    '<span class="hslife'+(i<g.lives?' on':'')+'">'+(i<g.lives?'♥':'♡')+'</span>').join("");
  return head+
  '<div class="hsbar '+heat+'">'+
    '<div class="hspot"><b>'+g.pot+'</b><i>in the pot</i></div>'+
    '<div class="hsmid">'+
      '<div class="hsx">×'+hsMult(g.streak)+'</div>'+
      '<div class="hsst">'+g.streak+' in a row</div></div>'+
    '<div class="hsright"><div class="hslives">'+hearts+'</div>'+
      '<div class="hsbank">banked '+g.banked+'</div></div>'+
  '</div>'+
  (g.pot?'<button class="hsbankbtn '+heat+'" id="hsBank">'+
     '<span>Bank '+g.pot+'</span><i>keep it and start a new run</i></button>':
     '<div class="hshint">Answer right to start a pot. You can bank it any time.</div>')+
  (g.flash?'<div class="hsflash '+(g.flash.ok?'ok':'no')+'">'+esc(g.flash.text)+'</div>':'')+
  '<div class="card pad hsq '+heat+'">'+
    '<p class="q">'+esc(q.stem)+'</p><div class="opts">'+
    optOrder(g,q).map((i,shown)=>{
      const o=q.options[i];
      let cls="opt";
      if(g.picked!==null){if(i===q.answer)cls+=" right";else if(i===g.picked)cls+=" wrong";}
      return '<button class="'+cls+'" data-hopt="'+i+'"'+(g.picked!==null?" disabled":"")+
        '><span class="k">'+"ABCDEF"[shown]+'</span><span>'+esc(o)+'</span></button>';}).join("")+'</div>'+
    (g.picked!==null?'<div class="rationale"><span class="eyebrow">'+
      (g.picked===q.answer?"Correct — why":"Why")+'</span>'+esc(q.rationale)+'</div>'+
      '<div class="row" style="margin-top:14px;justify-content:flex-end">'+
      '<button class="btn primary hsbtn" id="hsNext">'+(g.lives?"Next":"See the score")+'</button></div>':'')+
  '</div>';
}
function hsPick(i){
  const g=GAME;if(!g||g.picked!==null||g.over)return;
  const q=g.q, ok=i===q.answer;
  g.picked=i;g.answered++;
  q.seen=(q.seen||0)+1;q.lastSeen=today();
  if(ok){
    g.correct++;
    const gain=100*hsMult(g.streak);
    g.pot+=gain;g.streak++;g.best=Math.max(g.best,g.streak);
    q.wrong=Math.max(0,(q.wrong||0)-1);
    g.flash={ok:true,text:"+"+gain};
  }else{
    const lost=g.pot;
    g.pot=0;g.streak=0;g.lives--;
    q.wrong=(q.wrong||0)+1;
    logMiss(q,i);
    g.flash={ok:false,text:lost?"−"+lost+" — pot gone":"A life gone"};
  }
  schedule(q,ok&&(q.wrong||0)===0);
  S.profile.answered++;if(ok)S.profile.correct++;
  S.profile.curRun=ok?(S.profile.curRun||0)+1:0;
  S.profile.bestRun=Math.max(S.profile.bestRun||0,S.profile.curRun);
  saveQuestions([q]);
  render();
}
function hsBank(){
  const g=GAME;if(!g||!g.pot)return;
  g.banked+=g.pot;g.pot=0;g.streak=0;
  g.flash={ok:true,text:"Banked. Multiplier back to ×1."};
  render();
}
function hsNext(){
  const g=GAME;if(!g)return;
  g.flash=null;
  if(!g.lives)return hsEnd();
  g.picked=null;g.i++;
  if(g.i>=g.bag.length){g.bag=hsPool();g.i=0;}
  g.q=g.bag[g.i];
  render();
}
function hsEnd(){
  const g=GAME;if(!g||g.over)return;
  g.over=true;
  /* the pot dies with the last life - that is the whole bet */
  if(g.answered){
    logStudyDay();
    const bonus=g.banked>(S.profile.hsBest||0)?60:0;
    g.xp=g.correct*15+bonus;
    earnXp(g.xp);bumpToday(g.answered);
  }
  S.profile.hsBest=Math.max(S.profile.hsBest||0,g.banked);
  saveCore();checkTrophies();render();
}
